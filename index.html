                if (state.dragNode && !state.selectedNodeIds.includes(state.dragNode.id)) {
                    // Skip external drop target detection if dragging child within same parent
                    // (reorder/nest logic below handles this case)
                    const isDraggingChildWithinParent = state.dragNode.parentId !== null;

                    if (!isDraggingChildWithinParent) {
                        const canvasRect = document.getElementById('canvas-container').getBoundingClientRect();
                        const mx = (e.clientX - canvasRect.left - state.panX) / state.scale;
                        const my = (e.clientY - canvasRect.top - state.panY) / state.scale;
                        let candidates = [];

                        // Check all nodes (both root and child) for drop target detection
                        for (const node of state.nodes) {
                            if (node.id === state.dragNode.id) continue;
                            if (state.selectedNodeIds.includes(node.id)) continue;
                            if (state.hiddenNodeIds && state.hiddenNodeIds.has(node.id)) continue;
                            if (node.id === state.dragNode.parentId) continue; // skip dragged node's parent (handled by reorder/nest logic)
                            // Skip same-parent siblings (handled by reorder/nest logic below)
                            if (state.dragNode.parentId !== null && node.parentId === state.dragNode.parentId) continue;
                            // Skip descendants of dragNode to prevent circular nesting
                            let isDescendant = false;
                            let current = node;
                            while (current && current.parentId !== null) {
                                if (current.parentId === state.dragNode.id) {
                                    isDescendant = true;
                                    break;
                                }
                                current = state.nodes.find(n => n.id === current.parentId);
                            }
                            if (isDescendant) continue;

                            let nx, ny, nw, nh;

                            if (node.parentId === null) {
                                // Root node - use absolute coordinates
                                nx = node.x;
                                ny = node.y;
                                nw = node.width || 200;
                                nh = node.height || 50;
                                const domElRoot = document.querySelector(`.node[data-id="${node.id}"]`);
                                if (domElRoot) {
                                    nh = domElRoot.offsetHeight;
                                }
                            } else {
                                // Child node - use DOM bounding box
                                const domEl = document.querySelector(`.node[data-id="${node.id}"]`);
                                if (!domEl) continue;
                                const rect = domEl.getBoundingClientRect();
                                const canvasRect = document.getElementById('canvas-container').getBoundingClientRect();
                                nx = (rect.left - canvasRect.left - state.panX) / state.scale;
                                ny = (rect.top - canvasRect.top - state.panY) / state.scale;
                                nw = rect.width / state.scale;
                                nh = rect.height / state.scale;
                            }

                            // Bounding box hit test
                            if (mx >= nx && mx <= nx + nw && my >= ny && my <= ny + nh) {
                                const centerX = nx + nw / 2;
                                const centerY = ny + nh / 2;
                                const dist = Math.hypot(mx - centerX, my - centerY);
                                // Left/right half: store midX for left/right decision at mouseup
                                candidates.push({ node, dist, midX: nx + nw / 2 });
                            }
                        }

                        // Pick candidate with closest center to mouse
                        let targetNode = null;
                        let minDist = Infinity;
                        let targetMidX = 0;
                        for (const c of candidates) {
                            if (c.dist < minDist) {
                                minDist = c.dist;
                                targetNode = c.node;
                                targetMidX = c.midX;
                            }
                        }

                        // Clear all node indicators before updating
                        document.querySelectorAll('.node').forEach(el => {
                            el.classList.remove('reorder-before', 'reorder-after', 'nest-target');
                        });

                        if (targetNode) {
                            const targetDomEl = document.querySelector(`.node[data-id="${targetNode.id}"]`);
                            if (mx < targetMidX) {
                                // Left half → reorder/insert next to this node
                                const rect = targetDomEl ? targetDomEl.getBoundingClientRect() : null;
                                const canvasRect2 = document.getElementById('canvas-container').getBoundingClientRect();
                                const midY = rect ? ((rect.top + rect.bottom) / 2 - canvasRect2.top - state.panY) / state.scale : (targetNode.y + 25);
                                const insertBefore = my < midY;
                                state.reorderTarget = { siblingId: targetNode.id, insertBefore, siblingParentId: targetNode.parentId };
                                state.dropTarget = null;
                                // Show reorder badge on target node
                                if (targetDomEl) {
                                    targetDomEl.classList.add(insertBefore ? 'reorder-before' : 'reorder-after');
                                }
                                if (tooltip) {
                                    tooltip.textContent = insertBefore ? '\u25B2' : '\u25BC';
                                    tooltip.classList.add('show');
                                }
                            } else {
                                // Right half → nest into this node
                                state.dropTarget = targetNode;
                                state.reorderTarget = null;
                                // Show nest badge on target node
                                if (targetDomEl) {
                                    targetDomEl.classList.add('nest-target');
                                }
                                if (tooltip) {
                                    tooltip.textContent = '\u25B6';
                                    tooltip.classList.add('show');
                                }
                            }
                        } else {
                            state.dropTarget = null;
                            state.reorderTarget = null;
                            if (tooltip) tooltip.classList.remove('show');
                        }
                    }
                }

                // Detect reorder or nest target when dragging child within same parent
                if (state.dragNode && state.dragNode.parentId !== null) {
                    const parent = state.nodes.find(n => n.id === state.dragNode.parentId);
                    if (parent) {
                        const canvasRectC = document.getElementById('canvas-container').getBoundingClientRect();
                        const mx = (e.clientX - canvasRectC.left - state.panX) / state.scale;
                        const my = (e.clientY - canvasRectC.top - state.panY) / state.scale;
                        // Get parent position from DOM if possible (more accurate for nested nodes)
                        let px, py, pw, ph;
                        const parentDomEl2 = document.querySelector(`.node[data-id="${parent.id}"]`);
                        if (parentDomEl2) {
                            const parentRect2 = parentDomEl2.getBoundingClientRect();
                            px = (parentRect2.left - canvasRectC.left - state.panX) / state.scale;
                            py = (parentRect2.top - canvasRectC.top - state.panY) / state.scale;
                            pw = parentRect2.width / state.scale;
                            ph = parentRect2.height / state.scale;
                        } else {
                            const parentAbsPos = getNodeAbsolutePosition(parent);
                            px = parentAbsPos.x;
                            py = parentAbsPos.y;
                            pw = parent.width || 200;
                            ph = parent.height || 50;
                        }
                        // pw/ph used below
                        const MARGIN = 30;

                        // Check if mouse is outside parent bounds - prioritize extraction
                        const isOutsideParent = mx < px - MARGIN || mx > px + pw + MARGIN || my < py - MARGIN || my > py + ph + MARGIN;

                        if (isOutsideParent) {
                            // Mouse outside parent - check reorderTarget first, then dropTarget
                            if (state.reorderTarget) {
                                // Reorder mode - show up/down arrow to match node indicator
                                state.pendingExtract = false;
                                const insertBefore = state.reorderTarget.insertBefore;
                                if (tooltip) {
                                    tooltip.textContent = insertBefore ? '\u25B2' : '\u25BC';
                                    tooltip.classList.add('show');
                                }
                            } else if (!state.dropTarget) {
                                // Not over any other node - show extract
                                if (state.isDragging) {
                                    state.pendingExtract = true;
                                }
                                state.reorderTarget = null;
                                if (tooltip) {
                                    tooltip.textContent = '\u23CE';
                                    tooltip.classList.add('show');
                                }
                            } else {
                                // Over another node - show nest indicator
                                state.pendingExtract = false;
                                state.reorderTarget = null;
                                if (tooltip) {
                                    tooltip.textContent = '\u25B6';
                                    tooltip.classList.add('show');
                                }
                            }
                            // Clear same-parent indicators
                            const parentEl = document.querySelector(`.node[data-id="${parent.id}"]`);
                            if (parentEl) {
                                parentEl.querySelectorAll(':scope > .node-tasks > .node').forEach(el => {
                                    el.classList.remove('reorder-before', 'reorder-after', 'nest-target');
                                });
                            }
                        } else if (parent.children.length > 0) {
                            // Inside parent - find which sibling the mouse is over
                            const siblings = parent.children.filter(id => id !== state.dragNode.id);
                            const canvasRect = document.getElementById('canvas-container').getBoundingClientRect();
                            const parentEl = document.querySelector(`.node[data-id="${parent.id}"]`);

                            // Clear all indicators within the same parent
                            if (parentEl) {
                                parentEl.querySelectorAll(':scope > .node-tasks > .node').forEach(el => {
                                    el.classList.remove('reorder-before', 'reorder-after', 'nest-target');
                                });
                            }

                            // Find sibling the mouse is currently over (closest center wins)
                            let hitSiblingEl = null;
                            let hitSiblingId = null;
                            let hitSiblingMinDist = Infinity;
                            for (const siblingId of siblings) {
                                let el = null;
                                if (parentEl) {
                                    el = parentEl.querySelector(`:scope > .node-tasks > .node[data-id="${siblingId}"]`);
                                }
                                if (!el) el = document.querySelector(`.node[data-id="${siblingId}"]`);
                                if (!el) continue;
                                const rect = el.getBoundingClientRect();
                                // Convert mouse screen coords to canvas coords
                                const elLeft = (rect.left - canvasRect.left - state.panX) / state.scale;
                                const elRight = (rect.right - canvasRect.left - state.panX) / state.scale;
                                const elTop = (rect.top - canvasRect.top - state.panY) / state.scale;
                                const elBottom = (rect.bottom - canvasRect.top - state.panY) / state.scale;
                                if (mx >= elLeft && mx <= elRight && my >= elTop && my <= elBottom) {
                                    const centerX = (elLeft + elRight) / 2;
                                    const centerY = (elTop + elBottom) / 2;
                                    const dist = Math.hypot(mx - centerX, my - centerY);
                                    if (dist < hitSiblingMinDist) {
                                        hitSiblingMinDist = dist;
                                        hitSiblingEl = el;
                                        hitSiblingId = siblingId;
                                    }
                                }
                            }

                            if (hitSiblingEl) {
                                const rect = hitSiblingEl.getBoundingClientRect();
                                const elLeft = (rect.left - canvasRect.left - state.panX) / state.scale;
                                const elRight = (rect.right - canvasRect.left - state.panX) / state.scale;
                                const elMidX = (elLeft + elRight) / 2;
                                const elMidY = ((rect.top + rect.bottom) / 2 - canvasRect.top - state.panY) / state.scale;
                                const siblingNode = state.nodes.find(n => n.id === hitSiblingId);

                                if (mx < elMidX) {
                                    // Left half → reorder/insert
                                    const insertBefore = my < elMidY;
                                    hitSiblingEl.classList.add(insertBefore ? 'reorder-before' : 'reorder-after');
                                    state.reorderTarget = { siblingId: hitSiblingId, insertBefore, siblingParentId: parent.id };
                                    state.dropTarget = null;
                                    if (tooltip) {
                                        tooltip.textContent = insertBefore ? '\u25B2' : '\u25BC';
                                        tooltip.classList.add('show');
                                    }
                                } else {
                                    // Right half → nest into sibling
                                    if (siblingNode) {
                                        state.dropTarget = siblingNode;
                                        state.reorderTarget = null;
                                        hitSiblingEl.classList.add('nest-target');
                                        if (tooltip) {
                                            tooltip.textContent = '\u25B6';
                                            tooltip.classList.add('show');
                                        }
                                    }
                                }
                            } else {
                                // Not over any sibling - clear
                                state.reorderTarget = null;
                                state.dropTarget = null;
                                if (tooltip) tooltip.classList.remove('show');
                            }
                        }
                    }
                }

                renderNodes();
                renderConnections();
            }
        });

        window.addEventListener('touchmove', (e) => {
            // Update pending connection line for touch
            if ((state.connectingFrom || state.draggingConn) && e.touches.length === 1) {
                const touch = e.touches[0];
                updatePendingConnection(touch.clientX, touch.clientY);
            }

            if (state.isPanning && e.touches.length === 1) {
                const touch = e.touches[0];
                state.panX += touch.clientX - state.lastMouseX;
                state.panY += touch.clientY - state.lastMouseY;
                state.lastMouseX = touch.clientX;
                state.lastMouseY = touch.clientY;
                updateTransform();
            }

            if (e.touches.length === 2) {
                const dist = getPinchDistance(e.touches);
                const scale = state.lastPinchScale * (dist / state.lastPinchDist);
                setZoom(scale);
            }

            // Child drag for touch is now started directly on touchstart - no candidate needed (unified drag)

            if (state.dragNode && e.touches.length === 1) {
                const touch = e.touches[0];

                // Cancel long press if moved
                if (longPressTimer) {
                    const moveDist = Math.hypot(touch.clientX - state.lastMouseX, touch.clientY - state.lastMouseY);
                    if (moveDist > 10) {
                        clearTimeout(longPressTimer);
                        longPressTimer = null;
                        isLongPress = false;
                    }
                }

                const newX = (touch.clientX - state.panX) / state.scale - state.dragOffsetX;
                const newY = (touch.clientY - state.panY) / state.scale - state.dragOffsetY;

                // Calculate old absolute position
                let oldAbsX = state.dragNode.x;
                let oldAbsY = state.dragNode.y;
                if (state.dragNode.parentId !== null) {
                    const absPos = getNodeAbsolutePosition(state.dragNode);
                    oldAbsX = absPos.x;
                    oldAbsY = absPos.y;
                }

                const dx = newX - oldAbsX;
                const dy = newY - oldAbsY;

                // Update position (relative if child, absolute if parent)
                if (state.dragNode.parentId !== null) {
                    const parent = state.nodes.find(n => n.id === state.dragNode.parentId);
                    if (parent) {
                        const parentAbsPos = getNodeAbsolutePosition(parent);
                        state.dragNode.x = newX - parentAbsPos.x;
                        state.dragNode.y = newY - parentAbsPos.y;
                        state.dragNode.absX = newX;
                        state.dragNode.absY = newY;
                    }
                } else {
                    state.dragNode.x = newX;
                    state.dragNode.y = newY;
                }

                if (state.selectedNodeIds.length > 1) {
                    state.selectedNodeIds.forEach(id => {
                        if (id !== state.dragNode.id) {
                            const n = state.nodes.find(node => node.id === id);
                            if (n && n.parentId === null) {
                                n.x += dx;
                                n.y += dy;
                            }
                        }

                renderNodes();
                renderConnections();
                renderGroups();

            if (state.draggingConn && e.touches.length === 1) {
                const touch = e.touches[0];
                const mx = (touch.clientX - state.panX) / state.scale;
                const my = (touch.clientY - state.panY) / state.scale;

                let targetNode = null;
                for (const node of state.nodes) {
                    if (node.id === state.draggingConn.from) continue;
                    // Skip hidden nodes
                    if (state.hiddenNodeIds && state.hiddenNodeIds.has(node.id)) continue;

                    let nx = node.x;
                    let ny = node.y;
                    if (node.parentId !== null) {
                        const absPos = getNodeAbsolutePosition(node);
                        nx = absPos.x;
                        ny = absPos.y;
                    }

                    const nw = node.width || 200;
                    const domEl = document.querySelector(`.node[data-id="${node.id}"]`);
                    const nh = domEl ? domEl.offsetHeight : (node.height || 50);
                    if (mx >= nx && mx <= nx + nw && my >= ny && my <= ny + nh) {
                        targetNode = node;
                        break;
                    }
                }

                state.connDragTarget = targetNode;
                document.querySelectorAll('.node').forEach(el => {
                    const nid = parseInt(el.dataset.id);
                    if (targetNode && nid === targetNode.id) {
                        el.style.outline = '3px solid #4a90d9';
                        el.style.outlineOffset = '2px';
                    } else {
                        el.style.outline = '';
                        el.style.outlineOffset = '';
                    }
                });

        window.addEventListener('mouseup', () => {
            console.log('[DEBUG] window mouseup. dragNode=', state.dragNode ? state.dragNode.id : null, 'isDragging=', state.isDragging);
            state.isPanning = false;
            state.rightClickPanning = false;
            container.classList.remove('panning');
            if (state.isSelecting) {
                state.isSelecting = false;
                document.getElementById('selection-box').style.display = 'none';
            }

            // ドラッグ中はpendingPriorityClickをクリア
            if (state.isDragging) {
                state.pendingPriorityClick = null;
            }

            // Finalize connection drag
            if (state.draggingConn) {
                if (state.connDragTarget) {
                    const isSource = state.draggingConn.isSource;
                    const otherId = isSource ? state.draggingConn.to : state.draggingConn.from;
                    const targetId = state.connDragTarget.id;

                    if (targetId !== otherId) {
                        const exists = state.connections.some(c =>
                            c.from === (isSource ? targetId : otherId) && c.to === (isSource ? otherId : targetId)
                        );
                        if (!exists) {
                            if (isSource) {
                                state.draggingConn.from = targetId;
                            } else {
                                state.draggingConn.to = targetId;
                            }
                            renderConnections();
                            showToast('接続を変更しました');
                        } else {
                            showToast('同じ接続が既に存在します');
                        }
                    }
                }
                delete state.draggingConn.isSource;
                state.draggingConn = null;
                state.connDragTarget = null;
                document.querySelectorAll('.node').forEach(el => {
                    el.style.outline = '';
                    el.style.outlineOffset = '';
                });

            // Clear pending connection line
            const tempLine = document.getElementById('pending-connection');
            if (tempLine) tempLine.remove();

            // Calculate whether node was actually dragged (vs just clicked)
            const CLICK_THRESHOLD = 5;
            let wasDragged = false;
            if (state.dragNode) {
                let currentAbsX = state.dragNode.x;
                let currentAbsY = state.dragNode.y;
                if (state.dragNode.parentId !== null) {
                    // Use DOM position for child nodes (consistent with drag start)
                    const domEl = document.querySelector(`.node[data-id="${state.dragNode.id}"]`);
                    if (domEl) {
                        const rect = domEl.getBoundingClientRect();
                        const canvasRect = document.getElementById('canvas-container').getBoundingClientRect();
                        currentAbsX = (rect.left - canvasRect.left - state.panX) / state.scale;
                        currentAbsY = (rect.top - canvasRect.top - state.panY) / state.scale;
                    } else {
                        const absPos = getNodeAbsolutePosition(state.dragNode);
                        currentAbsX = absPos.x;
                        currentAbsY = absPos.y;

            const didNest = !!(wasDragged && state.dropTarget && state.dragNode && !state.reorderTarget);
            if (wasDragged && state.dropTarget && state.dragNode && !state.reorderTarget) {
                const child = state.dragNode;
                const parent = state.dropTarget;

                let current = parent;
                let isCircular = false;

                if (!isCircular && child.id !== parent.id) {
                    // Remove from old parent's children array
                    if (child.parentId !== null) {

                        if (oldParent) {
                            oldParent.children = oldParent.children.filter(id => id !== child.id);
                            // Calculate absolute position using recursive helper
                            const absPos = getNodeAbsolutePosition(child);
                            child.x = absPos.x;
                            child.y = absPos.y;

                    child.parentId = parent.id;
                    // Add to new parent's children array
                    if (!parent.children) parent.children = [];
                    parent.children.push(child.id);
                    // Get actual parent height from DOM if available
                    let parentDomEl = document.querySelector(`.node[data-id="${parent.id}"]`);
                    if (!parentDomEl) parentDomEl = document.querySelector(`.node[data-id="${parent.id}"]`);
                    const parentHeight = parentDomEl ? parentDomEl.offsetHeight : (parent.height || 50);
                    // Position child within parent's task list area (relative coordinates)
                    child.x = 20;
                    child.y = parentHeight + 10;
                    // Adjust child width to fit parent
                    child.width = Math.max(160, (parent.width || 200) - 40);

                    if (state.dragNode.parentId !== null) {
                        const oldParent = state.nodes.find(n => n.id === state.dragNode.parentId);
                        if (oldParent && oldParent.children) {
                            oldParent.children = oldParent.children.filter(id => id !== state.dragNode.id);

                        const absPos = getNodeAbsolutePosition(state.dragNode);
                        state.dragNode.x = absPos.x;
                        state.dragNode.y = absPos.y;
                        state.dragNode.parentId = null;
                        state.dragNode.width = calculateNodeWidth(state.dragNode.title);

                    const targetNode = state.nodes.find(n => n.id === state.reorderTarget.siblingId);
                    if (targetNode) {
                        let tx = targetNode.x;
                        let ty = targetNode.y;
                        if (targetNode.parentId !== null) {
                            const absPos = getNodeAbsolutePosition(targetNode);
                            tx = absPos.x;
                            ty = absPos.y;

                        state.dragNode.x = tx;
                        state.dragNode.y = ty + (targetNode.height || 50) + 20;
                    }
                    didReorder = true;
                    showToast('ノードを移動しました');
                } else {
                    // Target has a parent - move dragged node to that parent's children
                    const newParent = state.nodes.find(n => n.id === siblingParentId);
                    if (newParent) {
                        if (state.dragNode.parentId !== null) {
                            const oldParent = state.nodes.find(n => n.id === state.dragNode.parentId);
                            if (oldParent && oldParent.id === newParent.id) {
                                // Same parent - reorder within array (don't remove first)
                                const fromIndex = newParent.children.indexOf(state.dragNode.id);
                                const toIndex = newParent.children.indexOf(state.reorderTarget.siblingId);
                                if (fromIndex !== -1 && toIndex !== -1) {
                                    newParent.children.splice(fromIndex, 1);
                                    let insertIndex = toIndex;
                                    if (fromIndex < toIndex) {
                                        insertIndex = state.reorderTarget.insertBefore ? toIndex - 1 : toIndex;
                                    } else {
                                        insertIndex = state.reorderTarget.insertBefore ? toIndex : toIndex + 1;
                                    }
                                    newParent.children.splice(insertIndex, 0, state.dragNode.id);
                                    didReorder = true;
                                    showToast('順序を変更しました');
                                }
                            } else {
                                // Different parent - remove from old, add to new
                                if (oldParent && oldParent.children) {
                                    oldParent.children = oldParent.children.filter(id => id !== state.dragNode.id);
                                    if (oldParent.children.length === 0) {
                                        oldParent.expanded = false;
                                    }
                                }
                                const parentAbsPos = getNodeAbsolutePosition(newParent);
                                const absPos = getNodeAbsolutePosition(state.dragNode);
                                state.dragNode.x = absPos.x - parentAbsPos.x;
                                state.dragNode.y = absPos.y - parentAbsPos.y;
                                state.dragNode.parentId = siblingParentId;
                                if (!newParent.children) newParent.children = [];
                                const toIndex = newParent.children.indexOf(state.reorderTarget.siblingId);
                                let insertIndex = toIndex !== -1 ?
                                    (state.reorderTarget.insertBefore ? toIndex : toIndex + 1) :
                                    newParent.children.length;
                                newParent.children.splice(insertIndex, 0, state.dragNode.id);
                                didReorder = true;
                                showToast('順序を変更しました');
                            }
                        } else {
                            // Dragged node is a root node - convert to child
                            const parentAbsPos = getNodeAbsolutePosition(newParent);
                            state.dragNode.parentId = siblingParentId;
                            state.dragNode.x = state.dragNode.x - parentAbsPos.x;
                            state.dragNode.y = state.dragNode.y - parentAbsPos.y;
                            if (!newParent.children) newParent.children = [];
                            const toIndex = newParent.children.indexOf(state.reorderTarget.siblingId);
                            let insertIndex = toIndex !== -1 ?
                                (state.reorderTarget.insertBefore ? toIndex : toIndex + 1) :
                                newParent.children.length;
                            newParent.children.splice(insertIndex, 0, state.dragNode.id);
                            didReorder = true;
                            showToast('順序を変更しました');

                            const parentAbsPos = getNodeAbsolutePosition(newParent);
                            state.dragNode.x = 20;
                            state.dragNode.y = (newParent.height || 50) + 10;
                            state.dragNode.width = Math.max(160, (newParent.width || 200) - 40);

                            showToast('順序を変更しました');

            // Uses mousemove-time detection via state.pendingExtract for accurate user intent
            let didExtract = false;
            if (!didReorder && !didNest && wasDragged && state.dragNode && state.dragNode.parentId !== null) {

                    const parent = state.nodes.find(n => n.id === state.dragNode.parentId);

                        state.dragNode.x = absPos.x;
                        state.dragNode.y = absPos.y;
                        state.dragNode.parentId = null;

            // Unified hit detection: bounding box overlap + closest center wins
            if (!didExtract && !didNest && wasDragged && state.dragNode) {
                const canvasRect = document.getElementById('canvas-container').getBoundingClientRect();
                let dropX = state.dragNode.x;
                let dropY = state.dragNode.y;
                if (state.dragNode.parentId !== null) {
                    const absPos = getNodeAbsolutePosition(state.dragNode);
                    dropX = absPos.x;
                    dropY = absPos.y;
                }
                let candidates = [];

                for (const n of state.nodes) {
                    if (n.id === state.dragNode.id) continue;

                    if (state.hiddenNodeIds && state.hiddenNodeIds.has(n.id)) continue;
                    // Skip descendants to prevent circular nesting
                    let isDescendant = false;
                    let current = n;
                    while (current && current.parentId !== null) {
                        if (current.parentId === state.dragNode.id) {
                            isDescendant = true;
                            break;
                        }
                        current = state.nodes.find(node => node.id === current.parentId);
                    }
                    if (isDescendant) continue;

                    let nx, ny, nw, nh;
                    if (n.parentId === null) {
                        nx = n.x;
                        ny = n.y;
                        nw = n.width || 200;
                        const domEl = document.querySelector(`.node[data-id="${n.id}"]`);
                        nh = domEl ? domEl.offsetHeight : (n.height || 50);
                    } else {
                        const domEl = document.querySelector(`.node[data-id="${n.id}"]`);
                        if (!domEl) continue;
                        const rect = domEl.getBoundingClientRect();
                        nx = (rect.left - canvasRect.left - state.panX) / state.scale;
                        ny = (rect.top - canvasRect.top - state.panY) / state.scale;
                        nw = rect.width / state.scale;
                        nh = rect.height / state.scale;
                    }

                    // Bounding box hit test
                    if (dropX >= nx && dropX <= nx + nw && dropY >= ny && dropY <= ny + nh) {
                        const centerX = nx + nw / 2;
                        const centerY = ny + nh / 2;
                        const dist = Math.hypot(dropX - centerX, dropY - centerY);
                        candidates.push({ node: n, dist });
                    }
                }

                // Pick candidate with closest center to drop position
                let nearestNode = null;
                let minDist = Infinity;
                for (const c of candidates) {
                    if (c.dist < minDist) {
                        minDist = c.dist;
                        nearestNode = c.node;
                    }
                }

                if (nearestNode) {
                    // Remove from old parent's children
                    if (state.dragNode.parentId !== null) {
                        const oldParent = state.nodes.find(n => n.id === state.dragNode.parentId);
                        if (oldParent && oldParent.children) {
                            oldParent.children = oldParent.children.filter(id => id !== state.dragNode.id);
                            if (oldParent.children.length === 0) {
                                oldParent.expanded = false;
                            }
                        }

                    // Add to new parent's children
                    if (!nearestNode.children) nearestNode.children = [];
                    if (!nearestNode.children.includes(state.dragNode.id)) {
                        nearestNode.children.push(state.dragNode.id);
                    }
                    state.dragNode.parentId = nearestNode.id;
                    state.dragNode.x = 10;
                    state.dragNode.y = 10;
                    state.dragNode.expanded = false;
                    nearestNode.expanded = true;
                    showToast('ノードを移動しました');
                }
            }

            document.querySelectorAll('.node').forEach(el => {

            });

            state.dragNode = null;
            state.pendingExtract = false;
            const tooltip = document.getElementById('drag-tooltip');
            if (tooltip) tooltip.classList.remove('show');
            renderNodes();
            renderConnections();

            state.pendingExtract = false;

            // End resize
            if (state.resizingNode) {

                if (state.resizingNode.parentId !== null) {
                    const parentNode = state.nodes.find(n => n.id === state.resizingNode.parentId);
                    if (parentNode) {
                        state.resizingNode.x = state.resizingNode.absX - parentNode.x;
                        state.resizingNode.y = state.resizingNode.absY - parentNode.y;
                    }
                }
                document.querySelectorAll('.node.resizing').forEach(el => {
                    el.classList.remove('resizing');
                });
                document.querySelectorAll('.resize-handle.resizing').forEach(el => {
                    el.classList.remove('resizing');

        window.addEventListener('touchend', (e) => {
            state.isPanning = false;
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
            if (state.isSelecting) {
                state.isSelecting = false;
                document.getElementById('selection-box').style.display = 'none';
            }

            // Finalize connection drag
            if (state.draggingConn) {
                const touch = e.changedTouches[0];
                if (touch) {
                    const mx = (touch.clientX - state.panX) / state.scale;
                    const my = (touch.clientY - state.panY) / state.scale;
                    // Unified hit detection: closest center wins
                    let candidates = [];
                    for (const node of state.nodes) {
                        if (node.id === state.draggingConn.from || node.id === state.draggingConn.to) continue;
                        let nx = node.x;
                        let ny = node.y;
                        if (node.parentId !== null) {
                            const absPos = getNodeAbsolutePosition(node);
                            nx = absPos.x;
                            ny = absPos.y;
                        }
                        const nw = node.width || 200;
                        const domEl = document.querySelector(`.node[data-id="${node.id}"]`);
                        const nh = domEl ? domEl.offsetHeight : (node.height || 50);
                        if (mx >= nx && mx <= nx + nw && my >= ny && my <= ny + nh) {
                            const centerX = nx + nw / 2;
                            const centerY = ny + nh / 2;
                            const dist = Math.hypot(mx - centerX, my - centerY);
                            candidates.push({ node, dist });
                        }
                    }
                    let targetNode = null;
                    let minDist = Infinity;
                    for (const c of candidates) {
                        if (c.dist < minDist) {
                            minDist = c.dist;
                            targetNode = c.node;
                        }
                    }
                    if (targetNode) {
                        const isSource = state.draggingConn.isSource;
                        const otherId = isSource ? state.draggingConn.to : state.draggingConn.from;
                        const targetId = targetNode.id;

                        if (targetId !== otherId) {
                            const exists = state.connections.some(c =>
                                c.from === (isSource ? targetId : otherId) && c.to === (isSource ? otherId : targetId)
                            );
                            if (!exists) {
                                if (isSource) {
                                    state.draggingConn.from = targetId;
                                } else {
                                    state.draggingConn.to = targetId;
                                }
                                renderConnections();
                                showToast('接続を変更しました');
                            } else {
                                showToast('同じ接続が既に存在します');
                            }
                        }
                    }
                }
                delete state.draggingConn.isSource;
                state.draggingConn = null;
                state.connDragTarget = null;
                document.querySelectorAll('.node').forEach(el => {
                    el.style.outline = '';
                    el.style.outlineOffset = '';
                });
            }

            // Clear pending connection line
            const tempLine = document.getElementById('pending-connection');
            if (tempLine) tempLine.remove();

            state.dragNode = null;

            // Clear drag tooltip for touch
        });

        function getPinchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

            if (e.key === ' ' && !state.isPanning) {
                e.preventDefault();

            if (e.key === 'v' || e.key === 'V') setMode('select');
            if (e.key === 'n' || e.key === 'N') setMode('node');
            if (e.key === 'c' || e.key === 'C') setMode('connect');

                    if (name) {
                        createGroup([...state.selectedNodeIds], name);
                        clearSelection();
                    }
                } else {
                    setMode('group');

            }

            if (e.key === 'u' || e.key === 'U') {
                if (state.selectedNodeId) {
                    const node = state.nodes.find(n => n.id === state.selectedNodeId);
                    if (node && node.parentId !== null) {
                        const oldParent = state.nodes.find(n => n.id === node.parentId);
                        if (oldParent && oldParent.children) {

                            if (oldParent.children.length === 0) {

                        node.width = calculateNodeWidth(node.title);
                        renderNodes();
                        showToast('親子関係を解除しました');

                }
            }

            if (e.key === 'Delete' || e.key === 'Backspace') {
                // Skip if user is typing in an input, textarea, or contenteditable
                const active = document.activeElement;
                if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) {
                    return;

                if (state.selectedNodeIds.length > 0) {

                if (tempLine) tempLine.remove();
                modeIndicator.classList.remove('active');

        function saveToFile(overwrite = false) {
            const data = {
                version: 2,
                nodes: state.nodes,
                connections: state.connections,
                nextId: state.nextId
            };
            const json = JSON.stringify(data, null, 2);

            // Try File System Access API for overwrite save
            if (overwrite && state.lastFileHandle) {
                return state.lastFileHandle.createWritable().then(writable => {
                    return writable.write(json).then(() => {
                        writable.close();
                        showToast('上書き保存しました');
                        updateFileInfoDisplay(new Date());
                    });
                }).catch(err => {
                    console.error('Overwrite save failed:', err);
                    // Fallback to download
                    downloadJSON(json);
                });
            }

            // Show save file picker for "Save As"
            if ('showSaveFilePicker' in window) {
                const opts = {
                    suggestedName: state.lastFileName || `taskmind-${new Date().toISOString().slice(0,10)}.json`,
                    types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }]
                };
                return window.showSaveFilePicker(opts).then(handle => {
                    state.lastFileHandle = handle;
                    state.lastFileName = handle.name;
                    updateFileInfoDisplay(); // ファイル名のみ先行表示
                    return handle.createWritable().then(writable => {
                        return writable.write(json).then(() => {
                            writable.close();
                            showToast('保存しました');
                            updateFileInfoDisplay(new Date());
                        });
                    });
                }).catch(err => {
                    if (err.name !== 'AbortError') {
                        console.error('Save picker failed:', err);
                        downloadJSON(json);
                    }
                });
            }

            // Fallback: download
            downloadJSON(json);
            return Promise.resolve();
        }

        function updateFileInfoDisplay() {}

        function downloadJSON(json) {
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = state.lastFileName || `taskmind-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('保存しました');
        }

        async function loadFromFile(file = null) {
            // File System Access API path
            if (!file && 'showOpenFilePicker' in window) {
                try {
                    const [handle] = await window.showOpenFilePicker({
                        types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }],
                        multiple: false
                    });
                    state.lastFileHandle = handle;
                    state.lastFileName = handle.name;
                    const fileObj = await handle.getFile();
                    await parseFileData(fileObj);
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return;
                    console.error('Open picker failed:', err);
                    // Fall through to legacy input method
                }
            }

            // Legacy path (from file input or fallback)
            if (file) {
                state.lastFileName = file.name;
                await parseFileData(file);
            }
        }

        function parseFileData(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        state.nodes = (data.nodes || []).map(n => {
                            const node = {
                                ...n,
                                completed: n.completed ?? false
                            };
                            // Inject missing 5W1H fields for backward compatibility
                            if (typeof node.priority !== 'number') node.priority = 0;
                            if (!node.details || typeof node.details !== 'object') {
                                node.details = {
                                    when: { cycle: '', startDate: '', deadline: '' },
                                    what: '',
                                    who: '',
                                    where: ''
                                };
                            }
                            if (!node.details.when || typeof node.details.when !== 'object') {
                                node.details.when = { cycle: '', startDate: '', deadline: '' };
                            }
                            delete node.tasks;
                            return node;
                        });

                        // Build children arrays from parentId for old data compatibility
                        state.nodes.forEach(node => {
                            if (!node.children || node.children.length === 0) {
                                node.children = state.nodes
                                    .filter(n => n.parentId === node.id)
                                    .map(n => n.id);
                            }
                        });
                        state.connections = data.connections || [];
                        state.nextId = data.nextId || 1;

                        renderNodes();
                        renderConnections();
                        fitToView();
                        // ロード時にwhen再計算実行
                        recalculateWhenDates();
                        showToast('読込みました' + (state.lastFileName ? ` (${state.lastFileName})` : ''));
                        updateFileInfoDisplay(new Date());
                        resolve();
                    } catch (err) {
                        showToast('読込エラー: ' + err.message);
                        resolve();
                    }
                };
                reader.readAsText(file);
            });
        }

        document.getElementById('btn-save').addEventListener('click', () => {
            if (saveInProgress) return;
            saveInProgress = true;
            saveToFile(true).finally(() => { saveInProgress = false; });
        });
        document.getElementById('btn-load').addEventListener('click', () => {
            if ('showOpenFilePicker' in window) {
                loadFromFile();
            } else {
                fileInput.click();
            }
        });
        document.getElementById('btn-recalc').addEventListener('click', () => {
            recalculateWhenDates();
            showToast('When再計算完了');
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) loadFromFile(e.target.files[0]);
        });

        // Ctrl+S: overwrite save, Ctrl+Shift+S: save as
        let saveInProgress = false;
        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                if (e.repeat) return;
                const active = document.activeElement;
                if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) {
                    return;
                }
                e.preventDefault();
                if (saveInProgress) {
                    showToast('保存処理中です...');
                    return;
                }
                saveInProgress = true;
                const overwrite = !e.shiftKey;
                saveToFile(overwrite).finally(() => {
                    saveInProgress = false;
                });
            }
        });

        // ==================== Utils ====================
        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), 2000);
        }

        // ==================== Init ====================
        // Create sample data
        const node1 = createNode(100, 100, 'メイン');
        node1.completed = false;
        const node2 = createNode(400, 80, 'タスクA');
        node2.completed = false;
        const node3 = createNode(400, 250, 'タスクB');
        node3.completed = false;

        // No parent-child relationship for initial nodes - they are independent
        // Users can nest them via drag & drop if needed

        createConnection(1, 2, '依頼');
        createConnection(1, 3, '実装');

        fitToView();
        // fetch Last-Modified header to show file update time
        fetch('index.html', { method: 'HEAD', cache: 'no-store' })
            .then(r => {
                const lm = r.headers.get('Last-Modified');
                const el = document.getElementById('file-info');
                if (el && lm) {
                    const d = new Date(lm);
                    const pad = n => String(n).padStart(2, '0');
                    el.textContent = '🕐 ' + d.getFullYear() + '/' + pad(d.getMonth()+1) + '/' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
                }
            })
            .catch(() => {});

        // ==================== When Recalculation ====================
        /**
         * 全ノードのwhenを再計算
         * - nextDateが現在時刻を過ぎていたらノードを再有効化(completed=false)
         * - 次回日時を再計算してnextDateを更新
         * @returns {number} 再有効化したノード数
         */
        function recalculateWhenDates() {
            const now = new Date();
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const activatedNodes = [];
            const startedNodes = [];

            state.nodes.forEach(node => {
                const w = node.details?.when;
                if (!w || !w.repeatType || w.repeatType === 'none') return;

                const nextDate = w.nextDate ? new Date(w.nextDate) : null;
                if (!nextDate) return;

                const nextDateStart = new Date(nextDate.getFullYear(), nextDate.getMonth(), nextDate.getDate());

                if (node.completed) {
                    // 完了状態で開始日を過ぎていれば有効化(日付のみ比較)
                    if (nextDateStart <= todayStart) {
                        node.completed = false;
                        activatedNodes.push({ title: node.title, date: nextDate });
                        console.log(`[When] ノード「${node.title}」を有効化(開始日: ${nextDate.toLocaleDateString('ja-JP')})`);
                    }
                } else {
                    // 有効状態で開始日時を通過していれば通知
                    if (nextDate <= now) {
                        startedNodes.push({ title: node.title, date: nextDate });
                        console.log(`[When] ノード「${node.title}」の開始時刻を通過(${nextDate.toLocaleString('ja-JP')})`);
                    }
                }

                // 次回日時を再計算(有効化・通知の有無に関わらず)
                const newNextDate = calculateNextDate(w);
                if (newNextDate) {
                    w.nextDate = newNextDate.toISOString();
                }
            });

            // --- 有効化通知 ---
            const activatedCount = activatedNodes.length;
            if (activatedCount > 0) {
                renderNodes();

                // 画面内トースト
                if (activatedCount === 1) {
                    showToast(`「${activatedNodes[0].title}」を有効化しました`);
                } else {
                    const titles = activatedNodes.map(n => `・${n.title}`).join('\n');
                    showToast(`${activatedCount}個のタスクを有効化しました\n${titles}`);
                }

                // デスクトップ通知
                sendWhenNotification(
                    activatedCount === 1 ? 'タスクを有効化しました' : `${activatedCount}個のタスクを有効化しました`,
                    activatedCount === 1
                        ? `「${activatedNodes[0].title}」が本日の予定です`
                        : activatedNodes.map(n => `・${n.title}`).join('\n')
                );
                // アクティブ化要求
                requestAttention(activatedCount);
            }

            // --- 開始時刻通過通知 ---
            const startedCount = startedNodes.length;
            if (startedCount > 0) {
                // 画面内トースト
                if (startedCount === 1) {
                    showToast(`「${startedNodes[0].title}」の開始時刻です`);
                } else {
                    const titles = startedNodes.map(n => `・${n.title}`).join('\n');
                    showToast(`${startedCount}個のタスクが開始時刻を通過しました\n${titles}`);
                }

                // デスクトップ通知
                sendWhenNotification(
                    startedCount === 1 ? '開始時刻を通過しました' : `${startedCount}個のタスクが開始時刻を通過しました`,
                    startedCount === 1
                        ? `「${startedNodes[0].title}」の開始時刻を通過しました`
                        : startedNodes.map(n => `・${n.title}`).join('\n')
                );
                // アクティブ化要求
                requestAttention(startedCount);
            }

            return activatedCount + startedCount;
        }

        // デスクトップ通知送信ヘルパー
        function sendWhenNotification(title, body) {
            if (!('Notification' in window)) return;
            const send = () => {
                const n = new Notification(title, { body: body, icon: '/favicon.ico' });
                // 通知クリックでウィンドウをアクティブ化
                n.addEventListener('click', () => {
                    window.focus();
                    if (navigator.clearAppBadge) navigator.clearAppBadge();
                });
            };
            if (Notification.permission === 'granted') {
                send();
            } else if (Notification.permission === 'default') {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') send();
                });
            }
        }

        // アクティブ化要求(タスクバー明滅・タブ点滅・バッジ)
        function requestAttention(count) {
            // 1. ウィンドウ前面化(ブラウザが許可する場合)
            try { window.focus(); } catch (e) {}

            // 2. タスクバー/ドックバッジ(Chrome/Edge対応)
            if (navigator.setAppBadge) {
                navigator.setAppBadge(count).catch(() => {});
            }

            // 3. タイトル点滅
            flashTitle(count);
        }

        let _flashInterval = null;
        let _originalTitle = document.title;
        function flashTitle(count) {
            if (_flashInterval) return;
            const msg = count ? `【${count}件】` : '【通知】';
            let on = false;
            _flashInterval = setInterval(() => {
                document.title = on ? _originalTitle : msg + _originalTitle;
                on = !on;
            }, 1000);
            // 10秒後に停止
            setTimeout(() => { stopFlashTitle(); }, 10000);
        }
        function stopFlashTitle() {
            if (_flashInterval) {
                clearInterval(_flashInterval);
                _flashInterval = null;
                document.title = _originalTitle;
            }
        }
        // ユーザーが画面をクリックしたら点滅停止
        document.addEventListener('click', stopFlashTitle);
        document.addEventListener('keydown', stopFlashTitle);

        // 自動再計算: 1分ごとにチェック
        setInterval(() => {
            recalculateWhenDates();
        }, 60000);

        // 初期ロード時にも実行
        recalculateWhenDates();
    </script>
</body>
</html>
