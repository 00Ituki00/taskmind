        // アクティブ化要求(タスクバー明滅・タブ点滅・バッジ)
        // 非アクティブ時はより強力な視覚的アプローチを取る
        function requestAttention(count, priority = 3) {
            const hidden = isPageHidden();

            // 1. ウィンドウ前面化（非アクティブ時は複数回試行）
            const tryFocus = () => {
                try {
                    window.focus();
                    if (window.opener) window.opener.focus();
                } catch (e) {}
            };
            tryFocus();
            if (hidden) {
                setTimeout(tryFocus, 100);
                setTimeout(tryFocus, 300);
                setTimeout(tryFocus, 1000);
            }

            // 2. タスクバー/ドックバッジ（非アクティブ時のみ）
            if (hidden && navigator.setAppBadge) {
                navigator.setAppBadge(count).catch(() => {});
            }

            // 3. タイトル点滅（非アクティブ時は長く続ける、優先度に応じて）
            const duration = hidden ? (priority >= 4 ? 60000 : 30000) : 10000;
            flashTitle(count, duration);

            // 4. 振動（モバイル対応、非アクティブ時のみ）
            if (hidden && navigator.vibrate) {
                navigator.vibrate([200, 100, 200, 100, 200]);
            }

            console.log('[Attention] Requested, hidden=' + hidden + ', priority=' + priority + ', duration=' + duration);
        }

        let _flashInterval = null;
        let _originalTitle = document.title;
        function flashTitle(count, duration = 10000) {
            if (_flashInterval) return;
            const msg = count ? `【${count}件】` : '【通知】';
            let on = false;
            _flashInterval = setInterval(() => {
                document.title = on ? _originalTitle : msg + _originalTitle;
                on = !on;
            }, 1000);
            // 指定時間後に停止
            setTimeout(() => { stopFlashTitle(); }, duration);
        }
        function stopFlashTitle() {
            if (_flashInterval) {
                clearInterval(_flashInterval);
                _flashInterval = null;
                document.title = _originalTitle;
            }
        }
        // ユーザーが画面をクリックしたら点滅停止
        document.addEventListener('click', stopFlashTitle);
        document.addEventListener('keydown', stopFlashTitle);

        // ============ Browser Notification API ============
        let _notificationEnabled = false;
        let _notifiedTasks = new Set(); // 通知済みタスク追跡

        async function requestNotificationPermission() {
            console.log('[Notify] requestNotificationPermission called');
            if (!('Notification' in window)) {
                console.log('[Notify] Notification API not supported');
                showToast('このブラウザは通知をサポートしていません');
                updateNotifyButton(false, true);
                return false;
            }
            console.log('[Notify] Current permission:', Notification.permission);
            if (Notification.permission === 'granted') {
                _notificationEnabled = true;
                updateNotifyButton(true);
                console.log('[Notify] Already granted');
                return true;
            }
            if (Notification.permission === 'denied') {
                console.log('[Notify] Permission denied');
                showToast('通知がブロックされています。ブラウザ設定で許可してください');
                updateNotifyButton(false, true);
                return false;
            }
            console.log('[Notify] Requesting permission...');
            try {
                // 古いブラウザではコールバック式、新しいブラウザではPromise式
                let permission;
                const result = Notification.requestPermission();
                if (result && typeof result.then === 'function') {
                    permission = await result;
                } else {
                    permission = result;
                }
                console.log('[Notify] Permission result:', permission);
                if (permission === 'granted') {
                    _notificationEnabled = true;
                    updateNotifyButton(true);
                    showToast('通知が有効になりました');
                    // テスト通知（エラーがあっても無視）
                    setTimeout(() => {
                        try {
                            new Notification('TaskMind', { body: '通知が有効になりました' });
                        } catch (e) {
                            console.log('[Notify] Test notification failed:', e);
                        }
                    }, 100);
                    return true;
                } else {
                    updateNotifyButton(false, true);
                    showToast('通知が許可されませんでした');
                    return false;
                }
            } catch (err) {
                console.error('[Notify] Error requesting permission:', err);
                showToast('通知エラー: ' + err.message);
                updateNotifyButton(false, true);
                return false;
            }
        }

        function updateNotifyButton(active, denied = false) {
            const btn = document.getElementById('btn-notify');
            if (!btn) {
                console.log('[Notify] Button not found');
                return;
            }
            btn.classList.remove('notify-active', 'notify-denied');
            if (active) {
                btn.classList.add('notify-active');
                btn.title = '通知有効';
                console.log('[Notify] Button set to active');
            } else if (denied) {
                btn.classList.add('notify-denied');
                btn.title = '通知ブロック中';
                console.log('[Notify] Button set to denied');
            } else {
                btn.title = '通知許可 (ブラウザ通知を有効化)';
                console.log('[Notify] Button set to default');
            }
        }

        function sendNotification(title, body, options = {}) {

            const notif = new Notification(title, {
                body: body,

            return notif;
        }

        // タスク開始時刻チェック（5分前通知 + 開始時刻通知）
        function checkTaskReminders() {
            const now = new Date();

            state.nodes.forEach(node => {
                if (node.completed) return;
                const w = node.details?.when;
                // 'disabled' のみスキップ
                if (!w || w.repeatType === 'disabled') return;

                // 次回開始時刻を取得（recalculateWhenDates()で更新されたnextDateを使用）
                const nextStart = w.nextDate ? new Date(w.nextDate) : null;
                if (!nextStart || isNaN(nextStart.getTime())) return;

                // 開始済み（過去）のタスクは通知済みとしてマークしてスキップ
                if (nextStart <= now) {
                    const startedKey = node.id + '-started-' + nextStart.toISOString().slice(0, 16);
                    if (!_notifiedTasks.has(startedKey)) {
                        _notifiedTasks.add(startedKey);
                        console.log('[Notify] 開始済みタスクを通知済みとしてマーク:', node.title);
                    }
                    return;
                }

                // 開始までの残り時間（分）
                const diffMs = nextStart.getTime() - now.getTime();
                const diffMin = Math.round(diffMs / 60000);
                const timeKey = nextStart.toISOString().slice(0, 16);
                const priority = node.details?.priority || 3;

                // ① 開始5分前通知（diffMinが5の時に1回）
                const preNotifyKey = node.id + '-5min-' + timeKey;
                if (diffMin === 5 && !_notifiedTasks.has(preNotifyKey)) {
                    _notifiedTasks.add(preNotifyKey);
                    sendWhenNotification(
                        'TaskMind - 開始5分前',
                        `「${node.title}」の開始まであと5分です`,
                        priority
                    );
                    requestAttention(1, priority);
                    console.log('[Notify] 5分前通知送信:', node.title);
                }

                // ② 開始時刻通知（diffMinが0の時に1回）
                const startNotifyKey = node.id + '-0min-' + timeKey;
                if (diffMin === 0 && !_notifiedTasks.has(startNotifyKey)) {
                    _notifiedTasks.add(startNotifyKey);
                    sendWhenNotification(
                        'TaskMind - 開始時刻',
                        `「${node.title}」の開始時刻です`,
                        priority
                    );
                    requestAttention(1, priority);
                    console.log('[Notify] 開始時刻通知送信:', node.title);
                }
            });

            // 古い通知履歴をクリーンアップ（1時間以上前のもの）
            const oneHourAgo = now.getTime() - 3600000;
            for (const key of _notifiedTasks) {
                const keyTime = key.split('-')[1];
                if (keyTime) {
                    const keyDate = new Date(keyTime);
                    if (keyDate.getTime() < oneHourAgo) {
                        _notifiedTasks.delete(key);
                    }
                }
            }
        }

        // 自動再計算: Web Workerでバックグラウンドタイマー（非アクティブタブでも動作）
        // Worker状態監視用デバッグオブジェクト
        window._workerDebug = {
            lastTickTime: null,
            lastRecalcTime: null,
            lastRenderTime: null,
            tickCount: 0,
            recalcCount: 0,
            renderCount: 0,
            getStatus: function() {
                return {
                    lastTick: this.lastTickTime,
                    lastRecalc: this.lastRecalcTime,
                    lastRender: this.lastRenderTime,
                    ticks: this.tickCount,
                    recalcs: this.recalcCount,
                    renders: this.renderCount,
                    workerExists: !!window._timerWorker,
                    now: new Date().toISOString()
                };
            }
        };

        const _workerCode = `
            let intervalId;
            self.onmessage = function(e) {
                try {
                    if (e.data === 'start') {
                        if (intervalId) clearInterval(intervalId);
                        intervalId = setInterval(() => {
                            try {
                                self.postMessage('tick');
                            } catch (err) {
                                self.postMessage('error:' + err.message);
                            }
                        }, 60000);
                        self.postMessage('ack:start');
                    } else if (e.data === 'stop') {
                        if (intervalId) clearInterval(intervalId);
                        intervalId = null;
                        self.postMessage('ack:stop');
                    }
                } catch (err) {
                    self.postMessage('error:' + err.message);
                }
            };
            // Auto-start after 1s if not started
            setTimeout(() => {
                if (!intervalId) {
                    self.postMessage('auto-start');
                }
            }, 1000);
        `;
        const _workerBlob = new Blob([_workerCode], { type: 'application/javascript' });
        const _workerUrl = URL.createObjectURL(_workerBlob);
        window._timerWorker = new Worker(_workerUrl);
        window._timerWorker.onmessage = function(e) {
            if (e.data === 'tick') {
                console.log('[Worker] Tick received at', new Date().toLocaleTimeString());
                if (window._workerDebug) {
                    window._workerDebug.lastTickTime = new Date().toISOString();
                    window._workerDebug.tickCount++;
                }
                recalculateWhenDates();
                checkTaskReminders();
            } else if (e.data === 'ack:start') {
                console.log('[Worker] Ack start received');
            } else if (e.data === 'ack:stop') {
                console.log('[Worker] Ack stop received');
            } else if (e.data === 'auto-start') {
                console.log('[Worker] Auto-start triggered, sending start');
                window._timerWorker.postMessage('start');
            } else if (typeof e.data === 'string' && e.data.startsWith('error:')) {
                console.error('[Worker] Error from worker:', e.data);
            } else {
                console.log('[Worker] Unknown message:', e.data);
            }
        };
        window._timerWorker.onerror = function(err) {
            console.error('[Worker] Error:', err.message, err.filename, err.lineno);
        };
        window._timerWorker.postMessage('start');
        console.log('[Worker] Timer worker started');

        // visibilitychange: タブがアクティブになった時に即座に再計算
        document.addEventListener('visibilitychange', () => {
            const hidden = document.hidden;
            console.log('[Visibility] State changed, hidden=' + hidden);
            if (!hidden) {
                // タブがアクティブになった：即座に再計算
                console.log('[Visibility] Tab became active, recalculating...');
                recalculateWhenDates();
                checkTaskReminders();
                // 強制的に再描画（ブラウザの最適化で遅延されるのを防ぐ）
                renderNodes();
                document.body.offsetHeight; // force reflow
            }
        });

        // 既存のテストタスクを自動削除（過去のテストデータをクリーンアップ）
        const testTaskIndex = state.nodes.findIndex(n => n.title && n.title.includes('[TEST]'));
        if (testTaskIndex !== -1) {
            console.log('[Test] 既存テストタスクを自動削除:', state.nodes[testTaskIndex].title);
            state.nodes.splice(testTaskIndex, 1);
        }

        // AudioContextの自動再生ポリシー対応：ユーザー操作で初期化
        document.addEventListener('click', () => {
            resumeAudioContext();
        }, { once: true });

        // 初期ロード時にも実行
        recalculateWhenDates();

        // 初期化時に通知許可状態をチェック
        console.log('[Notify] Init check. Notification exists:', 'Notification' in window);
        if ('Notification' in window) {
            console.log('[Notify] Init permission:', Notification.permission);
            if (Notification.permission === 'granted') {
                _notificationEnabled = true;
                updateNotifyButton(true);
            } else if (Notification.permission === 'denied') {
                updateNotifyButton(false, true);
            }
        }

        // ==================== Error Log Panel UI ====================
        (function initErrorLogPanel() {
            const btn = document.getElementById('btn-error-log');
            const panel = document.getElementById('error-log-panel');
            const closeBtn = document.getElementById('error-log-close');
            const clearBtn = document.getElementById('error-log-clear');
            const downloadBtn = document.getElementById('error-log-download');
            
            if (!btn || !panel) return;
            
            btn.addEventListener('click', () => {
                panel.classList.toggle('show');
                if (panel.classList.contains('show') && window._taskmindUpdateErrorPanel) {
                    window._taskmindUpdateErrorPanel();
                }
            });
            
            if (closeBtn) {
                closeBtn.addEventListener('click', () => {
                    panel.classList.remove('show');
                });
            }
            
            if (clearBtn) {
                clearBtn.addEventListener('click', () => {
                    if (window._taskmindErrorLog) {
                        window._taskmindErrorLog.length = 0;
                        if (window._taskmindUpdateErrorPanel) window._taskmindUpdateErrorPanel();
                    }
                });
            }
            
            if (downloadBtn) {
                downloadBtn.addEventListener('click', () => {
                    if (!window._taskmindErrorLog || window._taskmindErrorLog.length === 0) {
                        showToast('エラーログはありません');
                        return;
                    }
                    const logText = window._taskmindErrorLog.map(e => {
                        return `[${e.time}] [${e.type}] ${e.message}\n${e.details.stack ? 'Stack:\n' + e.details.stack : ''}\n---`;
                    }).join('\n\n');
                    const blob = new Blob([logText], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'taskmind-error-log_' + new Date().toISOString().slice(0, 10) + '.txt';
                    a.click();
                    URL.revokeObjectURL(url);
                    showToast('エラーログをダウンロードしました');
                });
            }
        })();

        // 初期描画
        renderAll();
    </script>
</body>
</html>
