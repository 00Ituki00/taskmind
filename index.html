            return { checkbox, title, expandBtn, badge, indicators };
        }

        function createNodeHeader(node, tooltipCtrl) {
            const header = createEl('div', { class: 'node-header' });
            buildNodeHeaderContent(node, header, { tooltipCtrl, isChild: false });
            return header;
        }

        function createExpandBtn(node, isChild) {
            const hasChildren = state.nodes.some(n => n.parentId === node.id);
            const tag = isChild ? 'span' : 'button';
            const size = isChild ? '14px' : '12px';
            return createEl(tag, {
                class: isChild ? '' : 'expand-btn',
                text: node.expanded ? '▼' : '▶',
                style: {
                    marginLeft: '4px', fontSize: size, color: '#4a90d9',
                    cursor: 'pointer', width: '14px', textAlign: 'center',
                    flexShrink: 0, visibility: hasChildren ? 'visible' : 'hidden',
                    background: 'none', border: 'none', padding: isChild ? '0' : '0 2px'
                },
                on: {
                    click: (e) => {
                        e.stopPropagation();
                        node.expanded = !node.expanded;
                        renderNodes();
                    }
                }
            });
        }

        function createTypeIcon(node, parentEl) {
            const typeIcons = { task: '✓', condition: '❓', memo: '📝', startend: '▶' };
            return createEl('span', {
                class: 'node-type-icon',
                text: typeIcons[node.type || 'task'] || '✓',
                parent: parentEl
            });
        }

        function createTaskBadge(node, parentEl) {
            const count = node.children ? node.children.length : 0;
            if (count === 0) return null;
            return createEl('span', {
                class: 'task-count',
                text: String(count),
                style: { fontSize: '11px', color: '#999', marginLeft: '4px', flexShrink: 0 },
                parent: parentEl
            });
        }

        function getOrCreateTooltipController() {
            let tooltipEl = document.querySelector('.node-hover-tooltip-global');
            if (!tooltipEl) {
                tooltipEl = createEl('div', {
                    class: 'node-hover-tooltip-global',
                    style: {
                        position: 'fixed', display: 'none', zIndex: 10001, background: 'white',
                        border: '1px solid #ddd', borderRadius: '8px', padding: '12px',
                        boxShadow: '0 4px 16px rgba(0,0,0,0.15)', fontSize: '12px',
                        maxWidth: '280px', pointerEvents: 'none', opacity: 0,
                        transition: 'opacity 0.15s ease', willChange: 'transform,opacity'
                    },
                    parent: document.body
                });
            }
            return _createTooltipController(tooltipEl);
        }

        function createChildrenContainer(node, parentEl, hiddenNodeIds) {
            const tasksEl = createEl('div', {
                class: 'node-tasks' + (!node.expanded ? ' collapsed' : '')
            });
            if (node.expanded) {
                renderChildren(node, tasksEl, 0, hiddenNodeIds);
            }
            parentEl.appendChild(tasksEl);
            return tasksEl;
        }

        function renderChildren(parentNode, containerEl, depth, hiddenNodeIds) {
            const childIds = parentNode.children || [];
            childIds.forEach(childId => {
                const child = state.nodes.find(n => n.id === childId);
                if (!child) return;
                // Skip completed nodes when hideCompleted is enabled
                if (state.hideCompleted && child.completed) return;
                // Skip if this child is currently being dragged (and drag has actually started)
                if (state.dragNode?.id === child.id && state.isDragging) return;
                // Skip if this child is part of multi-drag selection
                if (state.dragSelectedNodes?.some(n => n.id === child.id) && state.isDragging) return;
                // Skip hidden nodes
                if (hiddenNodeIds.has(child.id)) return;

                const isDraggingMulti = state.dragSelectedNodes?.some(n => n.id === child.id) && state.isDragging;

                // 子ノードの色を設定（完了済みはグレー）
                const childNodeColor = child.color || getNodeTypeColor(child.type);
                const childDisplayColor = getNodeDisplayColor(child);
                const childDisplayBg = child.completed ? '#e0e0e0' : lightenColor(childNodeColor, 0.75);

                const childEl = createEl('div', {
                    class: 'node type-' + (child.type || 'task')
                        + (state.selectedNodeIds.includes(child.id) || child.id === state.selectedNodeId ? ' selected' : '')
                        + (state.dropTarget && state.dropTarget.id === child.id ? ' drop-target' : '')
                        + (child.completed ? ' completed' : '')
                        + (state.dragNode?.id === child.id && state.isDragging ? ' dragging' : '')
                        + (isDraggingMulti ? ' dragging' : '')
                        + (getNodeWhenStatus(child) ? ' ' + getNodeWhenStatus(child) : ''),
                    attrs: { 'data-id': child.id, 'data-depth': depth },
                    style: { backgroundColor: childDisplayBg }
                });

                // Priority border styling for child nodes
                applyPriorityBorder(childEl, child, childDisplayColor);
                childEl.style.borderRadius = '12px';

                // Build header content using unified helper
                const childTooltipEl = document.querySelector('.node-hover-tooltip-global');
                const childTooltipCtrl = _createTooltipController(childTooltipEl);
                buildNodeHeaderContent(child, childEl, { checkboxSize: 14, tooltipCtrl: childTooltipCtrl, isChild: true });

                // When progress bar for child nodes
                const childWhenProgress = createWhenProgressBar(child);
                if (childWhenProgress) {
                    childWhenProgress.style.padding = '2px 0 2px 22px';
                    childEl.appendChild(childWhenProgress);
                }

                // Use unified drag-and-drop handlers (same as root nodes)
                attachNodeEvents(childEl, child, { stopPropagation: true, includeDragHandlers: true });

                childEl.addEventListener('dblclick', (e) => {
                    e.stopPropagation();
                    child.expanded = !child.expanded;
                    renderNodes();
                });

                // Child nodes area with recursive rendering (same structure as root nodes)
                const childTasksEl = createEl('div', {
                    class: 'node-tasks' + (!child.expanded ? ' collapsed' : '')
                });

                if (child.expanded) {
                    renderChildren(child, childTasksEl, depth + 1, hiddenNodeIds);
                }

                childEl.appendChild(childTasksEl);

                containerEl.appendChild(childEl);
            });
        }

        function buildNodeClassName(node, hiddenNodeIds) {
            return 'node type-' + (node.type || 'task')
                + (state.selectedNodeIds.includes(node.id) || node.id === state.selectedNodeId ? ' selected' : '')
                + (state.dropTarget && state.dropTarget.id === node.id ? ' drop-target' : '')
                + (state.dragNode?.id === node.id && state.isDragging ? ' dragging' : '')
                + (getNodeWhenStatus(node) ? ' ' + getNodeWhenStatus(node) : '');
        }

        function buildNodeStyle(node, hiddenNodeIds) {
            const style = {};
            if (node.width) style.width = node.width + 'px';
            if (node.height && node.expanded) style.minHeight = node.height + 'px';
            if (hiddenNodeIds.has(node.id)) style.display = 'none';

            // Use absolute position for actively dragged child nodes only
            if (node.parentId !== null && state.dragNode?.id === node.id && state.isDragging) {
                let absX, absY;
                if (node.absX !== undefined && node.absY !== undefined) {
                    absX = node.absX;
                    absY = node.absY;
                } else {
                    const absPos = getNodeAbsolutePosition(node);
                    absX = absPos.x;
                    absY = absPos.y;
                }
                style.left = absX + 'px';
                style.top = absY + 'px';
            } else {
                style.left = node.x + 'px';
                style.top = node.y + 'px';
                const rootDisplayColor = getNodeDisplayColor(node);
                // Root/single nodes: full border with node color, thickness by priority
                const rp = node.priority || 0;
                let borderWidth = '2px';
                if (!node.completed) {
                    if (rp >= 5) borderWidth = '3.5px';
                    else if (rp >= 4) borderWidth = '3px';
                    else if (rp >= 3) borderWidth = '2.5px';
                    else if (rp >= 2) borderWidth = '2px';
                    else if (rp >= 1) borderWidth = '1.5px';
                }
                style.border = `${borderWidth} solid ${rootDisplayColor}`;
            }
            return style;
        }
        function renderNodes() {
            if (!prepareRenderNodes()) return;

            const tooltipCtrl = getOrCreateTooltipController();
            const hiddenNodeIds = state.hiddenNodeIds;

            // Render root nodes
            state.nodes.forEach(node => {
                // Skip child nodes unless they are being actively dragged
                if (node.parentId != null && !(state.dragNode?.id === node.id && state.isDragging)) return;
                // Skip completed nodes when hideCompleted is enabled
                if (state.hideCompleted && node.completed) return;

                // If dragging a child node and drag has actually started, render as simplified element
                if (node.parentId !== null && state.dragNode?.id === node.id && state.isDragging) {
                    createDragPreviewNode(node, nodesEl);
                    return;
                }

                // Standard root node rendering
                const className = buildNodeClassName(node, hiddenNodeIds);
                const style = buildNodeStyle(node, hiddenNodeIds);
                const el = createEl('div', {
                    class: className,
                    attrs: { 'data-id': node.id },
                    style: style
                });

                const header = createNodeHeader(node, tooltipCtrl);

                el.appendChild(header);

                // Completed date display
                if (node.completed && node.completedAt) {
                    const completedDate = new Date(node.completedAt);
                    createEl('div', {
                        text: `完了: ${completedDate.getMonth()+1}/${completedDate.getDate()} ${String(completedDate.getHours()).padStart(2,'0')}:${String(completedDate.getMinutes()).padStart(2,'0')}`,
                        style: { fontSize: '10px', color: '#999', padding: '2px 0 4px 22px', fontStyle: 'italic' },
                        parent: el
                    });
                }

                // When progress bar
                const whenProgress = createWhenProgressBar(node);
                if (whenProgress) el.appendChild(whenProgress);

                // Child nodes area with recursive rendering
                createChildrenContainer(node, el, hiddenNodeIds);

                attachNodeEvents(el, node, { includeDragHandlers: true });

                nodesEl.appendChild(el);

                createResizeHandles(node, el, nodesEl);
            });

            // Update all resize handle positions after DOM rendering is fully complete
            // Use double requestAnimationFrame to ensure layout is calculated
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    updateAllHandlePositions();
                });
            });
        }

        // Update all resize handle positions based on actual DOM state
        function updateAllHandlePositions() {
            state.nodes.forEach(node => {
                let nx, ny;
                if (node.parentId !== null) {
                    // Child node: calculate absolute position
                    const parent = state.nodes.find(n => n.id === node.parentId);
                    if (parent) {
                        const absPos = getNodeAbsolutePosition(node);
                        nx = absPos.x;
                        ny = absPos.y;
                    } else {
                        nx = node.x;
                        ny = node.y;
                    }
                } else {
                    nx = node.x;
                    ny = node.y;
                }
                const domEl = document.querySelector(`.node[data-id="${node.id}"]`);
                if (!domEl) return;

                const nw = node.width || 200;
                const actualH = node.height || 50;

                document.querySelectorAll(`.resize-handle[data-node-id="${node.id}"]`).forEach(handle => {
                    const pos = handle.dataset.pos;
                    let hx, hy;
                    if (pos === 'nw') { hx = nx - 5; hy = ny - 5; }
                    else if (pos === 'ne') { hx = nx + nw - 5; hy = ny - 5; }
                    else if (pos === 'sw') { hx = nx - 5; hy = ny + actualH - 5; }
                    else if (pos === 'se') { hx = nx + nw - 5; hy = ny + actualH - 5; }
                    handle.style.left = hx + 'px';
                    handle.style.top = hy + 'px';
                });
            });
        }

        function getContrastColor(hexColor) {
            const hex = hexColor.replace('#', '');
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);
            const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            return luminance > 0.5 ? '#333333' : '#ffffff';
        }

        function lightenColor(hexColor, factor) {
            const hex = hexColor.replace('#', '');
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);
            const lr = Math.round(r + (255 - r) * factor);
            const lg = Math.round(g + (255 - g) * factor);
            const lb = Math.round(b + (255 - b) * factor);
            return '#' + [lr, lg, lb].map(v => Math.min(255, v).toString(16).padStart(2, '0')).join('');
        }

        function getNodeTypeColor(type) {
            const colors = {
                schedule: '#4a90d9',
                task: '#50c878',
                daily: '#f5a623',
                monthly: '#e74c3c',
                condition: '#f5a623',
                memo: '#f0e040',
                startend: '#4a90d9'
            };
            return colors[type] || colors.task;
        }

        // Get the effective color for a node, considering completion state
        // Completed nodes are shown in gray
        function getNodeDisplayColor(node) {
            if (node.completed) {
                return '#9e9e9e';
            }
            return node.color || getNodeTypeColor(node.type);
        }

        // Fast path: update dragged node positions directly without full re-render
        let _dragRafId = null;
        let _lastDragMoveTime = 0;
        let _lastDropCheckTime = 0;
        const DRAG_THROTTLE_MS = 16; // 60fps
        
        function updateDragVisuals() {
            // Update dragged node
            if (state.dragNode) {
                const el = document.querySelector(`.node[data-id="${state.dragNode.id}"]`);
                if (el) {
                    const x = state.dragNode.parentId !== null ? (state.dragNode.absX || state.dragNode.x) : state.dragNode.x;
                    const y = state.dragNode.parentId !== null ? (state.dragNode.absY || state.dragNode.y) : state.dragNode.y;
                    el.style.left = x + 'px';
                    el.style.top = y + 'px';
                }
            }
            // Update multi-selected root nodes
            if (state.selectedNodeIds.length > 1) {
                state.selectedNodeIds.forEach(id => {
                    if (id === state.dragNode?.id) return;
                    const n = state.nodes.find(node => node.id === id);
                    if (n && n.parentId === null) {
                        const el = document.querySelector(`.node[data-id="${n.id}"]`);
                        if (el) {
                            el.style.left = n.x + 'px';
                            el.style.top = n.y + 'px';
                        }
                    }
                });
            }
            // Update collapsed connection destination nodes
            if (state.dragNode) {
                const movedNodes = new Set();
                const updateCascade = (fromId) => {
                    state.connections.forEach(conn => {
                        if (conn.from === fromId && conn.collapsed) {
                            const toNode = state.nodes.find(n => n.id === conn.to);
                            if (toNode && !movedNodes.has(toNode.id)) {
                                movedNodes.add(toNode.id);
                                const el = document.querySelector(`.node[data-id="${toNode.id}"]`);
                                if (el) {
                                    el.style.left = toNode.x + 'px';
                                    el.style.top = toNode.y + 'px';
                                }
                                updateCascade(toNode.id);
                            }
                        }
                    });
                };
                updateCascade(state.dragNode.id);
            }
            // Update child nodes when dragging a parent (recursive)
            if (state.dragNode) {
                const updateChildren = (parentId) => {
                    state.nodes.forEach(child => {
                        if (child.parentId === parentId) {
                            const absPos = getNodeAbsolutePosition(child);
                            const el = document.querySelector(`.node[data-id="${child.id}"]`);
                            if (el) {
                                el.style.left = absPos.x + 'px';
                                el.style.top = absPos.y + 'px';
                            }
                            updateChildren(child.id);
                        }
                    });
                };
                updateChildren(state.dragNode.id);
            }
        }

        // Throttled drag update: only process every 16ms (60fps)
        function throttledDragUpdate() {
            const now = performance.now();
            if (now - _lastDragMoveTime < DRAG_THROTTLE_MS) return;
            _lastDragMoveTime = now;
            updateDragVisuals();
        }

        // Track connection IDs related to the currently dragged node for incremental updates
        let _draggedConnIds = null;
        
        function buildDraggedConnIds() {
            if (!state.dragNode) return null;
            const dragId = state.dragNode.id;
            const ids = new Set();
            // Direct connections to/from dragged node
            state.connections.forEach(conn => {
                if (conn.from === dragId || conn.to === dragId) {
                    ids.add(`${conn.from}-${conn.to}`);
                }
            });
            // Cascaded connections from collapsed descendants
            const addCascade = (nodeId) => {
                state.connections.forEach(conn => {
                    if (conn.from === nodeId && conn.collapsed) {
                        ids.add(`${conn.from}-${conn.to}`);
                        addCascade(conn.to);
                    }
                });
            };
            addCascade(dragId);
            return [...ids];
        }

        // Schedule full render on next animation frame (throttled to 60fps max)
        // During drag: only update connections related to the dragged node
        // Full render happens once on drag end
        function scheduleDragRender() {
            if (_dragRafId) return;
            _dragRafId = requestAnimationFrame(() => {
                _dragRafId = null;
                if (state.isDragging && _draggedConnIds) {
                    // Only re-render connections related to dragged node
                    renderConnections(_draggedConnIds);
                } else if (!state.isDragging) {
                    renderAll();
                }
            });
        }

        function createTimelineHeader(viewStart, days, dayWidth, totalWidth) {
            const header = createEl('div', {
                class: 'timeline-header',
                style: { width: Math.max(totalWidth, window.innerWidth) + 'px' }
            });
            const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
            for (let i = 0; i < days; i++) {
                const d = new Date(viewStart);
                d.setDate(d.getDate() + i);
                const isWeekend = d.getDay() === 0 || d.getDay() === 6;
                createEl('div', {
                    class: 'timeline-day-header',
                    style: {
                        width: dayWidth + 'px',
                        background: isWeekend ? 'rgba(231,76,60,0.05)' : undefined
                    },
                    html: `<div>${d.getMonth() + 1}/${d.getDate()}<br><small style="color:${isWeekend ? '#e74c3c' : '#666'}">${dayNames[d.getDay()]}</small></div>`,
                    parent: header
                });
            }
            return header;
        }

        function setupTimelinePan(container) {
            // Timeline pan drag - only setup window listeners once
            if (!state._timelineWindowListenersSetup) {
                state._timelineWindowListenersSetup = true;

                window.addEventListener('mousemove', (e) => {
                    if (!state.timelinePanState || !state.timelinePanState.isPanning) return;
                    const ps = state.timelinePanState;
                    const dx = ps.startX - e.clientX;
                    const dy = ps.startY - e.clientY;
                    ps.container.scrollLeft = ps.scrollStartX + dx;
                    ps.container.scrollTop = ps.scrollStartY + dy;
                });

                window.addEventListener('mouseup', (e) => {
                    if (state.timelinePanState) {
                        state.timelinePanState.isPanning = false;
                        state.timelinePanState.container.classList.remove('panning');
                        state.timelinePanState = null;
                    }
                });
            }

            // Prevent contextmenu in timeline container (right-click is used for panning)
            window.addEventListener('contextmenu', (e) => {
                if (state.layoutMode === 'timeline' && e.target.closest('.timeline-container') && !e.target.closest('.timeline-node')) {
                    e.preventDefault();
                }
            });

            container.addEventListener('contextmenu', (e) => {
                if (e.target.closest('.timeline-node')) return;
                e.preventDefault();
            });

            container.addEventListener('mousedown', (e) => {
                if (e.button !== 2) return; // right-click only
                if (e.target.closest('.timeline-node')) return;

                state.timelineRightClickStart = { x: e.clientX, y: e.clientY, moved: false };

                state.timelinePanState = {
                    isPanning: true,
                    startX: e.clientX,
                    startY: e.clientY,
                    scrollStartX: container.scrollLeft,
                    scrollStartY: container.scrollTop,
                    container: container
                };
                container.classList.add('panning');
                e.preventDefault();
            });

            // Track movement to detect actual pan vs simple right-click
            const trackPanMovement = (e) => {
                if (!state.timelineRightClickStart || state.timelineRightClickStart.moved) return;
                const dx = Math.abs(e.clientX - state.timelineRightClickStart.x);
                const dy = Math.abs(e.clientY - state.timelineRightClickStart.y);
                if (dx > 5 || dy > 5) {
                    state.timelineRightClickStart.moved = true;
                }
            };

            container.addEventListener('mousemove', trackPanMovement);
        }

        function getTimelineNodeStyles(node) {
            const displayColor = getNodeDisplayColor(node);
            const bgColor = node.color || getNodeTypeColor(node.type);
            const lightBg = node.completed ? '#e0e0e0' : lightenColor(bgColor, 0.85);
            const borderRgba = `rgba(${parseInt(displayColor.substr(1,2),16)},${parseInt(displayColor.substr(3,2),16)},${parseInt(displayColor.substr(5,2),16)},0.7)`;
            return { displayColor, bgColor, lightBg, borderRgba };
        }

        function calculateTimelineNodeLayout(nodes, viewStart, dayWidth) {
            const rowHeight = 28;
            const rows = [];
            
            // Sort by start date
            const sorted = [...nodes].sort((a, b) => {
                const da = getNodeTimelineStartDate(a);
                const db = getNodeTimelineStartDate(b);
                return new Date(da) - new Date(db);
            });
            
            return sorted.map(node => {
                const startDate = getNodeTimelineStartDate(node);
                const endDate = getNodeTimelineEndDate(node, startDate);

                const startX = ((new Date(startDate) - viewStart) / (1000 * 60 * 60 * 24)) * dayWidth;
                const duration = endDate ? Math.max(0.5, (new Date(endDate) - new Date(startDate)) / (1000 * 60 * 60 * 24)) : 1;
                const nodeWidth = Math.max(60, duration * dayWidth - 4);
                const nodeEndX = startX + nodeWidth + 4;

                let rowIndex = 0;
                for (; rowIndex < rows.length; rowIndex++) {
                    if (rows[rowIndex] <= startX + 2) {
                        break;
                    }
                }

                if (rowIndex >= rows.length) {
                    rows.push(nodeEndX);
                } else {
                    rows[rowIndex] = nodeEndX;
                }

                return { node, startX, rowIndex, nodeWidth };
            });
        }

        function renderTimeline() {
            const timeline = state.timeline;
            const dayWidth = timeline.dayWidth;

            // Save current free layout pan position before switching
            if (!state._freePanSaved) {
                state._freePanX = state.panX;
                state._freePanY = state.panY;
                state._freeScale = state.scale;
                state._freePanSaved = true;
            }

            // Reset canvas transform for timeline view
            state.panX = 0;
            state.panY = 0;
            state.scale = 1;
            updateTransform();

            // Update zoom level display for timeline
            zoomLevelEl.textContent = Math.round(dayWidth) + 'px/d';

            // Calculate date range based on viewport width and dayWidth
            const viewStart = new Date(timeline.viewStart);
            const visibleDays = Math.max(7, Math.ceil(window.innerWidth / dayWidth) + 3); // +3 for padding
            const viewEnd = new Date(viewStart);
            viewEnd.setDate(viewEnd.getDate() + visibleDays);

            const days = Math.ceil((viewEnd - viewStart) / (1000 * 60 * 60 * 24));
            const totalWidth = days * dayWidth;

            // Container
            const container = createEl('div', {
                class: 'timeline-container',
                style: { width: Math.max(totalWidth, window.innerWidth) + 'px' }
            });

            // Date header
            const header = createTimelineHeader(viewStart, days, dayWidth, totalWidth);
            container.appendChild(header);

            // Collect all nodes with timeline dates (including children as independent nodes)
            let allTimelineNodes = [];
            const childNodeIds = new Set(); // Track child node IDs
            const taskParentNodes = []; // Track task-type parent nodes for undated panel
            
            state.nodes.forEach(node => {
                // Track children IDs
                if (node.children && node.children.length > 0) {
                    node.children.forEach(childId => {
                        if (typeof childId === 'object' && childId.id) {
                            childNodeIds.add(childId.id);
                        } else {
                            childNodeIds.add(childId);
                        }
                    });
                }
            });
            
            state.nodes.forEach(node => {
                const isChild = childNodeIds.has(node.id);
                
                // Add parent node to timeline if it has a date (exclude children to avoid duplication)
                const startDate = getNodeTimelineStartDate(node);
                if (startDate && !isChild) {
                    allTimelineNodes.push(node);
                }
                
                // Track task-type PARENT nodes for undated panel (must have children)
                const isParent = node.children && node.children.length > 0;
                if ((node.type === 'task' || !node.type) && isParent && !isChild) {
                    taskParentNodes.push(node);
                }
                
                // Add children as independent nodes for timeline (only if they have dates)
                if (node.children && node.children.length > 0) {
                    node.children.forEach(child => {
                        const childId = typeof child === 'object' && child.id ? child.id : child;
                        const childNode = state.nodes.find(n => n.id === childId);
                        if (childNode) {
                            const childStart = getNodeTimelineStartDate(childNode);
                            if (childStart) {
                                allTimelineNodes.push(childNode);
                            }
                        }
                    });
                }
            });

            if (state.hideCompleted) {
                allTimelineNodes = allTimelineNodes.filter(n => !n.completed);
            }

            // Separate nodes with and without dates
            const datedNodes = [];
            const undatedNodes = [];
            
            allTimelineNodes.forEach(node => {
                const when = node.details?.when;
                // Has explicit date: baseDateTime or deadlineDate
                const hasExplicitDate = when && (when.baseDateTime || when.deadlineDate);
                if (hasExplicitDate) {
                    datedNodes.push(node);
                } else {
                    // Only include task-type nodes in undated panel
                    const isTaskType = node.type === 'task' || !node.type;
                    if (isTaskType) {
                        undatedNodes.push(node);
                    }
                }
            });
            
            // Filter undated nodes: only top-level nodes (no parent)
            // Use existing childNodeIds from earlier in the function
            
            // Keep only undated nodes that are NOT children (top-level only)
            const topLevelUndatedNodes = undatedNodes.filter(node => !childNodeIds.has(node.id));
            
            // Add task-type parent nodes without explicit dates to undated panel
            taskParentNodes.forEach(node => {
                const when = node.details?.when;
                const hasExplicitDate = when && (when.baseDateTime || when.deadlineDate);
                if (!hasExplicitDate && !topLevelUndatedNodes.find(n => n.id === node.id)) {
                    if (!state.hideCompleted || !node.completed) {
                        topLevelUndatedNodes.push(node);
                    }
                }
            });

            // Unified lane for dated nodes
            const lanesEl = createEl('div', { class: 'timeline-lanes' });

            const laneEl = createEl('div', { class: 'timeline-unified-lane' });

            // Grid lines
            const grid = createEl('div', { class: 'timeline-grid' });
            for (let i = 0; i < days; i++) {
                const d = new Date(viewStart);
                d.setDate(d.getDate() + i);
                createEl('div', {
                    class: 'timeline-grid-line' + ((d.getDay() === 0 || d.getDay() === 6) ? ' weekend' : ''),
                    style: { width: dayWidth + 'px' },
                    parent: grid
                });
            }
            laneEl.appendChild(grid);

            // Place dated nodes
            if (datedNodes.length === 0) {
                createEl('div', { class: 'timeline-empty-lane', text: 'ノードがありません', parent: laneEl });
            } else {
                const rowHeight = 28;
                const layout = calculateTimelineNodeLayout(datedNodes, viewStart, dayWidth);
                
                layout.forEach(({ node, startX, rowIndex, nodeWidth }) => {
                    const styles = getTimelineNodeStyles(node);

                    const nodeEl = createEl('div', {
                        class: 'timeline-node type-' + (node.type || 'task') + ' priority-' + (node.priority || 0),
                        text: node.title,
                        attrs: { 'data-id': node.id },
                        style: {
                            backgroundColor: styles.lightBg + ' !important',
                            borderLeft: '4px solid ' + styles.borderRgba,
                            color: getContrastColor(styles.displayColor),
                            borderTop: '1px solid ' + styles.borderRgba,
                            borderRight: '1px solid ' + styles.borderRgba,
                            borderBottom: '1px solid ' + styles.borderRgba,
                            textShadow: 'none',
                            fontWeight: '600',
                            left: (startX + 2) + 'px',
                            top: (rowIndex * rowHeight + 8) + 'px',
                            width: nodeWidth + 'px'
                        },
                        on: {
                            mouseenter: (e) => showTimelineTooltip(e, node),
                            mouseleave: hideTimelineTooltip,
                            click: (e) => {
                                e.stopPropagation();
                                selectNode(node.id);
                            },
                            contextmenu: (e) => {
                                e.preventDefault();
                                e.stopPropagation();
                                selectNode(node.id);
                                showCanvasContextMenu(e.clientX, e.clientY, e);
                            }
                        }
                    });

                    laneEl.appendChild(nodeEl);
                });

                // Set lane height based on number of rows
                const maxRowIndex = Math.max(...layout.map(l => l.rowIndex), -1);
                const rowCount = maxRowIndex + 1;
                const laneHeight = Math.max(60, rowCount * rowHeight + 16);
                laneEl.style.minHeight = laneHeight + 'px';
            }

            lanesEl.appendChild(laneEl);
            container.appendChild(lanesEl);

            // Undated nodes panel (bottom pane) - only top-level nodes
            if (topLevelUndatedNodes.length > 0) {
                const undatedPanel = createEl('div', { class: 'timeline-undated-panel' });
                createEl('div', {
                    class: 'timeline-undated-header',
                    text: `期限なし (${topLevelUndatedNodes.length})`,
                    parent: undatedPanel
                });

                const undatedList = createEl('div', { class: 'timeline-undated-list', parent: undatedPanel });

                topLevelUndatedNodes.forEach(node => {
                    const styles = getTimelineNodeStyles(node);

                    const nodeEl = createEl('div', {
                        class: 'timeline-undated-node type-' + (node.type || 'task') + ' priority-' + (node.priority || 0),
                        text: node.title,
                        style: {
                            backgroundColor: styles.lightBg + ' !important',
                            borderLeft: '4px solid ' + styles.borderRgba,
                            color: getContrastColor(styles.displayColor),
                            borderTop: '1px solid ' + styles.borderRgba,
                            borderRight: '1px solid ' + styles.borderRgba,
                            borderBottom: '1px solid ' + styles.borderRgba,
                            textShadow: 'none',
                            fontWeight: '600'
                        },
                        on: {
                            mouseenter: (e) => showTimelineTooltip(e, node),
                            mouseleave: hideTimelineTooltip,
                            click: (e) => {
                                e.stopPropagation();
                                selectNode(node.id);
                            },
                            contextmenu: (e) => {
                                e.preventDefault();
                                e.stopPropagation();
                                selectNode(node.id);
                                showCanvasContextMenu(e.clientX, e.clientY, e);
                            }
                        },
                        parent: undatedList
                    });
                });

                container.appendChild(undatedPanel);
            }

            nodesEl.appendChild(container);

            // Tooltip element
            if (!document.getElementById('timeline-tooltip')) {
                createEl('div', {
                    id: 'timeline-tooltip',
                    class: 'timeline-node-tooltip',
                    parent: document.body
                });
            }

            // Restore previous scroll position if any
            if (state._timelineScroll) {
                container.scrollLeft = state._timelineScroll.left;
                container.scrollTop = state._timelineScroll.top;
                state._timelineScroll = null;
            }

            setupTimelinePan(container);

            // Update canvas size
            canvas.style.width = Math.max(totalWidth, window.innerWidth) + 'px';
            canvas.style.height = Math.max(lanesEl.offsetHeight + 100, window.innerHeight) + 'px';
        }

        // Show timeline node tooltip
        function showTimelineTooltip(e, node) {
            const tooltip = document.getElementById('timeline-tooltip');
            if (!tooltip) return;

            const startDate = getNodeTimelineStartDate(node);
            const endDate = getNodeTimelineEndDate(node, startDate);
            const when = node.details?.when;

            let datesText = '';
            if (startDate && endDate) {
                const start = new Date(startDate);
                const end = new Date(endDate);
                datesText = `${start.getMonth()+1}/${start.getDate()} 〜 ${end.getMonth()+1}/${end.getDate()}`;
            } else if (startDate) {
                const start = new Date(startDate);
                datesText = `${start.getMonth()+1}/${start.getDate()}`;
            }

            let priorityText = '';
            if (node.priority) {
                priorityText = '優先度: ' + '★'.repeat(node.priority) + '☆'.repeat(5 - node.priority);
            }

            let descText = node.details?.description || '';
            if (when?.repeatType && when?.repeatType !== 'none') {
                descText = `[${getRepeatTypeLabel(when.repeatType)}] ` + descText;
            }

            tooltip.innerHTML = `
                <div class="tooltip-title">${node.title}</div>
                <div class="tooltip-dates">${datesText}</div>
                ${priorityText ? `<div class="tooltip-priority">${priorityText}</div>` : ''}
                ${descText ? `<div class="tooltip-desc">${descText}</div>` : ''}
            `;

            tooltip.classList.add('visible');
            positionTooltip(e, tooltip);
        }

        // Position tooltip near mouse
        function positionTooltip(e, tooltip) {
            const rect = tooltip.getBoundingClientRect();
            let x = e.clientX + 16;
            let y = e.clientY + 16;

            // Keep within viewport
            if (x + rect.width > window.innerWidth) {
                x = e.clientX - rect.width - 8;
            }
            if (y + rect.height > window.innerHeight) {
                y = e.clientY - rect.height - 8;
            }

            tooltip.style.left = x + 'px';
            tooltip.style.top = y + 'px';
        }

        // Hide timeline tooltip
        function hideTimelineTooltip() {
            const tooltip = document.getElementById('timeline-tooltip');
            if (tooltip) {
                tooltip.classList.remove('visible');
            }
        }

        // Get repeat type label
        function getRepeatTypeLabel(repeatType) {
            const labels = {
                'daily': '毎日',
                'weekly': '毎週',
                'monthly': '毎月',
                'monthly-day': '毎月（日付）',
                'monthly-week': '毎月（週）',
                'yearly': '毎年',
                'yearly-date': '毎年（日付）',
                'yearly-week': '毎年（週）',
                'none': '単発'
            };
            return labels[repeatType] || repeatType;
        }

        // Helper: Get the start date for timeline placement
        function getNodeTimelineStartDate(node) {
            const when = node.details?.when;
            if (!when) return null;
            // Priority: baseDateTime > nextDate > createdAt
            if (when.baseDateTime) return when.baseDateTime;
            if (when.nextDate) return when.nextDate;
            return node.createdAt;
        }

        // Helper: Get the end date (deadline) for timeline placement
        function getNodeTimelineEndDate(node, startDate) {
            const when = node.details?.when;
            if (!when) return null;
            // Priority: deadlineDate > baseDateTime + deadlineDays
            if (when.deadlineDate) return when.deadlineDate;
            if (startDate && when.deadlineDays !== undefined && when.deadlineDays !== null) {
                const end = new Date(startDate);
                end.setDate(end.getDate() + when.deadlineDays);
                return end.toISOString();
            }
            // Default: 1 day duration
            if (startDate) {
                const end = new Date(startDate);
                end.setDate(end.getDate() + 1);
                return end.toISOString();
            }
            return null;
        }

        // Helper: Fit text to container width by scaling font size
        function fitTextToWidth(textElement, containerWidth, maxFontSize, minFontSize) {
            const text = textElement.textContent;
            if (!text || !containerWidth) return;

            const canvas = createEl('canvas');
            const ctx = canvas.getContext('2d');
            let low = minFontSize;
            let high = maxFontSize;
            let bestSize = minFontSize;

            while (low <= high) {
                const mid = Math.floor((low + high) / 2);
                ctx.font = `${mid}px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif`;
                const metrics = ctx.measureText(text);
                if (metrics.width <= containerWidth - 28) {
                    bestSize = mid;
                    low = mid + 1;
                } else {
                    high = mid - 1;
                }
            }

            textElement.style.fontSize = bestSize + 'px';
            textElement.style.whiteSpace = 'nowrap';
            textElement.style.overflow = 'hidden';
            textElement.style.textOverflow = 'ellipsis';
        }

        // Helper: Get the date to use for timeline placement (legacy: uses deadline/nextDate)
        function getNodeTimelineDate(node) {
            const when = node.details?.when;
            if (!when) return null;
            // Priority: deadlineDate > nextDate > baseDateTime > createdAt
            if (when.deadlineDate) return when.deadlineDate;
            if (when.nextDate) return when.nextDate;
            if (when.baseDateTime) return when.baseDateTime;
            return node.createdAt;
        }

        // Helper: Create a node element for timeline (reuses existing node styling)
        function createTimelineNodeElement(node, isChild = false) {
            const el = createEl('div', {
                class: 'node timeline-node-inner' + (node.completed ? ' completed' : '') + (isChild ? ' child-node' : ''),
