            });

            // Header
            const header = createEl('div', { class: 'node-header', parent: el });

            const timelineDisplayColor = getNodeDisplayColor(node);
            const color = createCompletionCheckbox(node, 14);
            color.style.flexShrink = '0';
            header.appendChild(color);

            const title = createEl('span', {
                class: 'node-title' + (node.completed ? ' completed' : ''),
                text: node.title,
                attrs: { 'data-node-title': node.title },
                parent: header
            });

            // Store reference for timeline font-size adjustment
            el.dataset.timelineTitleRef = '';
            Object.defineProperty(el, 'timelineTitleElement', { value: title, writable: false });

            // Link icon
            createLinkIcon(node, header);

            // Indicators
            const indicatorsEl = createIndicatorMenu(node);
            header.appendChild(indicatorsEl);

            // Timeline node hover tooltip (same global tooltip element as free layout)
            let timelineTooltipEl = document.querySelector('.node-hover-tooltip-global');
            if (!timelineTooltipEl) {
                timelineTooltipEl = createEl('div', {
                    class: 'node-hover-tooltip-global',
                    style: { position: 'fixed', display: 'none', zIndex: 10001, background: 'white', border: '1px solid #ddd', borderRadius: '8px', padding: '12px', boxShadow: '0 4px 16px rgba(0,0,0,0.15)', fontSize: '12px', maxWidth: '280px', pointerEvents: 'none', opacity: 0, transition: 'opacity 0.15s ease', willChange: 'transform,opacity' }
                });
                document.body.appendChild(timelineTooltipEl);
            }

            let timelineTooltipTimer = null;
            let timelineTooltipVisible = false;

            const timelineTooltipCtrl = _createTooltipController(timelineTooltipEl);


            header.addEventListener('mouseenter', () => {
                if (state.dragNode) return;
                timelineTooltipCtrl.cancelTimer();
                timelineTooltipCtrl.scheduleShow(buildNodeTooltipHtml(node), el);
            });

            header.addEventListener('mouseleave', () => {
                timelineTooltipCtrl.cancelTimer();
                if (timelineTooltipCtrl.isVisible) timelineTooltipCtrl.hide();
            });

            header.addEventListener('mousedown', () => {
                timelineTooltipCtrl.cancelTimer();
                if (timelineTooltipCtrl.isVisible) timelineTooltipCtrl.hide();
            });

            // When preview for timeline
            if (!isChild && node.details?.when?.repeatType && node.details.when.repeatType !== 'none') {
                const whenText = buildWhenText(node.details.when);
                if (whenText) {
                    const preview = createEl('div', {
                        class: 'when-preview',
                        text: whenText,
                        style: { fontSize: '11px', color: '#666', padding: '2px 8px', borderTop: '1px solid #eee' },
                        parent: el
                    });
                }
            }

            // Selection and click
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                if (e.target.closest('.node-color')) return;
                selectNode(node, e.shiftKey);
            });

            return el;
        }

        // Helper: Build when text for display
        function buildWhenText(when) {
            if (!when || !when.repeatType || when.repeatType === 'none') return null;
            const repeatLabels = {
                'daily': '毎日',
                'weekly': '毎週',
                'monthly-day': '毎月(日付)',
                'monthly-week': '毎月(曜日)',
                'yearly-date': '毎年(日付)',
                'yearly-week': '毎年(週)'
            };
            let text = repeatLabels[when.repeatType] || when.repeatType;
            if (when.nextDate) {
                const d = new Date(when.nextDate);
                text += ' 次回:' + (d.getMonth() + 1) + '/' + d.getDate();
            }
            return text;
        }

        // Helper: if node is hidden inside a collapsed parent (at any depth), return the nearest visible ancestor node
        // This ensures connection lines point to the visible parent node when children are hidden
        function getVisibleEndpoint(node) {
            if (!node || node.parentId === null) return node;
            const parent = state.nodes.find(n => n.id === node.parentId);
            if (!parent) return node;
            if (!parent.expanded) {
                // Parent is collapsed; redirect to parent's visible ancestor
                return getVisibleEndpoint(parent);
            }
            // Parent is expanded but may itself be hidden by an ancestor collapse
            const visibleParent = getVisibleEndpoint(parent);
            if (visibleParent && visibleParent.id !== parent.id) {
                return visibleParent;
            }
            return node;
        }

        function getConnectionEdgePoints(fromNode, toNode) {
            if (!fromNode || !toNode) return null;
            let fromEdge, toEdge;
            if (fromNode.parentId === null) {
                fromEdge = getNodeEdgePoint(fromNode, toNode);
            } else {
                fromEdge = getNodeConnectionSidePoint(fromNode, toNode, true);
            }
            if (toNode.parentId === null) {
                toEdge = getNodeEdgePoint(toNode, fromNode);
            } else {
                toEdge = getNodeConnectionSidePoint(toNode, fromNode, false);
            }
            return { fromEdge, toEdge };
        }

        // Node dimension helper with defaults
        function getNodeDimensions(node) {
            return {
                width: node.width || 200,
                height: node.height || 50,
                halfWidth: (node.width || 200) / 2,
                halfHeight: (node.height || 50) / 2
            };
        }

        function calculateBezierConnection(fromNode, toNode, fromEdge, toEdge) {
            const x1 = fromEdge.x, y1 = fromEdge.y;
            const x2 = toEdge.x, y2 = toEdge.y;

            let fromAbsX = fromNode.x, fromAbsY = fromNode.y;
            let toAbsX = toNode.x, toAbsY = toNode.y;
            if (fromNode.parentId !== null) {
                const abs = getNodeAbsolutePosition(fromNode);
                fromAbsX = abs.x; fromAbsY = abs.y;
            }
            if (toNode.parentId !== null) {
                const abs = getNodeAbsolutePosition(toNode);
                toAbsX = abs.x; toAbsY = abs.y;
            }

            const fromD = getNodeDimensions(fromNode);
            const toD = getNodeDimensions(toNode);

            const fromCx = fromAbsX + fromD.halfWidth;
            const fromCy = fromAbsY + fromD.halfHeight;
            const toCx = toAbsX + toD.halfWidth;
            const toCy = toAbsY + toD.halfHeight;

            const dx = toCx - fromCx;
            const dy = toCy - fromCy;
            const len = Math.sqrt(dx * dx + dy * dy);

            const edgeDx1 = x1 - fromCx;
            const edgeDy1 = y1 - fromCy;
            const edgeLen1 = Math.sqrt(edgeDx1 * edgeDx1 + edgeDy1 * edgeDy1) || 1;
            const edgeDx2 = x2 - toCx;
            const edgeDy2 = y2 - toCy;
            const edgeLen2 = Math.sqrt(edgeDx2 * edgeDx2 + edgeDy2 * edgeDy2) || 1;

            const edgeDx = x2 - x1;
            const edgeDy = y2 - y1;
            const edgeLen = Math.sqrt(edgeDx * edgeDx + edgeDy * edgeDy) || 1;

            const controlDist = Math.max(edgeLen * 0.4, 50);

            const cx1 = x1 + (edgeDx1 / edgeLen1) * controlDist;
            const cy1 = y1 + (edgeDy1 / edgeLen1) * controlDist;
            const cx2 = x2 + (edgeDx2 / edgeLen2) * controlDist;
            const cy2 = y2 + (edgeDy2 / edgeLen2) * controlDist;

            return { x1, y1, x2, y2, cx1, cy1, cx2, cy2, len, edgeLen };
        }

        function getVisibleConnection(conn, hiddenNodeIds) {
            if (hiddenNodeIds.has(conn.from)) return null;

            const rawFromNode = state.nodes.find(n => n.id === conn.from);
            const rawToNode = state.nodes.find(n => n.id === conn.to);
            if (!rawFromNode || !rawToNode) return null;

            const fromNode = getVisibleEndpoint(rawFromNode);
            const toNode = getVisibleEndpoint(rawToNode);

            if (fromNode.id === toNode.id) return null;
            if (state.hideCompleted && (fromNode.completed || toNode.completed)) return null;
            if (rawToNode.parentId === rawFromNode.id || rawFromNode.parentId === rawToNode.id) return null;

            return { conn, rawFromNode, rawToNode, fromNode, toNode };
        }

        function createCollapsedIndicator(group, indX, indY, toColor) {
            const indicator = createSvgEl('circle', {
                cx: indX, cy: indY, r: '12',
                fill: '#fff', stroke: toColor, 'stroke-width': '2',
                class: 'collapse-indicator',
                style: { cursor: 'pointer', pointerEvents: 'all' }
            }, group);

            const plus = createSvgEl('text', {
                x: indX, y: indY + 4,
                'text-anchor': 'middle', 'font-size': '14',
                fill: toColor, class: 'collapse-plus',
                style: { pointerEvents: 'all', cursor: 'pointer' }
            }, group);
            plus.textContent = '+';

            return { indicator, plus };
        }

        function createConnectionDragPoints(group, conn, x1, y1, x2, y2, fromColor, toColor, collapsed) {
            const fromPoint = createSvgEl('circle', {
                class: 'conn-point', cx: x1, cy: y1, r: '6',
                style: { fill: fromColor },
                'pointer-events': 'none'
            });

            const fromHitArea = createSvgEl('circle', {
                cx: x1, cy: y1, r: '24',
                fill: 'rgba(0,0,0,0.01)',
                style: { cursor: 'pointer', pointerEvents: 'all' }
            });
            fromHitArea.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                e.preventDefault();
                state.draggingConn = conn;
                state.draggingConn.isSource = true;
                fromPoint.classList.add('dragging');
            });
            group.appendChild(fromHitArea);
            group.appendChild(fromPoint);

            if (!collapsed) {
                const toPoint = createSvgEl('circle', {
                    class: 'conn-point', cx: x2, cy: y2, r: '6',
                    style: { fill: toColor },
                    'pointer-events': 'none'
                });

                const toHitArea = createSvgEl('circle', {
                    cx: x2, cy: y2, r: '24',
                    fill: 'rgba(0,0,0,0.01)',
                    style: { cursor: 'pointer', pointerEvents: 'all' }
                });
                toHitArea.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    state.draggingConn = conn;
                    state.draggingConn.isSource = false;
                    toPoint.classList.add('dragging');
                });
                group.appendChild(toHitArea);
                group.appendChild(toPoint);
            }
        }

        function createConnectionLabel(group, conn, x1, y1, cx1, cy1, cx2, cy2, x2, y2) {
            if (!conn.label && !conn.type && !conn.customType) return;
            const labelText = conn.customType || conn.label || '';
            if (!labelText) return;

            let labelColor = '#555';
            let icon = '';
            if (conn.customType) {
                const customType = state.customConnectionTypes.find(ct => ct.label === conn.customType);
                if (customType) {
                    labelColor = customType.color;
                    icon = customType.icon || '';
                } else {
                    const hash = conn.customType.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
                    const fallbackColors = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e91e63','#34495e'];
                    labelColor = fallbackColors[hash % fallbackColors.length];
                }
            }

            const bezierMid = getBezierPoint(0.5, {x: x1, y: y1}, {x: cx1, y: cy1}, {x: cx2, y: cy2}, {x: x2, y: y2});

            const fo = document.createElementNS('http://www.w3.org/2000/svg', 'foreignObject');
            fo.setAttribute('x', bezierMid.x - 50);
            fo.setAttribute('y', bezierMid.y - 15);
            fo.setAttribute('width', '100');
            fo.setAttribute('height', '30');
            fo.style.pointerEvents = 'none';

            const div = createEl('div', {
                style: {
                    display: 'inline-block', padding: '2px 8px', borderRadius: '4px',
                    fontSize: '11px', fontFamily: '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif',
                    color: labelColor, border: `1.5px solid ${labelColor}`,
                    background: 'rgba(255,255,255,0.95)', textAlign: 'center', whiteSpace: 'nowrap',
                    boxShadow: '0 1px 4px rgba(0,0,0,0.1)',
                    position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -50%)'
                },
                text: (icon ? icon + ' ' : '') + labelText,
                on: {
                    dblclick: (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        showConnectionTypeSelectorForEdit(conn, e.clientX, e.clientY);
                    }
                }
            });

            fo.appendChild(div);
            group.appendChild(fo);
        }

        function createConnectionEndpoints(group, x1, y1, x2, y2, fromColor, toColor) {
            createSvgEl('circle', {
                cx: x1, cy: y1, r: '7',
                style: { fill: '#fff', stroke: fromColor, strokeWidth: '1.5' },
                'pointer-events': 'none',
                class: 'conn-endpoint'
            }, group);

            createSvgEl('circle', {
                cx: x2, cy: y2, r: '7',
                style: { fill: '#fff', stroke: toColor, strokeWidth: '1.5' },
                'pointer-events': 'none',
                class: 'conn-endpoint'
            }, group);
        }

        function createConnectionPath(pathD, gradId, conn) {
            const group = createSvgEl('g', {
                class: 'conn-group',
                'data-from': conn.from,
                'data-to': conn.to
            });

            const hitPath = createSvgEl('path', {
                d: pathD,
                fill: 'none',
                stroke: 'rgba(0,0,0,0)',
                'stroke-width': '10',
                'pointer-events': 'all',
                style: { pointerEvents: 'all', cursor: 'pointer' }
            }, group);

            const path = createSvgEl('path', {
                d: pathD,
                class: 'connection-line',
                stroke: `url(#${gradId})`,
                'pointer-events': 'none',
                style: { pointerEvents: 'none' }
            }, group);

            return { group, hitPath, path };
        }

        function createConnectionGradient(conn, x1, y1, x2, y2, fromColor, toColor) {
            const svg = document.getElementById('connections');
            let defs = svg.querySelector('defs');
            if (!defs) {
                defs = createSvgEl('defs', {}, svg);
                svg.prepend(defs);
            }
            const gradId = `conn-grad-${conn.from}-${conn.to}`;
            const existingGrad = document.getElementById(gradId);
            if (existingGrad) existingGrad.remove();
            const gradient = createSvgEl('linearGradient', {
                id: gradId, gradientUnits: 'userSpaceOnUse', x1, y1, x2, y2
            });
            gradient.appendChild(createSvgEl('stop', { offset: '0%', 'stop-color': fromColor }));
            gradient.appendChild(createSvgEl('stop', { offset: '100%', 'stop-color': toColor }));
            defs.appendChild(gradient);
            return gradId;
        }

        function buildNodeRectCache() {
            state._nodeRectCache = {};
            const canvasRect = document.getElementById('canvas-container').getBoundingClientRect();
            document.querySelectorAll('.node[data-id]').forEach(el => {
                const id = el.dataset.id;
                const rect = el.getBoundingClientRect();
                state._nodeRectCache[id] = {
                    x: (rect.left - canvasRect.left - state.panX) / state.scale,
                    y: (rect.top - canvasRect.top - state.panY) / state.scale,
                    width: rect.width / state.scale,
                    height: rect.height / state.scale
                };
            });
        }

        function clearConnections(filterConnIds = null) {
            if (filterConnIds) {
                filterConnIds.forEach(id => {
                    const [from, to] = id.split('-');
                    const group = connectionsSvg.querySelector(`.conn-group[data-from="${from}"][data-to="${to}"]`);
                    if (group) group.remove();
                    const grad = document.getElementById(`conn-grad-${from}-${to}`);
                    if (grad) grad.remove();
                });
            } else {
                connectionsSvg.innerHTML = '';
            }
        }

        function renderConnections(filterConnIds = null) {
            buildNodeRectCache();
            clearConnections(filterConnIds);

            // Collect all nodes that are hidden due to parent connection collapse (cascade)
            const hiddenNodeIds = getHiddenNodeIds();

            state.connections.forEach(conn => {
                // If filterConnIds is provided, only render matching connections (incremental update)
                if (filterConnIds && !filterConnIds.includes(`${conn.from}-${conn.to}`)) return;
                
                // Skip connections whose source is hidden by parent collapse
                const visibleConn = getVisibleConnection(conn, hiddenNodeIds);
                if (!visibleConn) return;
                const { conn: c, fromNode, toNode } = visibleConn;
                const rawFromNode = state.nodes.find(n => n.id === c.from);
                const rawToNode = state.nodes.find(n => n.id === c.to);

                // Calculate edge points: root nodes use center, child nodes use left/right side
                const { fromEdge, toEdge } = getConnectionEdgePoints(fromNode, toNode);

                const { x1, y1, x2, y2, cx1, cy1, cx2, cy2, len, edgeLen } = calculateBezierConnection(fromNode, toNode, fromEdge, toEdge);

                const pathD = `M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}`;

                // Get node colors for gradient and endpoints
                const fromColor = fromNode.color || '#999';
                const toColor = toNode.color || '#999';

                // Create SVG gradient for this connection
                const gradId = createConnectionGradient(conn, x1, y1, x2, y2, fromColor, toColor);

                // Group for hover management
                const { group, hitPath, path } = createConnectionPath(pathD, gradId, conn);

                // Double-click to toggle collapse (mousedown-based for reliability + dblclick fallback)
                let connLastMouseDown = 0;
                let connMouseDownPos = { x: 0, y: 0 };

                const doToggleCollapse = (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    conn.collapsed = !conn.collapsed;
                    const rawToNode = state.nodes.find(n => n.id === conn.to);
                    if (conn.collapsed && !conn.originalToPos) {
                        if (rawToNode) {
                            conn.originalToPos = { x: rawToNode.x, y: rawToNode.y };
                        }
                    }
                    // Clear saved indicator position when expanding so it recalculates to mid-point
                    if (!conn.collapsed) {
                        delete conn.indX;
                        delete conn.indY;
                    }
                    renderAll();
                };

                hitPath.addEventListener('dblclick', doToggleCollapse);

                // mousedown-based double-click detection for SVG reliability
                hitPath.addEventListener('mousedown', (e) => {
                    if (e.button !== 0) return;
                    
                    // Skip if clicking on endpoint drag area (priority: endpoint > connection line)
                    const mouseX = (e.clientX - state.panX) / state.scale;
                    const mouseY = (e.clientY - state.panY) / state.scale;
                    const distFrom = Math.hypot(mouseX - x1, mouseY - y1);
                    const distTo = Math.hypot(mouseX - x2, mouseY - y2);
                    if (distFrom < 24 || distTo < 24) return;
                    
                    const now = Date.now();
                    const dx = e.clientX - connMouseDownPos.x;
                    const dy = e.clientY - connMouseDownPos.y;
                    const dist = Math.hypot(dx, dy);

                    if (now - connLastMouseDown < 300 && dist < 10) {
                        // Double-click detected
                        connLastMouseDown = 0;
                        doToggleCollapse(e);
                        // Clear saved indicator position when toggling collapse via connection line
                        delete conn.indX;
                        delete conn.indY;
                    } else {
                        connLastMouseDown = now;
                        connMouseDownPos = { x: e.clientX, y: e.clientY };
                    }
                });

                // For collapsed connections, shorten line to indicator at mid-point
                if (conn.collapsed) {
                    let indX, indY;
                    if (state.dragIndicator && state.dragIndicator.conn === conn) {
                        // Use drag position for smooth mouse tracking
                        indX = state.dragIndicator.currentIndX;
                        indY = state.dragIndicator.currentIndY;
                    } else if (conn.indX !== undefined && conn.indY !== undefined) {
                        // Use saved indicator position from previous drag
                        indX = conn.indX;
                        indY = conn.indY;
                    } else {
                        indX = (fromCx + toCx) / 2;
                        indY = (fromCy + toCy) / 2;
                    }
                    const shortD = `M ${x1} ${y1} L ${indX} ${indY}`;
                    path.setAttribute('d', shortD);
                    hitPath.setAttribute('d', shortD);
                    path.setAttribute('stroke-dasharray', '5,3');
                }

                group.appendChild(hitPath);
                group.appendChild(path);

                // Endpoint dots colored by each node's color box
                createConnectionEndpoints(group, x1, y1, x2, y2, fromColor, toColor);

                // Collapsed indicator at mid-point (where label would be)
                if (conn.collapsed) {
                    let indX, indY;
                    if (state.dragIndicator && state.dragIndicator.conn === conn) {
                        indX = state.dragIndicator.currentIndX;
                        indY = state.dragIndicator.currentIndY;
                    } else if (conn.indX !== undefined && conn.indY !== undefined) {
                        indX = conn.indX;
                        indY = conn.indY;
                    } else {
                        indX = (fromCx + toCx) / 2;
                        indY = (fromCy + toCy) / 2;
                    }

                    const { indicator, plus } = createCollapsedIndicator(group, indX, indY, toColor);

                    // Click indicator to expand
                    // +インジケータのダブルクリック/ドラッグ処理(indicatorとplusで変数を共有)
                    // 注意: renderConnections()の呼び出しごとにリセットされないようstateで管理
                    if (!state.indClickState) state.indClickState = {};
                    const indClickKey = conn.from + '-' + conn.to;
                    if (!state.indClickState[indClickKey]) {
                        state.indClickState[indClickKey] = { lastMouseDown: 0, mouseDownPos: { x: 0, y: 0 } };
                    }
                    const indClick = state.indClickState[indClickKey];

                    [indicator, plus].forEach(el => {
                        // Drag indicator to move collapsed node and all hidden descendants
                        // Also handles double-click to toggle collapse/expand
                        el.addEventListener('mousedown', (e) => {
                            if (e.button !== 0) return;
                            const now = Date.now();
                            const dx = e.clientX - indClick.mouseDownPos.x;
                            const dy = e.clientY - indClick.mouseDownPos.y;
                            const dist = Math.hypot(dx, dy);

                            if (now - indClick.lastMouseDown < 300 && dist < 10) {
                                // Double-click: toggle collapse (same as connection line)
                                indClick.lastMouseDown = 0;
                                e.stopPropagation();
                                e.preventDefault();
                                conn.collapsed = !conn.collapsed;
                                const rawToNode = state.nodes.find(n => n.id === conn.to);
                                if (!conn.collapsed && conn.originalToPos) {
                                    if (rawToNode) {
                                        rawToNode.x = conn.originalToPos.x;
                                        rawToNode.y = conn.originalToPos.y;
                                    }
                                    delete conn.originalToPos;
                                    // Clear saved indicator position when expanding
                                    delete conn.indX;
                                    delete conn.indY;
                                } else if (conn.collapsed && !conn.originalToPos) {
                                    if (rawToNode) {
                                        conn.originalToPos = { x: rawToNode.x, y: rawToNode.y };
                                    }
                                    // Clear saved indicator position when re-collapsing (will use midpoint)
                                    delete conn.indX;
                                    delete conn.indY;
                                }
                                renderAll();
                                return;
                            }

                            indClick.lastMouseDown = now;
                            indClick.mouseDownPos = { x: e.clientX, y: e.clientY };

                            // Single click: start drag
                            e.stopPropagation();
                            e.preventDefault();

                            // Cache container rect to avoid repeated forced reflow
                            const containerRect = container.getBoundingClientRect();

                            // Collect all hidden descendant nodes with their ABSOLUTE offsets from indicator
                            const hiddenDescendants = [];

                            // Include the direct target node (raw target, not visible endpoint) first
                            const rawToNode = state.nodes.find(n => n.id === conn.to);
                            if (rawToNode) {
                                const absPos = getNodeAbsolutePosition(rawToNode);
                                hiddenDescendants.push({
                                    node: rawToNode,
                                    offsetX: absPos.x - indX,
                                    offsetY: absPos.y - indY,
                                    conn: conn
                                });
                            }

                            // Recursively collect ALL descendants (not just collapsed connections)
                            // In cascade collapse, child connections may not have collapsed flag
                            const collectHidden = (nodeId) => {
                                state.connections
                                    .filter(c => c.from === nodeId)
                                    .forEach(c => {
                                        const n = state.nodes.find(node => node.id === c.to);
                                        if (n) {
                                            const absPos = getNodeAbsolutePosition(n);
                                            hiddenDescendants.push({
                                                node: n,
                                                offsetX: absPos.x - indX,
                                                offsetY: absPos.y - indY,
                                                conn: c
                                            });
                                            collectHidden(c.to);
                                        }
                                    });
                            };
                            collectHidden(conn.to);

                            state.dragIndicator = {
                                conn: conn,
                                indOffsetX: (e.clientX - containerRect.left - state.panX) / state.scale - indX,
                                indOffsetY: (e.clientY - containerRect.top - state.panY) / state.scale - indY,
                                hiddenDescendants: hiddenDescendants,
                                currentIndX: indX,
                                currentIndY: indY
                            };
                        });
                    });

                    group.appendChild(indicator);
                    group.appendChild(plus);
                }

                // Label with decoration
                createConnectionLabel(group, conn, x1, y1, cx1, cy1, cx2, cy2, x2, y2);

                // Connection drag points
                createConnectionDragPoints(group, conn, x1, y1, x2, y2, fromColor, toColor, conn.collapsed);

                // Right-click on connection to delete - use distance-based priority
                group.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();

                    // Distance-based priority: check if this is the closest connection to mouse
                    const mouseX = (e.clientX - state.panX) / state.scale;
                    const mouseY = (e.clientY - state.panY) / state.scale;

                    let closestConn = conn;
                    let minDist = Infinity;

                    const groups = connectionsSvg.querySelectorAll('.conn-group');
                    for (const g of groups) {
                        const hitPath = g.querySelector('path[stroke-width="10"]');
                        if (!hitPath) continue;
                        const pathLen = hitPath.getTotalLength();
                        if (pathLen === 0) continue;

                        let bestDist = Infinity;
                        const step = Math.max(pathLen / 20, 5);
                        for (let i = 0; i <= pathLen; i += step) {
                            const pt = hitPath.getPointAtLength(Math.min(i, pathLen));
                            const d = Math.hypot(pt.x - mouseX, pt.y - mouseY);
                            if (d < bestDist) bestDist = d;
                        }

                        const threshold = 15 / state.scale;
                        if (bestDist < threshold && bestDist < minDist) {
                            minDist = bestDist;
                            const fromId = parseInt(g.getAttribute('data-from'));
                            const toId = parseInt(g.getAttribute('data-to'));
                            const foundConn = state.connections.find(c => c.from === fromId && c.to === toId);
                            if (foundConn) closestConn = foundConn;
                        }
                    }

                    showConnectionContextMenu(e.clientX, e.clientY, closestConn);
                });

                // Wider invisible hover area (reduced from 30 to 15)
                const hoverPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                // Use shortened path when collapsed to avoid hidden node area
                if (conn.collapsed) {
                    const indX = (fromCx + toCx) / 2;
                    const indY = (fromCy + toCy) / 2;
                    hoverPath.setAttribute('d', `M ${x1} ${y1} L ${indX} ${indY}`);
                } else {
                    hoverPath.setAttribute('d', pathD);
                }
                hoverPath.setAttribute('fill', 'none');
                hoverPath.setAttribute('stroke', 'transparent');
                hoverPath.setAttribute('stroke-width', '15');
                hoverPath.setAttribute('pointer-events', 'stroke');
                hoverPath.setAttribute('cursor', 'pointer');
                hoverPath.style.opacity = '0';
                group.insertBefore(hoverPath, path);

                connectionsSvg.appendChild(group);
            });
        }

        // ==================== Virtual Connection Line ====================
        function updatePendingConnection(x, y, fromNodeId) {
            let tempLine = document.getElementById('pending-connection');
            const sourceId = fromNodeId || state.connectingFrom;
            if (!sourceId && !state.draggingConn) {
                if (tempLine) tempLine.remove();
                return;
            }

            let fromNode;
            if (state.draggingConn) {
                const anchorNodeId = state.draggingConn.isSource ? state.draggingConn.to : state.draggingConn.from;
                fromNode = state.nodes.find(n => n.id === anchorNodeId);
            } else {
                fromNode = state.nodes.find(n => n.id === sourceId);
            }
            if (!fromNode) {
                if (tempLine) tempLine.remove();
                return;
            }

            const x1 = fromNode.x + (fromNode.width || 200) / 2;
            const y1 = fromNode.y + (fromNode.height || 50) / 2;
            const x2 = (x - state.panX) / state.scale;
            const y2 = (y - state.panY) / state.scale;

            const dx = x2 - x1;
            const dy = y2 - y1;
            const len = Math.sqrt(dx * dx + dy * dy);
            const cx1 = x1 + dx * 0.5;
            const cy1 = y1;
            const cx2 = x2 - dx * 0.5;
            const cy2 = y2;

            const pathD = `M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}`;

            if (!tempLine) {
                tempLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                tempLine.id = 'pending-connection';
                tempLine.setAttribute('fill', 'none');
                tempLine.setAttribute('stroke', '#4a90d9');
                tempLine.setAttribute('stroke-width', '2');
                tempLine.setAttribute('stroke-dasharray', '6,4');
                tempLine.setAttribute('pointer-events', 'none');
                connectionsSvg.appendChild(tempLine);
            }

            tempLine.setAttribute('d', pathD);
        }
        // ==================== Picker Utilities ====================
        function createPopup(className, x, y, options = {}) {
            const { minWidth = 'auto', flexDirection = 'column', gap = '4px', padding = '8px', center = false } = options;
            const existing = document.querySelector('.' + className);
            if (existing) existing.remove();

            const popup = createEl('div', {
                class: className,
                style: {
                    position: 'fixed', left: x + 'px', top: y + 'px',
                    background: 'white', border: '1px solid #ddd', borderRadius: '8px',
                    padding: padding, boxShadow: '0 4px 16px rgba(0,0,0,0.15)',
                    zIndex: 10000, display: 'flex', flexDirection: flexDirection, gap: gap,
                    minWidth: minWidth
                }
            });
            document.body.appendChild(popup);
            closeOnClickOutside(popup);
            
            if (center) {
                requestAnimationFrame(() => {
                    const rect = popup.getBoundingClientRect();
                    popup.style.left = Math.min(window.innerWidth - rect.width - 10, Math.max(10, (window.innerWidth / 2) - (rect.width / 2))) + 'px';
                    popup.style.top = Math.min(window.innerHeight - rect.height - 10, Math.max(10, (window.innerHeight / 2) - (rect.height / 2))) + 'px';
                });
            }
            
            return popup;
        }

                    },

        function showColorPicker(e, node) {

            // color-picker CSS has grid layout, override inline

        // ==================== Mouse/Touch Handlers ====================
        const nodeDblClickState = new Map();

        // Unified drag-and-drop mouseenter handler for all node types
        function handleNodeMouseEnter(e, element, node) {
            // State management is handled entirely by mousemove (vertical third-split logic).
            // mouseenter only clears stale CSS classes from other nodes.
            if (!state.isDragging || !state.dragNode || state.dragNode.id === node.id) return;
            // No state updates here - mousemove owns state.dropTarget / state.reorderTarget
        }

        // Unified drag-and-drop mouseleave handler for all node types
        function handleNodeMouseLeave(element, node) {
            // State (dropTarget/reorderTarget) is managed by mousemove; do not clear here
            // to avoid race conditions between mouseleave and mousemove events.
        }

        function handleNodeMouseDown(e, node) {
            console.log('[DEBUG] handleNodeMouseDown called. target=', e.target.className, 'nodeId=', node.id);
            if (e.button !== 0) return;
            // Guard: skip drag if clicking on interactive elements (allow dragging on node-title)
            // ハンバーガーメニューのmousedownも除外
            if (e.target.closest('.task-delete-btn') ||
                e.target.closest('.expand-btn') || e.target.closest('.color-picker') ||
                e.target.closest('.node-color') || e.target.closest('.add-task') ||
                e.target.closest('.resize-handle') || e.target.closest('.hamburger') ||
                e.target.closest('.node-indicators') || e.target.closest('.indicator-group')) {
                console.log('[DEBUG] handleNodeMouseDown: clicked on interactive element, returning');
                return;
            }

            e.stopPropagation();

            const now = Date.now();
            const dblState = nodeDblClickState.get(node.id) || { lastMouseDownTime: 0, cooldown: false };

            if (dblState.cooldown) {
                e.preventDefault();
                return;
            }

            const timeDiff = now - dblState.lastMouseDownTime;
            if (timeDiff < 300) {
                e.preventDefault();
                window.getSelection().removeAllRanges();
                dblState.cooldown = true;
                dblState.lastMouseDownTime = 0;
                nodeDblClickState.set(node.id, dblState);

                node.expanded = !node.expanded;
                renderNodes();

                // Clear drag state to prevent extraction on mouseup after double-click
                state.dragNode = null;
                state.isDragging = false;
                state.pendingExtract = false;
                state.reorderTarget = null;
                state.dropTarget = null;
                const tooltip = document.getElementById('drag-tooltip');
                if (tooltip) tooltip.classList.remove('show');

                setTimeout(() => {
                    dblState.cooldown = false;
                    nodeDblClickState.set(node.id, dblState);
                }, 200);
                return;
            }

            dblState.lastMouseDownTime = now;
            nodeDblClickState.set(node.id, dblState);

            // Calculate absolute position for drag offset
            let nodeAbsX = node.x;
            let nodeAbsY = node.y;
            if (node.parentId !== null) {
                // Use actual DOM position for child nodes to prevent jump at drag start
                const domEl = document.querySelector(`.node[data-id="${node.id}"]`);
                if (domEl) {
                    const rect = domEl.getBoundingClientRect();
                    const canvasRect = document.getElementById('canvas-container').getBoundingClientRect();
                    nodeAbsX = (rect.left - canvasRect.left - state.panX) / state.scale;
                    nodeAbsY = (rect.top - canvasRect.top - state.panY) / state.scale;
                } else {
                    const absPos = getNodeAbsolutePosition(node);
                    nodeAbsX = absPos.x;
                    nodeAbsY = absPos.y;
                }
                // Store absolute position so renderNodes() can position the dragged node correctly
                node.absX = nodeAbsX;
                node.absY = nodeAbsY;
            }

            // Store drag start position to distinguish click from drag
            state.dragStartX = nodeAbsX;
            state.dragStartY = nodeAbsY;

            // Multi-select drag: if node is already selected, keep selection and start drag
            if (!e.ctrlKey && !e.metaKey && state.mode !== 'connect' &&

                        const domEl = document.querySelector(`.node[data-id="${node.id}"]`);
                        if (!domEl) continue;
                        let rect;
                        if (node.parentId === null) {
                            // Root nodes: use header for hit test to avoid child node overlap
                            const headerEl = domEl.querySelector('.node-header') || domEl.querySelector('.node-title');
                            rect = headerEl ? headerEl.getBoundingClientRect() : domEl.getBoundingClientRect();
                        } else {
                            // Child nodes: use full div.node (no .node-header class)
                            rect = domEl.getBoundingClientRect();
                        }
                        const nx = (rect.left - canvasRect.left - state.panX) / state.scale;
                        const ny = (rect.top - canvasRect.top - state.panY) / state.scale;
                        const nw = rect.width / state.scale;
                        const nh = rect.height / state.scale;

                        if (mx >= nx && mx <= nx + nw && my >= ny && my <= ny + nh) {
                            const centerX = nx + nw / 2;
                            const centerY = ny + nh / 2;
                            const dist = Math.hypot(mx - centerX, my - centerY);
                            candidates.push({ node, dist });
                        }
                    }

                    // Pick closest candidate
                    let targetNode = null;
                    let minDist = Infinity;
                    for (const c of candidates) {
                        if (c.dist < minDist) {
                            minDist = c.dist;
                            targetNode = c.node;
                        }
                    }

                    // Clear all indicators
                    document.querySelectorAll('.node').forEach(el => {
                        el.classList.remove('reorder-before', 'reorder-after', 'nest-target');

                    if (targetNode) {

                        let headerEl, fullRect;
                        if (targetNode.parentId === null) {

                            headerEl = targetDomEl ? (targetDomEl.querySelector('.node-header') || targetDomEl.querySelector('.node-title')) : null;

                            state.pendingExtract = false;

                            if (tooltip) { tooltip.textContent = '▼'; tooltip.classList.add('show'); }

                            state.reorderTarget = null;
                            state.pendingExtract = false;
                            hideInsertGuides();

                        state.reorderTarget = null;

                            if (tooltip) { tooltip.textContent = '⏎'; tooltip.classList.add('show'); }
                        } else {
                            state.pendingExtract = false;
                            if (tooltip) tooltip.classList.remove('show');
                        }

                                }

                                    const absPos = getNodeAbsolutePosition(node);

                                    node.y = absPos.y - parentAbsPos.y;

                        showToast(`${nodesToProcess.length}個のノードを取り出しました`);

        function getPinchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);

        function createContextMenu(x, y) {
            const existing = document.querySelector('.context-menu');
            if (existing) existing.remove();

            const menu = createEl('div', {
                class: 'context-menu',

            document.body.appendChild(menu);

            // Boundary check
            requestAnimationFrame(() => {
                const rect = menu.getBoundingClientRect();
                if (rect.right > window.innerWidth) menu.style.left = (window.innerWidth - rect.width - 10) + 'px';
                if (rect.bottom > window.innerHeight) menu.style.top = (window.innerHeight - rect.height - 10) + 'px';
            });

            closeOnClickOutside(menu);
            return menu;
        }

        function addContextMenuItems(menu, items) {
            items.forEach(item => {
                if (item === null) return;
                if (item.class === 'context-separator') {
                    createEl('div', { class: 'context-separator', parent: menu });
                    return;
                }
                createEl('div', {
                    class: 'context-item' + (item.class ? ' ' + item.class : '') + (item.disabled ? ' disabled' : ''),
                    html: item.html || `${item.icon || ''} ${item.text || ''}`,
                    on: {
                        click: (e) => {
                            e.stopPropagation();
                            if (item.disabled) return;
                            item.action();
                            menu.remove();
                        }
                    },
                    parent: menu
                });
            });
        }

        // ==================== Keyboard Shortcuts ====================
        // NOTE: Keyboard shortcuts with strict activeElement checks to prevent
        // accidental triggering during text input in editors.

        document.addEventListener('keydown', (e) => {
            // Strict check: skip ALL keyboard shortcuts when user is typing
            const active = document.activeElement;
            const isTyping = active && (
                active.tagName === 'INPUT' ||
                active.tagName === 'TEXTAREA' ||
                active.isContentEditable ||
                active.closest('input, textarea, [contenteditable]')
            );

            if (isTyping) {
                // Only allow Escape within typing contexts
                if (e.key === 'Escape') {
                    e.target.blur?.();
                }
                return;
            }

            // Ctrl+S / Ctrl+Shift+S: file save
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                e.stopPropagation();
                if (e.repeat) return;
                saveToFile(!e.shiftKey);
                return;
            }

            // Delete / Backspace: delete selected node(s)
            if (e.key === 'Delete' || e.key === 'Backspace') {
                if (state.selectedNodeIds.length > 0) {
                    state.selectedNodeIds.forEach(id => deleteNode(id));
                    clearSelection();
                } else if (state.selectedNodeId) {
                    deleteNode(state.selectedNodeId);
                    state.selectedNodeId = null;
                }
                return;
            }

            // Ctrl+Z: Undo
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
                e.preventDefault();
                e.stopPropagation();
                undo();
                return;
            }

            // Ctrl+Shift+Z / Ctrl+Y: Redo
            if ((e.ctrlKey || e.metaKey) && ((e.key.toLowerCase() === 'z' && e.shiftKey) || e.key.toLowerCase() === 'y')) {
                e.preventDefault();
                e.stopPropagation();
                redo();
                return;
            }

            // Escape: cancel pending connection
            if (e.key === 'Escape') {
                state.connectingFrom = null;
                state.pendingConnectionType = null;
                state.pendingConnectionCustomType = null;
                const tempLine = document.getElementById('pending-connection');
                if (tempLine) tempLine.remove();
                modeIndicator.classList.remove('active');
                setMode('select');
            }
        });

        // ==================== FileHandle Persistence (IndexedDB) ====================
        const DB_NAME = 'taskmind';
        const DB_STORE = 'fileHandles';
        const DB_VERSION = 1;

        function openFileHandleDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                    e.target.result.createObjectStore(DB_STORE);
                };
                req.onsuccess = (e) => resolve(e.target.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveFileHandleToDB(handle) {
            try {
                const db = await openFileHandleDB();
                const tx = db.transaction(DB_STORE, 'readwrite');
                tx.objectStore(DB_STORE).put(handle, 'lastFileHandle');
                return new Promise((resolve, reject) => {
                    tx.oncomplete = resolve;
                    tx.onerror = () => reject(tx.error);
                });
            } catch(e) {
                console.warn('Failed to save FileHandle to DB:', e);
            }
        }

        async function loadFileHandleFromDB() {
            try {
                const db = await openFileHandleDB();
                const tx = db.transaction(DB_STORE, 'readonly');
                const store = tx.objectStore(DB_STORE);
                const req = store.get('lastFileHandle');
                return new Promise((resolve, reject) => {
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => reject(req.error);
                });
            } catch(e) {
                console.warn('Failed to load FileHandle from DB:', e);
                return null;
            }
        }

        function updateSelectionBox(x1, y1, x2, y2) {

            }
            box.style.display = 'block';
            box.style.left = Math.min(x1, x2) + 'px';
            box.style.top = Math.min(y1, y2) + 'px';
            box.style.width = Math.abs(x2 - x1) + 'px';
            box.style.height = Math.abs(y2 - y1) + 'px';
        }

        function saveToFile(overwrite = false) {
            const data = {
                version: 2,
                nodes: state.nodes,
                connections: state.connections,
                nextId: state.nextId,
                customConnectionTypes: state.customConnectionTypes,
                lastFileName: state.lastFileName,
                lastFilePath: state.lastFilePath
            };
            const json = JSON.stringify(data, null, 2);
            
            // Auto-save to localStorage for reload recovery
            try {
                localStorage.setItem('taskmind_autosave', json);
            } catch(e) {
                console.warn('Failed to autosave to localStorage:', e);
            }

            // Try File System Access API for overwrite save
            if (overwrite && state.lastFileHandle) {
                return state.lastFileHandle.createWritable().then(writable => {
                    return writable.write(json).then(() => {
                        writable.close();
                        showToast('上書き保存しました');
                        updateFileInfoDisplay(new Date());
                    });
                }).catch(err => {
                    console.error('Overwrite save failed:', err);
                    // Fallback to download
                    downloadJSON(json);
                });
            }

            // Show save file picker for "Save As"
            if ('showSaveFilePicker' in window) {
                const opts = {
                    suggestedName: state.lastFileName || `taskmind-${new Date().toISOString().slice(0,10)}.json`,
                    types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }]
                };
                return window.showSaveFilePicker(opts).then(handle => {
                    state.lastFileHandle = handle;
                    state.lastFileName = handle.name;
                    state.lastFilePath = handle.name;
                    saveFileHandleToDB(handle); // IndexedDBへ永続化
                    updateFileInfoDisplay(); // ファイル名のみ先行表示
                    return handle.createWritable().then(writable => {
                        return writable.write(json).then(() => {
                            writable.close();
                            showToast('保存しました');
                            updateFileInfoDisplay(new Date());
                            updateFileInfoDisplay();
                        });
                    });
                }).catch(err => {
                    if (err.name !== 'AbortError') {
                        console.error('Save picker failed:', err);
                        downloadJSON(json);
                    }
                });
            }

            // Fallback: download
            downloadJSON(json);
            return Promise.resolve();
        }

        function updateFileInfoDisplay() {
            const pathEl = document.getElementById('file-path');
            if (pathEl) {
                const path = state.lastFilePath || state.lastFileName;
                pathEl.textContent = path ? '📁 パス: ' + path : '';
                pathEl.title = path || '';

        async function loadFromFile(file = null) {
            // File System Access API path
            if (!file && 'showOpenFilePicker' in window) {
                try {
                    const [handle] = await window.showOpenFilePicker({
                        types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }],
                        multiple: false
                    });
                    state.lastFileHandle = handle;
                    state.lastFileName = handle.name;
                    state.lastFilePath = handle.name;
                    saveFileHandleToDB(handle); // IndexedDBへ永続化
                    const fileObj = await handle.getFile();
                    await parseFileData(fileObj);
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return;
                    console.error('Open picker failed:', err);
                    // Fall through to legacy input method
                }
            }

            // Legacy path (from file input or fallback)
            if (file) {
                state.lastFileName = file.name;
                state.lastFilePath = file.name;
                await parseFileData(file);
            }
        }

        function parseFileData(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        
                        // Auto-save to localStorage for reload recovery
                        try {
                            localStorage.setItem('taskmind_autosave', e.target.result);
                        } catch(lsErr) {
                            console.warn('Failed to autosave to localStorage:', lsErr);
                        }
                        
                        state.nodes = (data.nodes || []).map(n => {
                            const node = {
                                ...n,
                                completed: n.completed ?? false
                            };
                            // Inject missing 5W1H fields for backward compatibility
                            if (typeof node.priority !== 'number') node.priority = 0;
                            if (!node.type) node.type = 'task';
                            if (!node.details || typeof node.details !== 'object') {
                                node.details = {
                                    when: { cycle: '', startDate: '', deadline: '' },
                                    what: '',
                                    who: '',
                                    where: '',
                                    link: ''
                                };
                            }
                            if (!node.details.when || typeof node.details.when !== 'object') {
                                node.details.when = { cycle: '', startDate: '', deadline: '' };
                            }
                            delete node.tasks;
                            return node;
                        });

                        // Build children arrays from parentId for old data compatibility
                        state.nodes.forEach(node => {
                            if (!node.children || node.children.length === 0) {
                                node.children = state.nodes
                                    .filter(n => n.parentId === node.id)
                                    .map(n => n.id);
                            }
                        });
                        state.connections = data.connections || [];
                        state.nextId = data.nextId || 1;
                        state.customConnectionTypes = data.customConnectionTypes || [];

                        renderAll();
                        fitToView();
                        // 履歴をクリアし、初期スナップショットとして保存
                        state.history = [];
                        state.historyIndex = -1;
                        saveSnapshot();
                        // ロード時にwhen再計算実行
                        recalculateWhenDates();
                        showToast('読込みました' + (state.lastFileName ? ` (${state.lastFileName})` : ''));
                        updateFileInfoDisplay(new Date());
                        updateFileInfoDisplay();
                        resolve();
                    } catch (err) {
                        showToast('読込エラー: ' + err.message);
                        resolve();
                    }
                };
                reader.readAsText(file);
            });
        }

            console.log('[Notify] Button clicked');
            
            if (!('Notification' in window)) {
                showToast('このブラウザは通知をサポートしていません');
                updateNotifyButton(false, true);
                return;
            }
            
            const currentPermission = Notification.permission;
            console.log('[Notify] Current permission:', currentPermission);
            
            if (currentPermission === 'granted') {
                _notificationEnabled = true;
                updateNotifyButton(true);
                // テスト通知を送信
                sendTestNotification();
                showToast('通知は有効です（テスト通知を送信しました）');
                return;
            }
            
            if (currentPermission === 'denied') {
                showToast('通知がブロックされています。ブラウザ設定で許可してください');
                updateNotifyButton(false, true);
                return;
            }
            
            // default状態の場合、クリックハンドラ内で直接requestPermissionを呼ぶ（ユーザージェスチャー保持）
            console.log('[Notify] Requesting permission...');
            try {
                const result = Notification.requestPermission();
                
                if (result && typeof result.then === 'function') {
                    // Promise式API（モダンブラウザ）
                    result.then(permission => {
                        console.log('[Notify] Permission result:', permission);
                        if (permission === 'granted') {
                            _notificationEnabled = true;
                            updateNotifyButton(true);
                            showToast('通知が有効になりました');
                            setTimeout(() => {
                                try {
                                    new Notification('TaskMind', { body: '通知が有効になりました' });
                                } catch (e) {
                                    console.log('[Notify] Test notification failed:', e);
                                }
                            }, 100);
                        } else {
                            updateNotifyButton(false, true);
                            showToast('通知が許可されませんでした');
                        }
                    }).catch(err => {
                        console.error('[Notify] Error requesting permission:', err);
                        showToast('通知エラー: ' + err.message);
                        updateNotifyButton(false, true);
                    });
                } else {
                    // コールバック式API（古いブラウザ）
                    const permission = result;
                    console.log('[Notify] Permission result (sync):', permission);
                    if (permission === 'granted') {
                        _notificationEnabled = true;
                        updateNotifyButton(true);
                        showToast('通知が有効になりました');
                    } else {
                        updateNotifyButton(false, true);
                        showToast('通知が許可されませんでした');
                    }
                }
            } catch (err) {
                console.error('[Notify] Exception:', err);
                showToast('通知エラー: ' + err.message);
                updateNotifyButton(false, true);
            }
        });

        // Auto-restore from localStorage on reload

                        // Directly restore state without using FileReader
                        state.nodes = (data.nodes || []).map(n => {
                            const node = { ...n, completed: n.completed ?? false };

        // ==================== When Recalculation ====================
        /**
         * 全ノードのwhenを再計算
         * - nextDateが現在時刻を過ぎていたらノードを再有効化(completed=false)
         * - 次回日時を再計算してnextDateを更新
         * @returns {number} 再有効化したノード数
         */
        function calculateDeadlineDate(when, baseDate) {
            if (!when || !baseDate) return null;
            if (when.deadlineType === 'absolute' && when.deadlineDate) {
                return new Date(when.deadlineDate);
            } else {
                const [dlHours, dlMinutes] = (when.deadlineTime || '18:00').split(':');
                const deadlineDate = new Date(baseDate);
                deadlineDate.setDate(deadlineDate.getDate() + (when.deadlineDays || 0));
                deadlineDate.setHours(parseInt(dlHours), parseInt(dlMinutes), 0, 0);
                return deadlineDate;
            }
        }

        // Check if schedule parameters changed between old and new when data
        function didScheduleChange(oldWhen, newWhen) {
            if (!oldWhen || !newWhen) return true;
            const oldDays = (oldWhen.daysOfWeek || []).slice().sort().join(',');
            const newDays = (newWhen.daysOfWeek || []).slice().sort().join(',');
            return (
                oldWhen.repeatType !== newWhen.repeatType ||
                oldWhen.baseDateTime !== newWhen.baseDateTime ||
                oldWhen.baseTime !== newWhen.baseTime ||
                oldDays !== newDays ||
                oldWhen.weekOfMonth !== newWhen.weekOfMonth ||
                oldWhen.monthDay !== newWhen.monthDay ||
                oldWhen.yearMonth !== newWhen.yearMonth ||
                oldWhen.yearDay !== newWhen.yearDay ||
                oldWhen.monthlyMode !== newWhen.monthlyMode ||
                oldWhen.yearlyMode !== newWhen.yearlyMode ||
                oldWhen.deadlineType !== newWhen.deadlineType ||
                oldWhen.deadlineDays !== newWhen.deadlineDays ||
                oldWhen.deadlineTime !== newWhen.deadlineTime ||
                oldWhen.deadlineDate !== newWhen.deadlineDate
            );
        }

        function formatCompactDate(dateStr) {
            if (!dateStr) return null;

            if (isNaN(d.getTime())) return null;

        }

        function recalculateWhenDates() {
            if (window._workerDebug) {
                window._workerDebug.lastRecalcTime = new Date().toISOString();
                window._workerDebug.recalcCount++;
            }
            const now = new Date();
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const activatedNodes = [];
            const startedNodes = [];

            state.nodes.forEach(node => {
                const w = node.details?.when;
                // 'disabled' のみスキップ。'none'（1回限り）も開始時刻チェックの対象
                if (!w || w.repeatType === 'disabled') return;

                const nextDate = w.nextDate ? new Date(w.nextDate) : null;
                if (!nextDate) return;

                const nextDateStart = new Date(nextDate.getFullYear(), nextDate.getMonth(), nextDate.getDate());
                let isStarted = false;

                if (node.completed) {
                    // 完了状態で開始日を過ぎていれば有効化(日付のみ比較)
                    if (nextDateStart <= todayStart) {
                        node.completed = false;
                        node.completedAt = null;
                        activatedNodes.push({ id: node.id, title: node.title, date: nextDate, priority: node.details?.priority || 3 });
                        console.log(`[When] ノード「${node.title}」を有効化(開始日: ${nextDate.toLocaleDateString('ja-JP')})`);
                    }
                } else {
                    // 有効状態で開始日時を通過していれば通知
                    if (nextDate <= now) {
                        startedNodes.push({ id: node.id, title: node.title, date: nextDate, priority: node.details?.priority || 3 });
                        isStarted = true;
                        console.log(`[When] ノード「${node.title}」の開始時刻を通過(${nextDate.toLocaleString('ja-JP')})`);
                    }
                }

                // 期限が過ぎていて未完了の場合は nextDate を更新しない（期限切れ表示を維持）
                const deadlineDate = calculateDeadlineDate(w, nextDate);
                if (!node.completed && deadlineDate && now > deadlineDate) {
                    console.log(`[When] ノード「${node.title}」は期限切れのため次回日時を更新しません`);
                    return;
                }

                // 次回日時を再計算(有効化・通知の有無に関わらず)
                // 開始時刻を通過したノードは次回日時を更新しない（started状態を維持）
                if (!isStarted) {
                    const newNextDate = calculateNextDate(w);
                    if (newNextDate) {
                        w.nextDate = newNextDate.toISOString();
                    }
                }
            });

            // --- 有効化通知 ---
            const activatedCount = activatedNodes.length;
            if (activatedCount > 0) {
                renderNodes();

                // 画面内トースト
                if (activatedCount === 1) {
                    showToast(`「${activatedNodes[0].title}」を有効化しました`);
                } else {
                    const titles = activatedNodes.map(n => `・${n.title}`).join('\n');
                    showToast(`${activatedCount}個のタスクを有効化しました\n${titles}`);
                }

                // デスクトップ通知
                const maxPriority = Math.max(...activatedNodes.map(n => n.priority || 3));
                sendWhenNotification(
                    activatedCount === 1 ? 'タスクを有効化しました' : `${activatedCount}個のタスクを有効化しました`,
                    activatedCount === 1
                        ? `「${activatedNodes[0].title}」が本日の予定です`
                        : activatedNodes.map(n => `・${n.title}`).join('\n'),
                    maxPriority
                );
                // アクティブ化要求
                requestAttention(activatedCount, maxPriority);
            }

            // --- 開始時刻通過通知 ---
            // 初回通知のみ（_notifiedTasksで重複防止）
            const newStartedNodes = startedNodes.filter(n => {
                const key = n.id + '-started-' + n.date.toISOString().slice(0, 16);
                if (_notifiedTasks.has(key)) return false;
                _notifiedTasks.add(key);
                return true;
            });
            const startedCount = newStartedNodes.length;
            if (startedCount > 0) {
                // 画面内トースト
                if (startedCount === 1) {
                    showToast(`「${newStartedNodes[0].title}」の開始時刻です`);
                } else {
                    const titles = newStartedNodes.map(n => `・${n.title}`).join('\n');
                    showToast(`${startedCount}個のタスクが開始時刻を通過しました\n${titles}`);
                }

                // デスクトップ通知
                const maxPriority2 = Math.max(...newStartedNodes.map(n => n.priority || 3));
                sendWhenNotification(
                    startedCount === 1 ? '開始時刻を通過しました' : `${startedCount}個のタスクが開始時刻を通過しました`,
                    startedCount === 1
                        ? `「${newStartedNodes[0].title}」の開始時刻を通過しました`
                        : newStartedNodes.map(n => `・${n.title}`).join('\n'),
                    maxPriority2
                );
                // アクティブ化要求
                requestAttention(startedCount, maxPriority2);
            }

            // ノードの状態が変化した場合は再描画（startedNodes全体で判定）
            if (activatedCount > 0 || startedNodes.length > 0) {
                requestAnimationFrame(() => {
                    renderNodes();
                    // Force reflow to ensure visual update without user interaction
                    document.body.offsetHeight;
                    console.log('[When] renderNodes called via requestAnimationFrame');
                });
            }

            return activatedCount + startedCount;
        }

        function updateWhenOnComplete(node) {
            const w = node.details?.when;
            if (!w || !w.repeatType || w.repeatType === 'disabled') return;
            
            const now = new Date();
            const nowDateStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            
            // 一度だけのタスクは完了で次回日時をクリア
            if (w.repeatType === 'none') {
                w._prevNextDate = w.nextDate || null;
                w.nextDate = null;
                w.lastCompleted = now.toISOString();
                return;
            }
            
            // 繰り返しタスク: 完了日時が開始日時を超過している場合、baseDateTimeを再計算
            w._prevNextDate = w.nextDate || null;
            w.lastCompleted = now.toISOString();
            
            // 完了日時が開始日時を超過している場合、baseDateTimeを次回に合わせて更新
            const baseDt = w.baseDateTime ? new Date(w.baseDateTime) : null;
            if (baseDt && now > baseDt) {
                w._prevBaseDateTime = w.baseDateTime;
                w._prevBaseTime = w.baseTime;
                
                // 開始日時を次回日時に更新（完了時点で適切な次回に追いつかせる）
                const nextBase = calculateNextDate(w);
                if (nextBase) {
                    w.baseDateTime = nextBase.toISOString();
                    w.baseTime = `${String(nextBase.getHours()).padStart(2,'0')}:${String(nextBase.getMinutes()).padStart(2,'0')}`;
                    console.log(`[When] 「${node.title}」開始日時更新: baseDateTime=${w.baseDateTime}`);
                }
            }
            
            // nextDateを再計算（更新されたbaseDateTimeを基点）
            const next = calculateNextDate(w);
            if (next) {
                w.nextDate = next.toISOString();
                
                // 次回日時が当日の場合は再有効化（当日の予定が残っている）
                const nextDateStart = new Date(next.getFullYear(), next.getMonth(), next.getDate());
                if (nextDateStart <= nowDateStart) {
                    node.completed = false;
                    node.completedAt = null;
                    console.log(`[When] 「${node.title}」完了→再有効化（次回日時が当日: ${next.toLocaleString('ja-JP')}）`);
                } else {
                    console.log(`[When] 「${node.title}」完了更新: nextDate=${w.nextDate}`);
                }
            } else {
                w.nextDate = null;
                console.log(`[When] 「${node.title}」完了更新: nextDate=null（計算不能）`);
            }
        }

        /**
         * 完了を取消（次回日時を元に戻す）
         */
        function undoWhenComplete(node) {
            const w = node.details?.when;
            if (!w) return;
            
            // 保存していた前回の値を復元
            if (w._prevNextDate !== undefined) {
                w.nextDate = w._prevNextDate;
                delete w._prevNextDate;
            }
            if (w._prevBaseDateTime !== undefined) {
                w.baseDateTime = w._prevBaseDateTime;
                delete w._prevBaseDateTime;
            }
            if (w._prevBaseTime !== undefined) {
                w.baseTime = w._prevBaseTime;
                delete w._prevBaseTime;
            }
            
            console.log(`[When] 「${node.title}」完了取消: nextDate=${w.nextDate}`);
        }

        // Audio通知（ブラウザが非アクティブ・通知ブロック時でも鳴る）
        let _audioCtx = null;
        function getAudioContext() {
            if (!_audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return null;
                _audioCtx = new AudioContext();
            }
            return _audioCtx;
        }

        // AudioContextの自動再生ポリシー対応：ユーザー操作でresume
        function resumeAudioContext() {
            const ctx = getAudioContext();
            if (ctx && ctx.state === 'suspended') {
                ctx.resume().catch(() => {});
            }
            return ctx;
        }

        function playNotificationSound(priority = 3) {
            try {
                const ctx = resumeAudioContext();
                if (!ctx) return;
                // 念のためstateチェック
                if (ctx.state === 'suspended') {
                    console.log('[Audio] Context still suspended after resume attempt');
                    return;
                }
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                const freqs = [523, 659, 784, 880, 1047]; // 優先度に応じた音階
                osc.frequency.value = freqs[Math.min(priority - 1, 4)] || 784;
                osc.type = priority >= 4 ? 'square' : 'sine';
                gain.gain.setValueAtTime(0.25, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.4);
                // 2回鳴らす（優先度3以上）
                if (priority >= 3) {
                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.frequency.value = freqs[Math.min(priority - 1, 4)] || 784;
                    osc2.type = osc.type;
                    gain2.gain.setValueAtTime(0.25, ctx.currentTime + 0.25);
                    gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.65);
                    osc2.start(ctx.currentTime + 0.25);
                    osc2.stop(ctx.currentTime + 0.65);
                }
            } catch (e) {
                console.log('[Audio] Failed to play sound:', e);
            }
        }

        // デスクトップ通知送信ヘルパー（Audioフォールバック付き）
        function sendWhenNotification(title, body, priority = 3) {
            let sent = false;
            const sendNative = () => {
                if (!('Notification' in window)) return false;
                const doSend = () => {
                    const n = new Notification(title, { body: body, icon: '/favicon.ico' });
                    n.addEventListener('click', () => {
                        window.focus();
                        if (navigator.clearAppBadge) navigator.clearAppBadge();
                    });
                };
                if (Notification.permission === 'granted') {
                    doSend(); sent = true; return true;
                } else if (Notification.permission === 'default') {
                    Notification.requestPermission().then(p => { if (p === 'granted') doSend(); });
                    return false;
                }
                return false;
            };
            sendNative();
            return sent;
        }

        // ページ可視性状態（非アクティブ検知用）

            return document.hidden || document.visibilityState === 'hidden';
