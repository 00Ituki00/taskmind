                        items.push({ text: '接続を削除', icon: '🗑️', class: 'delete', action: () => {
                            if (confirm('この接続を削除しますか?')) {
                                deleteConnection(connFrom, connTo);
                            }
                        }});
                    }
                }
                
                // Canvas items
                if (!targetConnGroup && state.connectingFrom) {
                    items.push({ text: '接続モードをキャンセル', icon: '❌', action: () => {
                        state.connectingFrom = null;
                        const tempLine = document.getElementById('pending-connection');
                        if (tempLine) tempLine.remove();
                        modeIndicator.classList.remove('active');
                        setMode('select');
                    }});
                } else {
                    items.push({ text: 'ノード追加', icon: '📦', action: () => {
                        const cx = (x - state.panX) / state.scale;
                        const cy = (y - state.panY) / state.scale;
                        createNode(cx, cy);
                    }});
                }

                if (state.selectedNodeIds.length > 1) {
                    items.push({ text: 'グループ化', icon: '📁', action: () => {
                        const name = prompt('グループ名:', 'グループ');
                        if (name) createGroup([...state.selectedNodeIds], name);
                        clearSelection();
                    }});
                } else if (state.selectedNodeId) {
                    items.push({ text: 'グループ化', icon: '📁', action: () => {
                        const selected = [state.selectedNodeId];
                        const name = prompt('グループ名:', 'グループ');
                        if (name) createGroup(selected, name);
                    }});
                }
            }

            items.push({ text: '', class: 'context-separator' });
            items.push({ text: '全体表示', icon: '⬛', action: fitToView });

            console.log('Context menu items count:', items.length, 'targetChildNode:', !!targetChildNode, 'targetNode:', !!targetNode);

            items.forEach(item => {
                if (item.class === 'context-separator') {
                    const sep = document.createElement('div');
                    sep.className = 'context-separator';
                    menu.appendChild(sep);
                } else {
                    const el = document.createElement('div');
                    el.className = 'context-item' + (item.class ? ' ' + item.class : '');
                    el.innerHTML = `${item.icon} ${item.text}`;
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        try {
                            item.action();
                        } catch (err) {
                            console.error('Error in menu action:', err);
                        }
                        menu.remove();
                    });
                    menu.appendChild(el);
                }
            });

            document.body.appendChild(menu);

            // Adjust position to stay in viewport
            const rect = menu.getBoundingClientRect();
            if (rect.right > window.innerWidth) menu.style.left = (window.innerWidth - rect.width - 10) + 'px';
            if (rect.bottom > window.innerHeight) menu.style.top = (window.innerHeight - rect.height - 10) + 'px';

            const close = (e) => {
                if (!menu.contains(e.target)) {
                    menu.remove();
                    document.removeEventListener('click', close);
                }
            };
            setTimeout(() => document.addEventListener('click', close), 10);
        }

        // ==================== Keyboard Shortcuts ====================
        document.addEventListener('keydown', (e) => {
            if (e.target.isContentEditable) {
                if (e.key === 'Escape') e.target.blur();
                return;
            }

            if (e.key === ' ' && !state.isPanning) {
                e.preventDefault();
                setMode('pan');
                return;
            }

            if (e.key === 'v' || e.key === 'V') setMode('select');
            if (e.key === 'n' || e.key === 'N') setMode('node');
            if (e.key === 'c' || e.key === 'C') setMode('connect');
            if (e.key === 'g' || e.key === 'G') {
                if (state.selectedNodeIds.length > 1) {
                    const name = prompt('グループ名:', 'グループ');
                    if (name) {
                        createGroup([...state.selectedNodeIds], name);
                        clearSelection();
                    }
                } else {
                    setMode('group');
                }
            }

            if (e.key === 'u' || e.key === 'U') {
                if (state.selectedNodeId) {
                    const node = state.nodes.find(n => n.id === state.selectedNodeId);
                    if (node && node.parentId !== null) {
                        node.parentId = null;
                        renderNodes();
                        showToast('親子関係を解除しました');
                    }
                }
            }

            if (e.key === 'Delete' || e.key === 'Backspace') {
                // Skip if user is typing in an input, textarea, or contenteditable
                const active = document.activeElement;
                if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) {
                    return;
                }
                if (state.selectedNodeIds.length > 0) {
                    state.selectedNodeIds.forEach(id => deleteNode(id));
                    clearSelection();
                } else if (state.selectedNodeId) {
                    deleteNode(state.selectedNodeId);
                    state.selectedNodeId = null;
                }
            }

            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveToFile();
            }

            if (e.key === 'Escape') {
                // Clear pending connection
                state.connectingFrom = null;
                const tempLine = document.getElementById('pending-connection');
                if (tempLine) tempLine.remove();
                modeIndicator.classList.remove('active');

                setMode('select');
                state.selectedNodeId = null;
                renderNodes();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === ' ' && state.mode === 'pan') {
                setMode('select');
            }
        });

        // ==================== Selection Box ====================
        function updateSelectionBox(x1, y1, x2, y2) {
            const box = document.getElementById('selection-box');
            if (!x1) {
                box.style.display = 'none';
                return;
            }
            box.style.display = 'block';
            box.style.left = Math.min(x1, x2) + 'px';
            box.style.top = Math.min(y1, y2) + 'px';
            box.style.width = Math.abs(x2 - x1) + 'px';
            box.style.height = Math.abs(y2 - y1) + 'px';
        }

        // ==================== Group Drag ====================
        function handleGroupMouseDown(e, group) {
            if (e.button !== 0) return;
            e.stopPropagation();
            e.preventDefault();

            state.groupDrag = group;
            const startX = (e.clientX - state.panX) / state.scale;
            const startY = (e.clientY - state.panY) / state.scale;
            state.groupDragOffsetX = startX - group.x;
            state.groupDragOffsetY = startY - group.y;

            // Also drag all member nodes
            const nodePositions = new Map();
            group.nodeIds.forEach(id => {
                const node = state.nodes.find(n => n.id === id);
                if (node) {
                    nodePositions.set(id, { x: node.x, y: node.y });
                }
            });
            state.groupDragNodePositions = nodePositions;
        }

        function handleGroupTouchStart(e, group) {
            e.stopPropagation();
            e.preventDefault();

            const touch = e.touches[0];
            state.groupDrag = group;
            const startX = (touch.clientX - state.panX) / state.scale;
            const startY = (touch.clientY - state.panY) / state.scale;
            state.groupDragOffsetX = startX - group.x;
            state.groupDragOffsetY = startY - group.y;

            const nodePositions = new Map();
            group.nodeIds.forEach(id => {
                const node = state.nodes.find(n => n.id === id);
                if (node) {
                    nodePositions.set(id, { x: node.x, y: node.y });
                }
            });
            state.groupDragNodePositions = nodePositions;
        }
        function saveToFile() {
            const data = {
                version: 2,
                nodes: state.nodes,
                connections: state.connections,
                nextId: state.nextId
            };

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `taskmind-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('保存しました');
        }

        function loadFromFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    state.nodes = (data.nodes || []).map(n => {
                        const node = {
                            ...n,
                            completed: n.completed ?? false
                        };
                        delete node.tasks;
                        return node;
                    });
                    
                    // Build children arrays from parentId for old data compatibility
                    state.nodes.forEach(node => {
                        if (!node.children || node.children.length === 0) {
                            node.children = state.nodes
                                .filter(n => n.parentId === node.id)
                                .map(n => n.id);
                        }
                    });
                    state.connections = data.connections || [];
                    state.nextId = data.nextId || 1;

                    // Migrate old groups data to parentId relationships
                    if (data.groups && data.groups.length > 0) {
                        data.groups.forEach(g => {
                            if (g.nodeIds && g.nodeIds.length > 0) {
                                const parentId = g.nodeIds[0];
                                g.nodeIds.slice(1).forEach(childId => {
                                    const child = state.nodes.find(n => n.id === childId);
                                    if (child) child.parentId = parentId;
                                });
                            }
                        });
                    }
                    renderNodes();
                    renderConnections();
                    renderGroups();
                    fitToView();
                    showToast('読込みました');
                } catch (err) {
                    showToast('読込エラー: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        document.getElementById('btn-save').addEventListener('click', saveToFile);
        document.getElementById('btn-load').addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) loadFromFile(e.target.files[0]);
        });

        // ==================== Utils ====================
        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), 2000);
        }

        // ==================== Init ====================
        // Create sample data
        const node1 = createNode(100, 100, 'ゲーム開発');
        node1.completed = false;
        const node2 = createNode(400, 80, 'アート');
        node2.completed = false;
        const node3 = createNode(400, 250, 'プログラミング');
        node3.completed = false;

        // No parent-child relationship for initial nodes - they are independent
        // Users can nest them via drag & drop if needed

        createConnection(1, 2, '依頼');
        createConnection(1, 3, '実装');

        fitToView();
    </script>
</body>
</html>
