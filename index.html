        // Sort children of a node recursively: incomplete first, then by date (nextDate/deadlineDate asc),
        // then preserving original manual order (stable), createdAt as last fallback
        function sortNodeChildren(node) {
            if (!node.children || node.children.length < 2) return;
            
            // Record original order to respect manual drag-and-drop order as stable sort tie-breaker
            const originalOrder = new Map();
            node.children.forEach((id, idx) => originalOrder.set(id, idx));
            
            node.children.sort((aId, bId) => {
                const a = state.nodes.find(n => n.id === aId);
                const b = state.nodes.find(n => n.id === bId);
                if (!a || !b) return 0;
                
                // 1. Completed nodes go to bottom
                if (a.completed !== b.completed) {
                    return a.completed ? 1 : -1;
                }
                
                // 2. Sort by date (nextDate > deadlineDate), earlier first
                const aWhen = a.details?.when;
                const bWhen = b.details?.when;
                const aDate = aWhen?.nextDate || aWhen?.deadlineDate || null;
                const bDate = bWhen?.nextDate || bWhen?.deadlineDate || null;
                
                if (aDate && bDate) {
                    const diff = new Date(aDate) - new Date(bDate);
                    if (diff !== 0) return diff;
                } else if (aDate && !bDate) {
                    return -1; // nodes with date come first
                } else if (!aDate && bDate) {
                    return 1;
                }
                
                // 3. Preserve manual order (original children array index)
                const aIdx = originalOrder.get(aId) ?? 0;
                const bIdx = originalOrder.get(bId) ?? 0;
                if (aIdx !== bIdx) {
                    return aIdx - bIdx;
                }
                
                // 4. createdAt as final fallback
                const ad = a.createdAt ? new Date(a.createdAt) : new Date(0);
                const bd = b.createdAt ? new Date(b.createdAt) : new Date(0);
                return ad - bd;
            });
            
            // Recursively sort nested children
            node.children.forEach(childId => {
                const child = state.nodes.find(n => n.id === childId);
                if (child) sortNodeChildren(child);
            });
        }

        function saveChildPosition(node) {
            const parent = node.parentId !== null ? state.nodes.find(n => n.id === node.parentId) : null;
            if (parent && parent.children) {
                node._prevChildIndex = parent.children.indexOf(node.id);
            }
        }

        function restoreChildPosition(node) {
            if (node._prevChildIndex === undefined) return;
            const parent = node.parentId !== null ? state.nodes.find(n => n.id === node.parentId) : null;
            if (!parent || !parent.children) { delete node._prevChildIndex; return; }
            const idx = parent.children.indexOf(node.id);
            if (idx < 0) { delete node._prevChildIndex; return; }
            parent.children.splice(idx, 1);
            const targetIndex = Math.min(node._prevChildIndex, parent.children.length);
            parent.children.splice(targetIndex, 0, node.id);
            delete node._prevChildIndex;
        }

        function mergeChildToParent(nodeId) {
            const childNode = state.nodes.find(n => n.id === nodeId);
            if (!childNode || childNode.parentId === null) return;

            const parentNode = state.nodes.find(n => n.id === childNode.parentId);
            if (!parentNode) return;

            // 1. Append child's title to parent's details.what
            const childTitle = childNode.title || '';
            const parentWhat = parentNode.details?.what || '';
            const newWhat = parentWhat ? parentWhat + '\n- ' + childTitle : '- ' + childTitle;
            if (!parentNode.details) parentNode.details = {};
            parentNode.details.what = newWhat;

            // 2. Merge other details from child (when, who, where, why, link)
            const childDetails = childNode.details || {};
            const mergeFields = ['when', 'who', 'where', 'why', 'link'];
            mergeFields.forEach(field => {
                if (childDetails[field] && !parentNode.details[field]) {
                    parentNode.details[field] = childDetails[field];
                }
            });

            // 3. Move child's children to parent (if any)
            if (childNode.children && childNode.children.length > 0) {
                childNode.children.forEach(childId => {
                    const grandChild = state.nodes.find(n => n.id === childId);
                    if (grandChild) {
                        grandChild.parentId = parentNode.id;
                    }
                });
                if (!parentNode.children) parentNode.children = [];
                parentNode.children = parentNode.children.concat(childNode.children);
            }

            // 4. Move connections from child to parent
            state.connections.forEach(conn => {
                if (conn.from === childNode.id) {
                    conn.from = parentNode.id;
                }
                if (conn.to === childNode.id) {
                    conn.to = parentNode.id;
                }
            });
            // Remove duplicate connections that may have been created
            state.connections = state.connections.filter((conn, index, self) => {
                return index === self.findIndex(c => c.from === conn.from && c.to === conn.to);
            });

            // 5. Remove child from parent's children array
            if (parentNode.children) {
                parentNode.children = parentNode.children.filter(id => id !== childNode.id);
            }

            // 6. Delete child node
            deleteNode(childNode.id);

            renderAll();
            showToast('子ノードを親に統合しました');
        }

        function deleteNode(nodeId) {
            const deletedNode = state.nodes.find(n => n.id === nodeId);

            // Remove from parent's children array if it's a child node
            if (deletedNode && deletedNode.parentId !== null) {
                const parent = state.nodes.find(n => n.id === deletedNode.parentId);
                if (parent && parent.children) {
                    parent.children = parent.children.filter(id => id !== nodeId);
                    // Auto-collapse parent when no children remain
                    if (parent.children.length === 0) {
                        parent.expanded = false;
                    }
                }
            }

            state.nodes = state.nodes.filter(n => n.id !== nodeId);
            state.connections = state.connections.filter(c => c.from !== nodeId && c.to !== nodeId);

            // Clear parentId of child nodes if this node was their parent
            state.nodes.forEach(n => {
                if (n.parentId === nodeId) {
                    n.parentId = null;
                }
            });

            renderAll();
            saveSnapshot();
        }

        // ==================== Helpers ====================
        function darkenColor(color, factor = 0.75) {
            const hex = color.replace('#', '');
            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);
            const dr = Math.round(r * factor);
            const dg = Math.round(g * factor);
            const db = Math.round(b * factor);
            return `#${dr.toString(16).padStart(2,'0')}${dg.toString(16).padStart(2,'0')}${db.toString(16).padStart(2,'0')}`;
        }

        function getNodeConnectionSidePoint(node, otherNode, isSource) {
            // Use cached DOM rect if available (set by renderConnections)
            let nx, ny, nodeWidth, nodeHeight;
            const cached = state._nodeRectCache && state._nodeRectCache[node.id];
            if (cached) {
                nx = cached.x; ny = cached.y;
                nodeWidth = cached.width; nodeHeight = cached.height;
            } else {
                const domEl = document.querySelector(`.node[data-id="${node.id}"]`);
                if (domEl) {
                    const canvasRect = document.getElementById('canvas-container').getBoundingClientRect();
                    const rect = domEl.getBoundingClientRect();
                    nx = (rect.left - canvasRect.left - state.panX) / state.scale;
                    ny = (rect.top - canvasRect.top - state.panY) / state.scale;
                    nodeWidth = rect.width / state.scale;
                    nodeHeight = rect.height / state.scale;
                } else {
                    nx = node.x; ny = node.y;
                    if (node.parentId !== null) {
                        const abs = getNodeAbsolutePosition(node);
                        nx = abs.x; ny = abs.y;
                    }
                    nodeWidth = node.width || 200;
                    nodeHeight = node.height || 50;
                }
            }

            let otherWidth = otherNode.width || 200;
            const otherCached = state._nodeRectCache && state._nodeRectCache[otherNode.id];
            if (otherCached) {
                otherWidth = otherCached.width;
            } else {
                const otherDomEl = document.querySelector(`.node[data-id="${otherNode.id}"]`);
                if (otherDomEl) {
                    otherWidth = otherDomEl.offsetWidth / state.scale;
                }
            }

    let ox = otherNode.x, oy = otherNode.y;
    if (otherNode.parentId !== null) {
        const abs = getNodeAbsolutePosition(otherNode);
        ox = abs.x; oy = abs.y;
    }

    const ncx = nx + nodeWidth / 2;
    const ocx = ox + otherWidth / 2;

    // 相手が右にいるなら右端、左にいるなら左端（接続元/先関係なく同じ判定）
    const otherOnRight = ocx >= ncx;

    // 子ノードの場合は親ノードの外に接続点を出すため、オフセットを大きくする
    const isChildNode = node.parentId !== null;
    const offset = isChildNode ? 12 : 0;

    if (otherOnRight) {
        return { x: nx + nodeWidth + offset, y: ny + nodeHeight / 2 };
    } else {
        return { x: nx - offset, y: ny + nodeHeight / 2 };
    }
}

function getNodeEdgePoint(node, targetNode) {
            // Use cached DOM rect if available (set by renderConnections)
            let nodeWidth, nodeHeight, cx, cy;
            const cached = state._nodeRectCache && state._nodeRectCache[node.id];
            if (cached) {
                nodeWidth = cached.width;
                nodeHeight = cached.height;
                cx = cached.x + nodeWidth / 2;
                cy = cached.y + nodeHeight / 2;
            } else {
                const domEl = document.querySelector(`.node[data-id="${node.id}"]`);
                if (domEl) {
                    const canvasRect = document.getElementById('canvas-container').getBoundingClientRect();
                    const rect = domEl.getBoundingClientRect();
                    nodeWidth = rect.width / state.scale;
                    nodeHeight = rect.height / state.scale;
                    const nx = (rect.left - canvasRect.left - state.panX) / state.scale;
                    const ny = (rect.top - canvasRect.top - state.panY) / state.scale;
                    cx = nx + nodeWidth / 2;
                    cy = ny + nodeHeight / 2;
                } else {
                    nodeWidth = node.width || 200;
                    nodeHeight = node.height || 50;
                    cx = node.x + nodeWidth / 2;
                    cy = node.y + nodeHeight / 2;
                }
            }
            const halfW = nodeWidth / 2;
            const halfH = nodeHeight / 2;

            let targetWidth = targetNode.width || 200;
            let targetHeight = targetNode.height || 50;
            let tx, ty;
            const targetCached = state._nodeRectCache && state._nodeRectCache[targetNode.id];
            if (targetCached) {
                targetWidth = targetCached.width;
                targetHeight = targetCached.height;
                tx = targetCached.x + targetWidth / 2;
                ty = targetCached.y + targetHeight / 2;
            } else {
                const targetDomEl = document.querySelector(`.node[data-id="${targetNode.id}"]`);
                if (targetDomEl) {
                    const canvasRect = document.getElementById('canvas-container').getBoundingClientRect();
                    const rect = targetDomEl.getBoundingClientRect();
                    targetWidth = rect.width / state.scale;
                    targetHeight = rect.height / state.scale;
                    const tox = (rect.left - canvasRect.left - state.panX) / state.scale;
                    const toy = (rect.top - canvasRect.top - state.panY) / state.scale;
                    tx = tox + targetWidth / 2;
                    ty = toy + targetHeight / 2;
                } else {
                    tx = targetNode.x + targetWidth / 2;
                    ty = targetNode.y + targetHeight / 2;
                    if (targetNode.parentId !== null) {
                        const abs = getNodeAbsolutePosition(targetNode);
                        tx = abs.x + targetWidth / 2;
                        ty = abs.y + targetHeight / 2;
                    }
                }
            }

            const dx = tx - cx;
            const dy = ty - cy;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);

            if (absDx < 0.001 && absDy < 0.001) {
                return { x: cx + halfW, y: cy };
            }

            const t = Math.min(halfW / absDx, halfH / absDy);
            return {
                x: cx + dx * t,
                y: cy + dy * t
            };
        }

        function enableTitleEdit(titleEl, node) {
            console.log('enableTitleEdit called', titleEl, node);

            // DOM要素から正確な位置を取得
            // 優先順位: 1)タイトル要素のrect 2)ノード要素から計算 3)座標から計算
            let rect;
            const nodeEl = document.querySelector(`.node[data-id="${node.id}"]`);
            const headerEl = nodeEl ? nodeEl.querySelector('.node-header') : null;
            
            if (titleEl && document.contains(titleEl)) {
                // 最も正確: 実際のタイトル要素のrect
                rect = titleEl.getBoundingClientRect();
            } else if (headerEl && document.contains(headerEl)) {
                // フォールバック: ヘッダー要素から推定
                const headerRect = headerEl.getBoundingClientRect();
                // ヘッダー内でタイトルが占める領域を推定
                // color(16px) + gap(8px) + title + gap(8px) + expand-btn(~14px)
                const leftOffset = 16 + 16 + 8; // padding + checkbox + gap
                const rightOffset = 16 + 14 + 8; // padding + expand-btn + gap
                rect = {
                    left: headerRect.left + leftOffset,
                    top: headerRect.top + (headerRect.height - 24) / 2,
                    width: Math.max(headerRect.width - leftOffset - rightOffset, 100),
                    height: 24
                };
            } else if (nodeEl && document.contains(nodeEl)) {
                // フォールバック2: ノード全体から推定
                const nodeRect = nodeEl.getBoundingClientRect();
                rect = {
                    left: nodeRect.left + 40,
                    top: nodeRect.top + 12,
                    width: Math.max(nodeRect.width - 80, 100),
                    height: 24
                };
            } else {
                // 最終フォールバック: canvas座標から計算
                const containerRect = document.getElementById('canvas-container').getBoundingClientRect();
                rect = {
                    left: containerRect.left + node.x * state.scale + state.panX,
                    top: containerRect.top + node.y * state.scale + state.panY,
                    width: 200,
                    height: 30
                };
            }

            const originalText = node.title || '無題';

            // Create overlay input positioned over the title element
            const input = createEl('input', {
                attrs: { type: 'text', value: originalText },
                style: {
                    position: 'fixed',
                    left: rect.left + 'px',
                    top: rect.top + 'px',
                    width: Math.max(rect.width + 20, 150) + 'px',
                    height: Math.max(rect.height + 8, 30) + 'px',
                    fontSize: '14px',
                    fontWeight: 500,
                    color: THEME.text,
                    border: `2px solid ${THEME.primary}`,
                    borderRadius: '4px',
                    background: THEME.white,
                    padding: '2px 6px',
                    outline: 'none',
                    zIndex: 10000,
                    boxSizing: 'border-box',
                    boxShadow: '0 2px 8px rgba(0,0,0,0.2)'
                }
            });

            document.body.appendChild(input);
            input.focus();
            input.select();
            console.log('Overlay input created and focused');

            const cleanup = () => {
                if (input.parentNode) {
                    try {
                        input.parentNode.removeChild(input);
                    } catch (e) {
                        // Already removed, ignore
                    }
                }
                document.removeEventListener('mousedown', onDocMouseDown);
            };

            const save = () => {
                if (!input.parentNode) return; // Already cleaned up
                node.title = input.value || '無題';
                cleanup();
                renderNodes();
                saveSnapshot();
            };

            input.addEventListener('blur', () => {
                save();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    save();
                }
                if (e.key === 'Escape') {
                    e.preventDefault();
                    cleanup();
                    renderNodes();
                    clearSelection();
                }
            });

            // 入力ボックス以外のクリックで確定（blurが発火しない場合のフォールバック）
            const onDocMouseDown = (e) => {
                if (!input.parentNode) {
                    document.removeEventListener('mousedown', onDocMouseDown);
                    return;
                }
                if (e.target === input || input.contains(e.target)) return;
                save();
                document.removeEventListener('mousedown', onDocMouseDown);
            };
            document.addEventListener('mousedown', onDocMouseDown);
        }

        function enableConnectionLabelEdit(conn) {
            const fromNode = state.nodes.find(n => n.id === conn.from);
            const toNode = state.nodes.find(n => n.id === conn.to);
            if (!fromNode || !toNode) return;

            // Calculate label position (midpoint of connection)
            const fromCx = fromNode.x;
            const fromCy = fromNode.y + 18;
            const toCx = toNode.x;
            const toCy = toNode.y + 18;
            const labelX = (fromCx + toCx) / 2;
            const labelY = (fromCy + toCy) / 2 - 10;

            // Convert canvas coordinates to screen coordinates
            const containerRect = document.getElementById('canvas-container').getBoundingClientRect();
            const screenX = containerRect.left + labelX * state.scale + state.panX;
            const screenY = containerRect.top + labelY * state.scale + state.panY;

            // Create overlay input
            const input = createEl('input', {
                attrs: { type: 'text', value: conn.label || '', placeholder: 'ラベル' },
                style: {
                    position: 'fixed',
                    left: (screenX - 75) + 'px',
                    top: (screenY - 15) + 'px',
                    width: '150px',
                    height: '30px',
                    fontSize: '14px',
                    color: THEME.text,
                    border: `2px solid ${THEME.primary}`,
                    borderRadius: '4px',
                    background: THEME.white,
                    padding: '2px 6px',
                    outline: 'none',
                    zIndex: 10000,
                    boxSizing: 'border-box',
                    boxShadow: '0 2px 8px rgba(0,0,0,0.2)',
                    textAlign: 'center'
                }
            });

            document.body.appendChild(input);
            input.focus();
            input.select();

            const cleanup = () => {
                if (input.parentNode) {
                    input.parentNode.removeChild(input);
                }
            };

            const save = () => {
                if (!input.parentNode) return;
                conn.label = input.value || '';
                cleanup();
                renderConnections();
            };

            input.addEventListener('blur', save);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    save();
                }
                if (e.key === 'Escape') {
                    e.preventDefault();
                    cleanup();
                    renderConnections();
                }
            });
        }

        // Helper: get absolute position of any node (handles nested depths)
        function getNodeAbsolutePosition(node) {
            let absX = node.x;
            let absY = node.y;
            let current = node;
            while (current.parentId !== null) {
                const parent = state.nodes.find(n => n.id === current.parentId);
                if (!parent) break;
                absX += parent.x;
                absY += parent.y;
                current = parent;
            }
            return { x: absX, y: absY };
        }

        function createIndicator(node, type) {
            const el = createEl('span', {

            if (type === 'priority') {
                el.classList.add('priority');

                if (p === 0) {
                    el.textContent = '☆';
                } else {
                    el.textContent = '★';
                    el.classList.add('active');
                }
            } else if (type === 'when') {
                const w = node.details?.when;
                const hasValue = w && w.repeatType !== 'none';
                el.textContent = '🕐';
                if (hasValue) el.classList.add('active');
            } else if (type === 'what') {
                const hasValue = node.details?.what;
                el.textContent = '📝';
                if (hasValue) el.classList.add('active');
            } else if (type === 'who') {
                const hasValue = node.details?.who;
                el.textContent = '👤';
                if (hasValue) el.classList.add('active');
            } else if (type === 'where') {
                const hasValue = node.details?.where;
                el.textContent = '📍';
                if (hasValue) el.classList.add('active');
            } else if (type === 'link') {
                const hasValue = node.details?.link;
                el.textContent = '🔗';
                if (hasValue) el.classList.add('active');
            }

            if (type === 'priority') {
                let _lastMouseX = 0, _lastMouseY = 0;
                el.addEventListener('mousedown', (e) => {
                    console.log('[DEBUG] priority mousedown fired. target=', e.target.outerHTML.substring(0, 50));
                    _lastMouseX = e.clientX; _lastMouseY = e.clientY;
                    // ピッカー用クリック候補を記録(mouseupで判定)
                    state.pendingPriorityClick = {
                        nodeId: node.id,
                        element: el,
                        x: e.clientX,
                        y: e.clientY,
                        handled: false
                    };
                });
                el.addEventListener('mouseup', (e) => {
                    console.log('[DEBUG] priority mouseup fired. target=', e.target.outerHTML.substring(0, 50), 'same element?', e.target === el);
                    // mousedownで記録した要素と同じ要素でmouseupしたか確認
                    const pending = state.pendingPriorityClick;
                    if (pending && pending.element === el && !pending.handled && !state.isDragging) {
                        pending.handled = true;
                        console.log('[DEBUG] priority click detected via mouseup!');
                        // ピッカー作成処理を実行
                        createPriorityPicker(node, el, _lastMouseX || e.clientX, _lastMouseY || e.clientY);
                    }
                    state.pendingPriorityClick = null;
                });
                // clickイベントはフォールバックとして残す(ブラウザがclickを発火する場合)
                el.addEventListener('click', (e) => {
                    console.log('[DEBUG] priority click fired! target=', e.target.outerHTML.substring(0, 50));
                    e.stopPropagation();
                    // mouseupで既に処理済みなら無視
                    if (state.pendingPriorityClick && state.pendingPriorityClick.handled) {
                        state.pendingPriorityClick = null;
                        return;
                    }
                    createPriorityPicker(node, el, _lastMouseX || e.clientX, _lastMouseY || e.clientY);
                });
            } else {
                // priorityと同じくmousedown+mouseupでクリック検出(clickイベントが発火しない問題対策)
                let _lastMouseX = 0, _lastMouseY = 0;
                el.addEventListener('mousedown', (e) => {
                    console.log('[DEBUG] indicator mousedown fired. type=' + type);
                    e.stopPropagation();
                    _lastMouseX = e.clientX;
                    _lastMouseY = e.clientY;
                    state.pendingIndicatorClick = {
                        nodeId: node.id,
                        type: type,
                        element: el,
                        x: e.clientX,
                        y: e.clientY,
                        handled: false
                    };
                });
                el.addEventListener('mouseup', (e) => {
                    console.log('[DEBUG] indicator mouseup fired. type=' + type);
                    e.stopPropagation();
                    const pending = state.pendingIndicatorClick;
                    if (pending && pending.element === el && !pending.handled && !state.isDragging) {
                        pending.handled = true;
                        console.log('[DEBUG] indicator click detected via mouseup! type=' + type);
                        if (type === 'when') {
                            openWhenEditor(node);
                        } else {
                            openDetailEditor(node, type);
                        }
                    }
                    state.pendingIndicatorClick = null;
                });
                // clickイベントはフォールバックとして残す
                el.addEventListener('click', (e) => {
                    console.log('[DEBUG] indicator click fired. type=' + type);
                    e.stopPropagation();
                    if (state.pendingIndicatorClick && state.pendingIndicatorClick.handled) {
                        state.pendingIndicatorClick = null;
                        return;
                    }
                    if (type === 'when') {
                        openWhenEditor(node);
                    } else {
                        openDetailEditor(node, type);
                    }
                });
            }

            return el;
        }

        // Unified When Editor UI Generator
        // Returns { el, getValue, updatePreview }
        // UI types: none | daily | weekly | monthly-day | monthly-week | yearly-date | yearly-week
        function getWhenUIType(whenData) {
            const w = whenData || {};
            let uiType = w.repeatType || 'disabled';
            if (uiType === 'monthly') uiType = (w.monthlyMode === 'week') ? 'monthly-week' : 'monthly-day';
            if (uiType === 'yearly') uiType = (w.yearlyMode === 'week') ? 'yearly-week' : 'yearly-date';
            return uiType;
        }

        function formatWhenPreviewText(uiType, baseStr, baseTimeStr, daysOfWeek, weekOfMonth, yearMonth, yearDay, monthDay, dayNames, weekOptions) {
            if (uiType === 'disabled') return 'なし（期限・プログレスバーなし）';
            if (uiType === 'none') return '開始:' + baseStr;

            let text = '次回:' + baseStr + '\n周期:';
            const weekLabel = weekOptions.find(o => o.key === weekOfMonth)?.label || '';
            const fmtDays = () => {
                if (!daysOfWeek || daysOfWeek.length === 0) return '未選択';
                if (daysOfWeek.length === 7) return '毎日';
                return daysOfWeek.sort().map(d => dayNames[d]).join('・') + '曜日';
            };

            switch (uiType) {
                case 'daily': text += '毎日 ' + baseTimeStr; break;
                case 'weekly': text += weekLabel + fmtDays() + ' ' + baseTimeStr; break;
                case 'monthly-day': text += '毎月 ' + monthDay + '日 ' + baseTimeStr; break;
                case 'monthly-week': text += '毎月 ' + weekLabel + fmtDays() + ' ' + baseTimeStr; break;
                case 'yearly-date': text += '毎年 ' + yearMonth + '月 ' + yearDay + '日 ' + baseTimeStr; break;
                case 'yearly-week': text += '毎年 ' + yearMonth + '月 ' + weekLabel + fmtDays() + ' ' + baseTimeStr; break;
            }
            return text;
        }

        function formatDateTimeInfo(dates) {
            const fmt = dateStr => {
                if (!dateStr) return null;
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return null;
                return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            };

            let html = '';
            if (dates.createdAt) html += `<div>📝 登録: ${fmt(dates.createdAt)}</div>`;
            if (dates.base) html += `<div>▶ 開始: ${fmt(dates.base)}</div>`;
            if (dates.deadline) html += `<div>⏰ 締切: ${fmt(dates.deadline)}</div>`;
            if (dates.next) html += `<div>📌 次回: ${fmt(dates.next)}</div>`;
            if (dates.last) html += `<div>✓ 完了: ${fmt(dates.last)}</div>`;
            return html || '<div style="color:#999;">日時情報なし</div>';
        }

        function createWhenEditorUI(whenData, onChange, createdAt) {
            const w = whenData || {};
            const dayNames = ['月', '火', '水', '木', '金', '土', '日'];
            const weekOptions = [
                { key: 'all', label: '毎週' },
                { key: '1', label: '第1' },
                { key: '2', label: '第2' },
                { key: '3', label: '第3' },
                { key: '4', label: '第4' },
                { key: 'last', label: '最終' }
            ];

            let uiType = getWhenUIType(whenData);

            let currentDaysOfWeek = w.daysOfWeek || (w.dayOfWeek !== undefined ? [w.dayOfWeek] : [0]);
            let currentWeekOfMonth = w.weekOfMonth || 'all';
            let currentYearMonth = w.yearMonth !== undefined ? w.yearMonth : 1;
            let currentYearDay = w.yearDay !== undefined ? w.yearDay : 1;
            let currentMonthDay = w.monthDay !== undefined ? w.monthDay : 1;

            const container = createEl('div', { class: 'when-editor-content' });

            // --- 周期タイプ(7種類、モード切替なし) ---

            const yearlyDateSection = createEl('div', {

            const yearMonthInput = createEl('input', {

            // --- 年-月指定(毎年(曜日)) ---
            const yearlyMonthSection = createEl('div', {

            const yearWeekMonthInput = createEl('input', {

            // --- 開始日時 ---
            const timeSection = createEl('div', { class: 'when-section' });

            const timeInput = createEl('input', {

                on: {
                    change: () => { updatePreview(); if (onChange) onChange(getValue()); }
                }
            });
            // デフォルト値: 今日の09:00
            const defaultBase = new Date();
            defaultBase.setHours(9, 0, 0, 0);
            const toLocalISO = d => {
                const pad = n => String(n).padStart(2, '0');
                return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
            };
            // baseDateTime優先、なければbaseTimeから生成、それもなければデフォルト
            const isoToLocalISO = isoStr => {
                const d = new Date(isoStr);
                const pad = n => String(n).padStart(2, '0');
                return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
            };
            if (w.baseDateTime) {
                timeInput.value = isoToLocalISO(w.baseDateTime);
            } else if (w.baseTime) {
                const today = new Date();
                const [h, m] = w.baseTime.split(':');
                today.setHours(parseInt(h), parseInt(m), 0, 0);
                timeInput.value = toLocalISO(today);
            } else {
                timeInput.value = toLocalISO(defaultBase);
            }
            timeRow.appendChild(timeInput);
            timeSection.appendChild(timeRow);

            // --- 期限 ---
            const deadlineSection = createEl('div', { class: 'when-section' });

            function updateDeadlineUI() {
                relativeRow.style.display = currentDeadlineType === 'relative' ? 'flex' : 'none';

            deadlineTypeRow.appendChild(dlTypeRelative);
            deadlineTypeRow.appendChild(dlTypeAbsolute);

            // 相対期限

                attrs: { type: 'datetime-local' },
                style: { flex: '1', padding: '4px 6px', border: '1px solid #ddd', borderRadius: '4px', fontSize: '12px' },
                on: { change: () => { updatePreview(); if (onChange) onChange(getValue()); } }
            });
            // デフォルト値: 現在時刻+1日の18:00
            const defaultDl = new Date();
            defaultDl.setDate(defaultDl.getDate() + 1);
            defaultDl.setHours(18, 0, 0, 0);
            deadlineDateInput.value = w.deadlineDate ? isoToLocalISO(w.deadlineDate) : toLocalISO(defaultDl);
            absoluteRow.appendChild(deadlineDateInput);
            absoluteRow.appendChild(document.createTextNode(' まで'));
            deadlineSection.appendChild(absoluteRow);

            container.appendChild(deadlineSection);

            // --- 次回日時（手動編集） ---
            const nextDateSection = createEl('div', { class: 'when-section' });
            createEl('div', {
                class: 'when-section-label',

            const autoCalcCheckbox = createEl('input', {

            const autoCalcLabel = createEl('label', {
                attrs: { for: autoCalcId },

            const nextDateInput = createEl('input', {

                style: { flex: '1', padding: '4px 6px', border: '1px solid #ddd', borderRadius: '4px', fontSize: '12px', background: '#f5f5f5' },
                on: {

                }
            });

            autoCalcCheckbox.addEventListener('change', () => {
                nextDateInput.disabled = autoCalcCheckbox.checked;
                nextDateInput.style.background = autoCalcCheckbox.checked ? '#f5f5f5' : '#fff';
                if (autoCalcCheckbox.checked && w.nextDate) {
                    nextDateInput.value = isoToLocalISO(w.nextDate);
                }
            });

            nextDateRow.appendChild(autoCalcCheckbox);
            nextDateRow.appendChild(autoCalcLabel);
            nextDateRow.appendChild(nextDateInput);
            nextDateSection.appendChild(nextDateRow);
            container.appendChild(nextDateSection);

            // --- 日時情報(5項目) ---
            const dateInfoSection = createEl('div', {
                class: 'when-section',
                style: { background: '#f8f9fa', borderRadius: '6px', padding: '8px 10px', fontSize: '11px', color: '#555', lineHeight: '1.6' }
            });
            createEl('div', {
                style: { fontWeight: 600, marginBottom: '4px', color: '#333', fontSize: '12px' },
                text: '📅 日時情報',
                parent: dateInfoSection
            });
            const dateInfoContent = createEl('div', {
                attrs: { id: 'when-date-info-' + Math.random().toString(36).slice(2, 8) },
                parent: dateInfoSection
            });
            container.appendChild(dateInfoSection);

            // --- プレビュー ---
            const previewSection = createEl('div', { class: 'when-section', parent: container });
            const preview = createEl('div', { class: 'when-preview', parent: previewSection });

            function updateConditionalSections() {
                const isDisabled = (uiType === 'disabled');
                timeSection.style.display = isDisabled ? 'none' : 'block';
                deadlineSection.style.display = isDisabled ? 'none' : 'block';
                nextDateSection.style.display = isDisabled ? 'none' : 'block';
                weekSection.style.display = (uiType === 'weekly' || uiType === 'monthly-week' || uiType === 'yearly-week') ? 'block' : 'none';
                // 毎週・毎月(曜日)・毎年(曜日)共通で「毎週」〜「最終」オプション表示
                const needAllOption = (uiType === 'weekly');
                const currentVal = weekSelect.value;
                weekSelect.innerHTML = '';
                (needAllOption ? weekOptions : weekOptions.filter(o => o.key !== 'all')).forEach(opt => {
                    createEl('option', {
                        attrs: { value: opt.key },
                        text: opt.label,
                        parent: weekSelect
                    });
                });
                // 選択値を復元(無効な場合は毎週に)
                if (Array.from(weekSelect.options).some(o => o.value === currentVal)) {
                    weekSelect.value = currentVal;
                } else {
                    weekSelect.value = 'all';
                }
                currentWeekOfMonth = weekSelect.value;
                monthlyDaySection.style.display = (uiType === 'monthly-day') ? 'block' : 'none';
                yearlyDateSection.style.display = (uiType === 'yearly-date') ? 'block' : 'none';
                yearlyMonthSection.style.display = (uiType === 'yearly-week') ? 'block' : 'none';
            }

            function getValue() {
                // UIタイプ→データ変換
                let repeatType = uiType;
                let monthlyMode = 'day';
                let yearlyMode = 'date';
                if (uiType === 'monthly-day') { repeatType = 'monthly'; monthlyMode = 'day'; }
                if (uiType === 'monthly-week') { repeatType = 'monthly'; monthlyMode = 'week'; }
                if (uiType === 'yearly-date') { repeatType = 'yearly'; yearlyMode = 'date'; }
                if (uiType === 'yearly-week') { repeatType = 'yearly'; yearlyMode = 'week'; }

                if (repeatType === 'disabled') return null;

                const manualNextDate = (!autoCalcCheckbox.checked && nextDateInput.value) ? new Date(nextDateInput.value).toISOString() : null;

                return {
                    repeatType: repeatType,
                    baseDateTime: timeInput.value ? new Date(timeInput.value).toISOString() : null,
                    baseTime: timeInput.value ? timeInput.value.substring(11, 16) : '09:00',
                    deadlineType: currentDeadlineType,
                    deadlineDays: parseInt(deadlineDays.value) || 0,
                    deadlineTime: deadlineTime.value || '18:00',
                    deadlineDate: deadlineDateInput.value ? new Date(deadlineDateInput.value).toISOString() : null,
                    daysOfWeek: currentDaysOfWeek.slice(),
                    weekOfMonth: currentWeekOfMonth,
                    yearMonth: currentYearMonth,
                    yearDay: currentYearDay,
                    monthDay: currentMonthDay,
                    monthlyMode: monthlyMode,
                    yearlyMode: yearlyMode,
                    nextDate: manualNextDate || w.nextDate || null,
                    lastCompleted: w.lastCompleted || null
                };
            }

            function updatePreview() {
                const baseDt = timeInput.value;
                const baseDate = baseDt ? new Date(baseDt) : null;
                let baseStr = baseDate ? baseDate.toLocaleString('ja-JP', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '09:00';
                const baseTimeStr = baseDt ? baseDt.substring(11, 16) : '09:00';
                const dd = parseInt(deadlineDays.value) || 0;
                const dt = deadlineTime.value;
                const dlType = currentDeadlineType;
                const dlDate = deadlineDateInput.value ? new Date(deadlineDateInput.value).toISOString() : null;

                // nextDateが存在すれば優先して表示（完了更新後の反映）
                let displayStr = baseStr;
                if (w.nextDate) {
                    const nextD = new Date(w.nextDate);
                    displayStr = nextD.toLocaleString('ja-JP', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                }

                let text = formatWhenPreviewText(uiType, displayStr, baseTimeStr, currentDaysOfWeek, currentWeekOfMonth, currentYearMonth, currentYearDay, currentMonthDay, dayNames, weekOptions);

                // 期限(開始の後に表示)
                if (uiType !== 'disabled') {
                    if (dlType === 'absolute' && dlDate) {
                        const dl = new Date(dlDate);
                        text += '\n期限:' + dl.toLocaleString('ja-JP', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' まで';
                    } else if (dd > 0 || dt !== baseTimeStr) {
                        text += '\n期限:開始から ' + dd + ' 日後 ' + dt + ' まで';
                    }
                }

                preview.innerHTML = text.replace(/\n/g, '<br>');

                // 日時情報更新
                const baseDtIso = timeInput.value ? new Date(timeInput.value).toISOString() : null;
                const dlDateIso = deadlineDateInput.value ? new Date(deadlineDateInput.value).toISOString() : null;
                dateInfoContent.innerHTML = formatDateTimeInfo({
                    createdAt: createdAt,
                    base: baseDtIso,
                    deadline: dlDateIso,
                    next: w.nextDate || null,
                    last: w.lastCompleted || null
                });
            }

            updatePreview();

            // 初期化時に期限タイプの表示状態を反映
            updateDeadlineUI();

            // 初期化時に条件付きセクションの表示状態を反映
            updateConditionalSections();

            return { el: container, getValue, updatePreview };
        }

        function openWhenEditor(node) {
            const existing = document.querySelector('.when-editor-popup');
            if (existing) existing.remove();

            if (!node.details) node.details = { why: '', what: '', who: '', where: '', link: '' };

            const popup = createEl('div', {
                class: 'when-editor-popup',
                style: { position: 'fixed', background: 'white', border: '1px solid #ddd', borderRadius: '10px', padding: '16px', boxShadow: '0 8px 32px rgba(0,0,0,0.18)', zIndex: 10000, width: '300px', fontSize: '13px' }
            });

            createEl('div', { class: 'when-editor-title', html: '🕐 When(周期・期限)', parent: popup });

            const editor = createWhenEditorUI(node.details.when, null, node.createdAt);
            popup.appendChild(editor.el);

            const btnRow = createEl('div', { class: 'when-buttons', parent: popup });
            createEl('button', { class: 'when-btn clear', text: 'クリア', on: { click: () => { if (node.details) delete node.details.when; popup.remove(); renderNodes(); } }, parent: btnRow });
            createEl('button', { class: 'when-btn cancel', text: 'キャンセル', on: { click: () => popup.remove() }, parent: btnRow });
            createEl('button', { class: 'when-btn save', text: '保存', on: { click: () => { const oldWhen = node.details.when || null; const newWhen = editor.getValue(); if (newWhen === null) { if (node.details) delete node.details.when; } else { node.details.when = newWhen; if (didScheduleChange(oldWhen, newWhen) || !newWhen.nextDate) node.details.when.nextDate = calculateNextDate(node.details.when); } popup.remove(); renderNodes(); } }, parent: btnRow });

            document.body.appendChild(popup);
            const rect = popup.getBoundingClientRect();
            popup.style.left = Math.min(window.innerWidth - rect.width - 10, Math.max(10, (window.innerWidth / 2) - (rect.width / 2))) + 'px';
            popup.style.top = Math.min(window.innerHeight - rect.height - 10, Math.max(10, (window.innerHeight / 2) - (rect.height / 2))) + 'px';

            closeOnClickOutside(popup);
        }

        // When progress bar generator
        // Returns HTMLElement or null
        function createWhenProgressBar(node) {
            const w = node.details?.when;
            if (!w || !w.repeatType) return null;
            const isCompleted = node.completed;
            const hasNextDate = !!w.nextDate;

            const now = new Date();
            const nextDate = hasNextDate ? new Date(w.nextDate) : null;
            const baseForDeadline = nextDate || (w.baseDateTime ? new Date(w.baseDateTime) : new Date());

            // Calculate deadline date
            let deadlineDate;
            if (w.deadlineType === 'absolute' && w.deadlineDate) {
                deadlineDate = new Date(w.deadlineDate);
            } else {
                const [dlHours, dlMinutes] = (w.deadlineTime || '18:00').split(':');
                deadlineDate = new Date(baseForDeadline);
                deadlineDate.setDate(deadlineDate.getDate() + (w.deadlineDays || 0));
                deadlineDate.setHours(parseInt(dlHours), parseInt(dlMinutes), 0, 0);
            }

            const container = createEl('div', { class: 'when-progress-container', style: { padding: '2px 8px 4px', fontSize: '11px' } });

            // Info row (only for non-completed tasks with nextDate)
            if (hasNextDate && !isCompleted) {
                const infoRow = createEl('div', {
                    style: { display: 'flex', justifyContent: 'space-between', gap: '4px', color: '#666', marginBottom: '6px', whiteSpace: 'nowrap', overflow: 'hidden', fontSize: '10px' },
                    parent: container
                });

                const leftInfo = createEl('span', { style: { overflow: 'hidden', textOverflow: 'ellipsis', flexShrink: 0 }, parent: infoRow });
                const centerInfo = createEl('span', { style: { overflow: 'hidden', textOverflow: 'ellipsis', textAlign: 'center', flex: 1 }, parent: infoRow });
                const rightInfo = createEl('span', { style: { overflow: 'hidden', textOverflow: 'ellipsis', flexShrink: 0, textAlign: 'right' }, parent: infoRow });

                // Time formatting helper
                const fmtHM = d => `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                const fmtDate = d => `${d.getMonth()+1}/${d.getDate()}`;

                if (now < nextDate) {
                    // Before start
                    const diffMs = nextDate - now;
                    const diffH = Math.floor(diffMs / 3600000);
                    const diffM = Math.floor((diffMs % 3600000) / 60000);
                    const until = diffH > 0 ? `${diffH}h${diffM}m` : `${diffM}m`;
                    leftInfo.textContent = `▶${until}`;
                    centerInfo.textContent = `開始 ${fmtHM(nextDate)}`;
                    if (w.deadlineType === 'absolute' || w.deadlineDays > 0) {
                        rightInfo.textContent = `期限 ${fmtDate(deadlineDate)} ${fmtHM(deadlineDate)}`;
                    } else {
                        rightInfo.textContent = `期限 ${fmtHM(deadlineDate)}`;
                    }
                } else if (now < deadlineDate) {
                    // Between start and deadline
                    const diffMs = deadlineDate - now;
                    const diffH = Math.floor(diffMs / 3600000);
                    const diffM = Math.floor((diffMs % 3600000) / 60000);
                    const remain = diffH > 0 ? `${diffH}h${diffM}m` : `${diffM}m`;
                    leftInfo.textContent = `開始 ${fmtHM(nextDate)}`;
                    centerInfo.textContent = `残り ${remain}`;
                    if (w.deadlineType === 'absolute' || w.deadlineDays > 0) {
                        rightInfo.textContent = `期限 ${fmtDate(deadlineDate)} ${fmtHM(deadlineDate)}`;
                    } else {
                        rightInfo.textContent = `期限 ${fmtHM(deadlineDate)}`;
                    }
                } else {
                    // After deadline
                    leftInfo.textContent = `開始 ${fmtHM(nextDate)}`;
                    centerInfo.textContent = '期限切れ';
                    if (w.deadlineType === 'absolute' || w.deadlineDays > 0) {
                        rightInfo.textContent = `期限 ${fmtDate(deadlineDate)} ${fmtHM(deadlineDate)}`;
                    } else {
                        rightInfo.textContent = `期限 ${fmtHM(deadlineDate)}`;
                    }
                }

                // Progress bar: left edge = 8:00 today, now marker moves right over time
                const barTrack = createEl('div', {
                    style: { height: '10px', borderRadius: '5px', position: 'relative', marginTop: '2px', background: '#f5f5f5', overflow: 'visible' },
                    parent: container
                });

                // Time scale starts at 8:00 today
                const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 8, 0, 0, 0);
                const maxDist = Math.max(now - dayStart, nextDate - dayStart, deadlineDate - dayStart);
                const scaleMs = Math.max(maxDist, 3600000) * 1.15; // at least 1h visible + 15% margin

                // Positions relative to 8:00
                const startPct = Math.min(100, Math.max(0, ((nextDate - dayStart) / scaleMs) * 100));
                const deadlinePct = Math.min(100, Math.max(0, ((deadlineDate - dayStart) / scaleMs) * 100));
                const nowPct = Math.min(100, Math.max(0, ((now - dayStart) / scaleMs) * 100));

                // Determine active zone color
                let activeColor = '#4caf50';
                if (now >= deadlineDate) {
                    activeColor = '#f44336';
                } else if (now >= nextDate) {
                    const totalActiveMs = deadlineDate - nextDate;
                    const elapsedMs = now - nextDate;
                    const remainingPct = totalActiveMs > 0 ? 100 - (elapsedMs / totalActiveMs * 100) : 0;
                    if (remainingPct <= 20) activeColor = '#f44336';
                    else if (remainingPct <= 50) activeColor = '#ff9800';
                    else activeColor = '#4caf50';
                }

                // 1. Zone before start: grey striped
                if (startPct > 0) {
                    createEl('div', {
                        style: { position: 'absolute', left: 0, top: 0, height: '100%', width: startPct + '%', background: 'repeating-linear-gradient(90deg,#ddd 0px,#ddd 3px,transparent 3px,transparent 6px)', borderRadius: '5px 0 0 5px', opacity: 0.5 },
                        parent: barTrack
                    });
                }

                // 2. Active zone (start to deadline): colored bar
                if (nextDate < deadlineDate) {
                    const activeStart = startPct;
                    const activeEnd = Math.min(100, deadlinePct);
                    const activeWidth = activeEnd - activeStart;
                    if (activeWidth > 0) {
                        createEl('div', {
                            style: { position: 'absolute', left: activeStart + '%', top: 0, height: '100%', width: activeWidth + '%', background: activeColor, opacity: now >= nextDate ? 1 : 0.3, transition: 'opacity 0.3s ease' },
                            parent: barTrack
                        });
                    }
                }

                // 3. Start marker: white vertical line
                if (startPct >= 0 && startPct <= 100) {
                    createEl('div', {
                        style: { position: 'absolute', left: startPct + '%', top: 0, width: '2px', height: '100%', background: 'rgba(255,255,255,0.9)', transform: 'translateX(-50%)' },
                        parent: barTrack
                    });
                }

                // 4. Deadline marker: dark vertical line
                if (deadlinePct >= 0 && deadlinePct <= 100) {
                    createEl('div', {
                        style: { position: 'absolute', left: deadlinePct + '%', top: '-1px', width: '2px', height: '12px', background: '#555', borderRadius: '1px', transform: 'translateX(-50%)' },
                        parent: barTrack
                    });
                }

                // 5. Now marker: triangle that moves right over time
                const nowClamped = Math.min(100, Math.max(0, nowPct));
                const nowMarker = createEl('div', {
                    style: { position: 'absolute', left: nowClamped + '%', top: '-5px', width: 0, height: 0, borderLeft: '4px solid transparent', borderRight: '4px solid transparent', borderTop: '5px solid #333', transform: 'translateX(-50%)', zIndex: 3 },
                    attrs: { title: `現在 ${fmtHM(now)}` },
                    parent: barTrack
                });
            } else if (isCompleted) {
                // 完了時：コンパクト表示（チェックマーク+次回日時は下部で統一）
                // 進捗バー自体は非表示、下部のコンパクト行のみ表示
            }

            // 日時表示エリア
            if (isCompleted) {
                // 完了時：チェックマーク + 次回日時のみ（コンパクト）
                const compactRow = createEl('div', {
                    style: { display: 'flex', alignItems: 'center', gap: '4px', color: '#888', fontSize: '10px', marginTop: '2px' },
                    parent: container
                });
                createEl('span', { text: '✓', style: { color: '#4caf50' }, parent: compactRow });
                if (w.nextDate) {
                    const nextText = createEl('span', { parent: compactRow });
                    nextText.textContent = `次回:${formatCompactDate(w.nextDate)}`;
                    compactRow.appendChild(nextText);
                }
                container.appendChild(compactRow);
            }

            return container;
        }

        // Calculate next activation date based on when settings
        function calculateNextDate(when) {
            if (!when || !when.repeatType) return null;

            // Normalize repeatType for legacy UI types ('monthly-day' -> 'monthly', etc.)
            let repeatType = when.repeatType;
            if (repeatType === 'monthly-day' || repeatType === 'monthly-week') repeatType = 'monthly';
            if (repeatType === 'yearly-date' || repeatType === 'yearly-week') repeatType = 'yearly';

            const now = new Date();
            let hours, minutes;
            let next;

            if (when.baseDateTime) {
                const baseDate = new Date(when.baseDateTime);
                hours = baseDate.getHours();
                minutes = baseDate.getMinutes();
                next = new Date(baseDate);
            } else {
                const timeParts = (when.baseTime || '09:00').split(':');
                hours = parseInt(timeParts[0]);
                minutes = parseInt(timeParts[1]);
                next = new Date(now);
                next.setHours(hours, minutes, 0, 0);
            }

            // 一度だけの場合は baseDateTime/baseTime をそのまま nextDate として使用
            if (repeatType === 'none') {
                return next;
            }

            if (repeatType === 'daily') {
                if (next <= now) {
                    // baseDateTimeが古い場合も高速に計算: 日数差を直接加算
                    const daysToAdd = Math.floor((now - next) / (24 * 60 * 60 * 1000)) + 1;
                    next.setDate(next.getDate() + daysToAdd);
                }
            }

            // Fast-forward old baseDateTime to near now for weekly/monthly/yearly
            // to prevent bounded search loops from failing on very old dates
            if (repeatType !== 'none' && repeatType !== 'daily') {
                if (next <= now) {
                    const daysDiff = Math.floor((now - next) / (24 * 60 * 60 * 1000));
                    const buffer = repeatType === 'weekly' ? 30 : repeatType === 'monthly' ? 60 : 365;
                    if (daysDiff > buffer) {
                        next.setDate(next.getDate() + daysDiff - buffer);
                    }
                }
            }

            if (repeatType === 'weekly') {
                const targetDays = when.daysOfWeek || (when.dayOfWeek !== undefined ? [when.dayOfWeek] : [0]);
                const weekOfMonth = when.weekOfMonth || 'all';
                if (targetDays.length === 0) return null;

                let found = false;
                for (let i = 0; i < 60; i++) {
                    const check = new Date(next);
                    check.setDate(check.getDate() + i);
                    const dayOfWeek = (check.getDay() + 6) % 7;

                    if (!targetDays.includes(dayOfWeek)) continue;

                    // Check week of month
                    if (weekOfMonth !== 'all') {
                        const date = check.getDate();
                        let weekNum;
                        if (weekOfMonth === 'last') {
                            const lastDay = new Date(check.getFullYear(), check.getMonth() + 1, 0);
                            const lastWeekStart = lastDay.getDate() - (lastDay.getDay() + 6) % 7;
                            weekNum = (date >= lastWeekStart) ? 'last' : null;
                        } else {
                            weekNum = Math.floor((date - 1) / 7) + 1;
                        }
                        if (String(weekNum) !== String(weekOfMonth)) continue;
                    }

                    if (check > now) {
                        next = check;
                        found = true;
                        break;
                    }
                }
                if (!found) return null;
            } else if (repeatType === 'monthly') {
                const monthlyMode = when.monthlyMode || 'day';
                if (monthlyMode === 'week') {
                    // 毎月 第◯週 ◯曜日
                    const targetDays = when.daysOfWeek || (when.dayOfWeek !== undefined ? [when.dayOfWeek] : [0]);
                    const weekOfMonth = when.weekOfMonth || '1';
                    if (targetDays.length === 0) return null;

                    let found = false;
                    for (let m = 0; m < 12; m++) {
                        const checkMonth = new Date(next);
                        checkMonth.setMonth(checkMonth.getMonth() + m);
                        const firstDayOfMonth = new Date(checkMonth.getFullYear(), checkMonth.getMonth(), 1);

                        for (let d = 0; d < 31; d++) {
                            const check = new Date(firstDayOfMonth);
                            check.setDate(check.getDate() + d);
                            if (check.getMonth() !== firstDayOfMonth.getMonth()) break;

                            const dayOfWeek = (check.getDay() + 6) % 7;
                            if (!targetDays.includes(dayOfWeek)) continue;

                            const date = check.getDate();
                            let weekNum;
                            if (weekOfMonth === 'last') {
                                const lastDay = new Date(check.getFullYear(), check.getMonth() + 1, 0);
                                const lastWeekStart = lastDay.getDate() - (lastDay.getDay() + 6) % 7;
                                weekNum = (date >= lastWeekStart) ? 'last' : null;
                            } else {
                                weekNum = Math.floor((date - 1) / 7) + 1;
                            }
                            if (String(weekNum) !== String(weekOfMonth)) continue;

                            const checkTime = new Date(check);
                            checkTime.setHours(parseInt(hours), parseInt(minutes), 0, 0);
                            if (checkTime > now) {
                                next = checkTime;
                                found = true;
                                break;
                            }
                        }
                        if (found) break;
                    }
                    if (!found) return null;
                } else {
                    // 毎月 ◯日
                    const targetDay = when.monthDay || 1;
                    next.setDate(targetDay);
                    while (next <= now) {
                        next.setMonth(next.getMonth() + 1);
                    }
                }
            } else if (repeatType === 'yearly') {
                const yearlyMode = when.yearlyMode || 'date';
                if (yearlyMode === 'week') {
                    // 毎年 ◯月 第◯週 ◯曜日
                    const targetDays = when.daysOfWeek || (when.dayOfWeek !== undefined ? [when.dayOfWeek] : [0]);
                    const weekOfMonth = when.weekOfMonth || '1';
                    const targetMonth = (when.yearMonth || 1) - 1;
                    if (targetDays.length === 0) return null;

                    let found = false;
                    for (let y = 0; y < 2; y++) {
                        const checkYear = new Date(next);
                        checkYear.setFullYear(checkYear.getFullYear() + y);
                        const firstDayOfMonth = new Date(checkYear.getFullYear(), targetMonth, 1);

                        for (let d = 0; d < 31; d++) {
                            const check = new Date(firstDayOfMonth);
                            check.setDate(check.getDate() + d);
                            if (check.getMonth() !== firstDayOfMonth.getMonth()) break;

                            const dayOfWeek = (check.getDay() + 6) % 7;
                            if (!targetDays.includes(dayOfWeek)) continue;

                            const date = check.getDate();
                            let weekNum;
                            if (weekOfMonth === 'last') {
                                const lastDay = new Date(check.getFullYear(), check.getMonth() + 1, 0);
                                const lastWeekStart = lastDay.getDate() - (lastDay.getDay() + 6) % 7;
                                weekNum = (date >= lastWeekStart) ? 'last' : null;
                            } else {
                                weekNum = Math.floor((date - 1) / 7) + 1;
                            }
                            if (String(weekNum) !== String(weekOfMonth)) continue;

                            const checkTime = new Date(check);
                            checkTime.setHours(parseInt(hours), parseInt(minutes), 0, 0);
                            if (checkTime > now) {
                                next = checkTime;
                                found = true;
                                break;
                            }
                        }
                        if (found) break;
                    }
                    if (!found) return null;
                } else {
                    // 毎年 ◯月◯日
                    const targetMonth = (when.yearMonth || 1) - 1;
                    const targetDay = when.yearDay || 1;
                    next.setMonth(targetMonth, targetDay);
                    while (next <= now) {
                        next.setFullYear(next.getFullYear() + 1);
                    }
                }
            }

            // 未知のrepeatTypeの場合はnullを返す(不整合データのガード)
            if (!['none', 'daily', 'weekly', 'monthly', 'yearly'].includes(repeatType)) {
                return null;
            }

            return next;
        }

        function getNodeWhenStatus(node) {
            const w = node.details?.when;
            if (!w) return null;
            if (node.completed) return null;
            const now = new Date();
            let startDate = null;
            if (w.repeatType && w.repeatType !== 'none') {
                startDate = w.nextDate ? new Date(w.nextDate) : null;
            } else {
                startDate = w.baseDateTime ? new Date(w.baseDateTime) : null;
            }
            if (!startDate) return null;
            const deadlineDate = calculateDeadlineDate(w, startDate);
            if (deadlineDate && now > deadlineDate) return 'expired';
            if (startDate <= now) return 'started';
            return null;
        }

        function createCompletionCheckbox(node, size) {
            const px = size + 'px';
            return createEl(size <= 14 ? 'span' : 'div', {
                class: 'node-color',
                text: node.completed ? '✓' : '',
                style: {
                    width: px, height: px, borderRadius: '3px',
                    backgroundColor: getNodeDisplayColor(node), cursor: 'pointer',
                    alignItems: 'center', justifyContent: 'center',
                    flexShrink: 0, color: 'white', fontSize: (size <= 14 ? '11px' : '12px'), fontWeight: 'bold'
                },
                on: {
                    mousedown: (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        if (e.button === 2) return;
                        const wasCompleted = node.completed;
                        node.completed = !node.completed;
                        node.completedAt = node.completed ? new Date().toISOString() : null;
                        if (node.completed) {
                            saveChildPosition(node);
                            updateWhenOnComplete(node);
                        } else if (wasCompleted) {
                            undoWhenComplete(node);
                            restoreChildPosition(node);
                        }
                        renderNodes();
                    },
                    contextmenu: (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        showColorPicker(e, node);
                    }
                }
            });
        }

        function createNodeTitle(node) {
            const title = createEl('span', {
                class: 'node-title' + (node.completed ? ' completed' : ''),
                text: node.title
            });
            if (!node.completed) {
                const p = node.priority || 0;
                if (p >= 4) title.style.fontWeight = '700';
                else if (p >= 3) title.style.fontWeight = '600';
                else if (p >= 2) title.style.fontWeight = '500';
            }
            return title;
        }

        function attachNodeEvents(el, node, options = {}) {
            const { stopPropagation = false, includeDragHandlers = false } = options;
            
            el.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                e.stopPropagation();
                showCanvasContextMenu(e.clientX, e.clientY, e);
            });
            
            el.addEventListener('mousedown', (e) => {
                if (stopPropagation) e.stopPropagation();
                handleNodeMouseDown(e, node);
            });
            
            el.addEventListener('touchstart', (e) => handleNodeTouchStart(e, node), { passive: false });
            
            if (includeDragHandlers) {
                el.addEventListener('mouseenter', (e) => handleNodeMouseEnter(e, el, node));
                el.addEventListener('mouseleave', () => handleNodeMouseLeave(el, node));
            }
        }

        function createResizeHandles(node, el, nodesEl) {
                // Show/hide resize handles on node hover
                el.addEventListener('mouseenter', () => {
                    document.querySelectorAll(`.resize-handle[data-node-id="${node.id}"]`).forEach(h => {
                        h.style.opacity = '1';
                    });
                });

                el.addEventListener('mouseleave', () => {
                    document.querySelectorAll(`.resize-handle[data-node-id="${node.id}"]`).forEach(h => {
                        h.style.opacity = '';
                    });
                });

                // Resize handles - appended to nodesEl (outside .node) to avoid overflow clipping
                const positions = ['nw', 'ne', 'sw', 'se'];
                positions.forEach(pos => {
                    const resizeHandle = createEl('div', {
                        class: 'resize-handle ' + pos,
                        attrs: { 'data-node-id': node.id, 'data-pos': pos },
                        on: {
                            mousedown: (e) => {
                                e.stopPropagation();
                                const domEl = document.querySelector(`.node[data-id="${node.id}"]`);
                                state.resizingNode = node;
                                state.resizeHandle = pos;
                                state.resizeStartX = e.clientX;
                                state.resizeStartY = e.clientY;
                                state.resizeStartWidth = node.width || 200;
                                state.resizeStartHeight = node.height || (domEl ? domEl.offsetHeight : 50);

                                let resizeStartLeft, resizeStartTop;
                                if (node.parentId !== null) {
                                    const parent = state.nodes.find(n => n.id === node.parentId);
                                    if (parent) {
                                        const absPos = getNodeAbsolutePosition(node);
                                        resizeStartLeft = absPos.x;
                                        resizeStartTop = absPos.y;
                                    } else {
                                        resizeStartLeft = node.x;
                                        resizeStartTop = node.y;
                                    }
                                } else {
                                    resizeStartLeft = node.x;
                                    resizeStartTop = node.y;
                                }
                                state.resizeStartLeft = resizeStartLeft;
                                state.resizeStartTop = resizeStartTop;

                                if (domEl) {
                                    domEl.classList.add('resizing');
                                }
                                resizeHandle.classList.add('resizing');
                            }
                        }
                    });

                    nodesEl.appendChild(resizeHandle);
                });
            }

            function createDragPreviewNode(node, nodesEl) {
            const el = createEl('div', {
                class: 'node' + (node.completed ? ' completed' : ''),
                attrs: { 'data-id': node.id },
                style: {
                    left: node.x + 'px',
                    top: node.y + 'px',
                    zIndex: node.zIndex || 1
                }
            });
            el.classList.add('dragging-child', 'dragging');
            if (state.dropTarget && state.dropTarget.id === node.id) {
                el.classList.add('drop-target');
            }
            el.style.width = (node.width || 200) + 'px';
            el.style.minHeight = 'auto';
            el.style.padding = '8px 10px';

            const wrapper = createEl('div', { style: { display: 'flex', alignItems: 'center', gap: '6px' } });
            const checkbox = createCompletionCheckbox(node, 14);
            const title = createNodeTitle(node);
            title.style.flex = '1';
            title.style.fontSize = '13px';
            title.style.wordBreak = 'break-word';

            wrapper.appendChild(checkbox);
            wrapper.appendChild(title);
            el.appendChild(wrapper);

            attachNodeEvents(el, node);

            nodesEl.appendChild(el);
        }

        // Apply priority-based border styling to a node element
        function applyPriorityBorder(el, node, displayColor) {
            const p = node.priority || 0;
            if (!node.completed) {
                if (p >= 5) {
                    el.style.border = `3px solid #c0392b`;
                    el.style.borderLeft = `4px solid ${displayColor}`;
                } else if (p >= 4) {
                    el.style.border = `2.5px solid #e74c3c`;
                    el.style.borderLeft = `4px solid ${displayColor}`;
                } else if (p >= 3) {
                    el.style.border = `2px solid #e67e22`;
                    el.style.borderLeft = `3px solid ${displayColor}`;
                } else if (p >= 2) {
                    el.style.border = `1.5px solid #f39c12`;
                    el.style.borderLeft = `3px solid ${displayColor}`;
                } else if (p >= 1) {
                    el.style.border = `1px solid #f0c040`;
                    el.style.borderLeft = `3px solid ${displayColor}`;
                } else {
                    el.style.borderLeft = `3px solid ${displayColor}`;
                }
            } else {
                el.style.borderLeft = `3px solid ${displayColor}`;
            }
        }

        function getHiddenNodeIds() {
            const hiddenNodeIds = new Set();
            state.connections.forEach(conn => {
                if (conn.collapsed) {
                    const hideDescendants = (nodeId) => {
                        hiddenNodeIds.add(nodeId);
                        state.connections
                            .filter(c => c.from === nodeId)
                            .forEach(c => hideDescendants(c.to));
                    };
                    hideDescendants(conn.to);
                }
            });
            return hiddenNodeIds;
        }

        // Helper: Create link icon element
        function createLinkIcon(node, parentEl) {
            const link = node.details?.link?.trim();
            if (!link) return null;
            const linkIcon = createEl('span', {
                text: '🔗',
                title: 'Open link: ' + link,
                style: {
                    marginLeft: '2px', fontSize: '11px', textDecoration: 'none',
                    cursor: 'pointer', flexShrink: 0, opacity: '0.7', transition: 'opacity 0.15s'
                },
                on: {
                    mouseenter: () => linkIcon.style.opacity = '1',
                    mouseleave: () => {
                        linkIcon.style.opacity = '0.7';
                        linkIcon.dataset.linkPending = '';
                    },
                    mousedown: (e) => {
                        e.stopPropagation();
                        linkIcon.dataset.linkPending = 'true';
                    },
                    mouseup: (e) => {
                        e.stopPropagation();
                        if (linkIcon.dataset.linkPending === 'true') {
                            window.open(link, '_blank', 'noopener,noreferrer');
                        }
                        linkIcon.dataset.linkPending = '';
                    }
                },
                parent: parentEl
            });
            return linkIcon;
        }

        function prepareRenderNodes() {
            if (window._workerDebug) {
                window._workerDebug.lastRenderTime = new Date().toISOString();
                window._workerDebug.renderCount++;
            }
            // Save timeline scroll position before clearing
            const oldTimelineContainer = document.querySelector('.timeline-container');
            if (oldTimelineContainer && state.layoutMode === 'timeline') {
                state._timelineScroll = {
                    left: oldTimelineContainer.scrollLeft,
                    top: oldTimelineContainer.scrollTop
                };
            }

            nodesEl.innerHTML = '';

            // Timeline layout mode
            if (state.layoutMode === 'timeline') {
                renderTimeline();
                return false;
            }

            // Restore free layout pan position when switching back from timeline
            if (state._freePanSaved) {
                state.panX = state._freePanX;
                state.panY = state._freePanY;
                state.scale = state._freeScale;
                state._freePanSaved = false;
                updateTransform();
            }

            state.hiddenNodeIds = getHiddenNodeIds();
            return true;
        }

        function buildNodeHeaderContent(node, parentEl, options = {}) {
            const { checkboxSize = 16, tooltipCtrl = null, isChild = false } = options;

            const checkbox = createCompletionCheckbox(node, checkboxSize);
            if (!checkbox) { console.error('createCompletionCheckbox returned null for node', node.id); return null; }
            checkbox.style.marginRight = '4px';
            parentEl.appendChild(checkbox);

            // Type icon
            createTypeIcon(node, parentEl);

            // Title
            const title = createNodeTitle(node);
            parentEl.appendChild(title);

            // Link icon
            createLinkIcon(node, parentEl);

            // Detail indicators
            const indicators = createIndicatorMenu(node);
            if (isChild) {
                indicators.style.cssText = 'position:relative;display:inline-flex;padding:0;gap:2px;font-size:11px;margin-left:4px;';
            }
            parentEl.appendChild(indicators);

            // Expand button
            const expandBtn = createExpandBtn(node, isChild);
            if (!isChild) {
                const hasChildren = state.nodes.some(n => n.parentId === node.id);
                expandBtn.style.visibility = hasChildren ? 'visible' : 'hidden';
            }
            parentEl.appendChild(expandBtn);

            // Task count badge
            const badge = createTaskBadge(node);
            if (badge) parentEl.appendChild(badge);

            // Tooltip setup
            if (tooltipCtrl) {
                const tooltipTargets = isChild
                    ? [checkbox, title, indicators, expandBtn, badge].filter(Boolean)
                    : [parentEl];
                tooltipTargets.forEach(target => {
                    target.addEventListener('mouseenter', () => {
                        if (state.dragNode) return;
                        tooltipCtrl.cancelTimer();
                        tooltipCtrl.scheduleShow(buildNodeTooltipHtml(node), target);
                    });
                    target.addEventListener('mouseleave', () => {
                        tooltipCtrl.cancelTimer();
                        if (tooltipCtrl.isVisible) tooltipCtrl.hide();
                    });
                    target.addEventListener('mousedown', () => {
                        tooltipCtrl.cancelTimer();
                        if (tooltipCtrl.isVisible) tooltipCtrl.hide();
                    });
                });
            }
